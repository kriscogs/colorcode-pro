<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Shopfloor Pros — operator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0E1216; --surface:#161C22; --hair:#232B33; --text:#E8ECEF; --muted:#8B98A5;
    --accent:#5FA8D3; --go:#3FA96B; --flag:#D2564B; --warn:#D9A441;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  button,input,select,textarea{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea,select{cursor:text}
  a{color:var(--accent)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
  .top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--hair);
    padding:14px 20px;display:flex;align-items:center;gap:14px}
  .top .mark{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:17px;letter-spacing:.09em;
    text-transform:uppercase}
  .top .mark em{font-style:normal;color:var(--accent)}
  .top .who{margin-left:auto;font-size:13px;color:var(--muted)}
  .tabs{display:flex;gap:4px;padding:12px 20px 0;border-bottom:1px solid var(--hair);overflow-x:auto}
  .tabs button{padding:9px 15px;border-radius:8px 8px 0 0;font-size:14.5px;color:var(--muted);white-space:nowrap}
  .tabs button[data-on="1"]{color:var(--text);background:var(--surface);font-weight:600}
  h1{font-size:26px;font-weight:600;margin:24px 0 4px}
  .sub{color:var(--muted);font-size:14px}
  .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));margin:18px 0}
  .card{background:var(--surface);border:1px solid var(--hair);border-radius:11px;padding:15px 16px;margin-bottom:12px}
  .stat .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:31px;line-height:1.05;
    font-variant-numeric:tabular-nums}
  .stat .l{font-size:12.5px;color:var(--muted);margin-top:3px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:11px;font-size:11.5px;
    font-weight:600;background:var(--hair);color:var(--muted);white-space:nowrap}
  .chip[data-t="ok"]{background:rgba(63,169,107,.16);color:var(--go)}
  .chip[data-t="bad"]{background:rgba(210,86,75,.16);color:var(--flag)}
  .chip[data-t="warn"]{background:rgba(217,164,65,.16);color:var(--warn)}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);font-weight:500;font-size:12.5px;padding:8px 10px;white-space:nowrap}
  td{padding:11px 10px;border-top:1px solid var(--hair);vertical-align:top}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .field{width:100%;background:var(--bg);border:1px solid var(--hair);border-radius:8px;
    padding:11px 12px;margin-bottom:10px;color:var(--text)}
  .btn{width:100%;padding:12px;border-radius:9px;background:var(--accent);color:#0E1216;
    font-weight:600;margin-bottom:8px}
  .btn[data-v="quiet"]{background:transparent;border:1px solid var(--hair);color:var(--text)}
  .btn.sm{width:auto;padding:8px 14px;font-size:13.5px;margin:0}
  .bars{margin-top:10px}
  .bars .b{display:flex;align-items:center;gap:10px;margin-bottom:7px;font-size:13.5px}
  .bars .b .t{flex:1;height:8px;background:var(--hair);border-radius:4px;overflow:hidden}
  .bars .b .t i{display:block;height:100%;background:var(--accent)}
  .mid{max-width:400px;margin:16vh auto;padding:0 20px}
  .err{color:var(--flag);font-size:13.5px;margin-bottom:10px}
  .quiet{opacity:.55}
</style>
</head>
<body>
<div id="root"><div class="mid"><p class="sub">Starting…</p></div></div>

<script>
  const SUPABASE_URL      = 'https://tlzlsxouwmlpvjeshzqh.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsemxzeG91d21scHZqZXNoenFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDA5ODksImV4cCI6MjEwMzc3Njk4OX0.kJqxNcpXNE2WT8Qnkg0b0WEHGu45l0Um7KdzfpW3l6Y';
  window.addEventListener('error', (e) => {
    const r = document.getElementById('root');
    if (r && r.innerText.indexOf('Starting') === 0) {
      r.innerHTML = '<div class="mid"><h1>Startup error</h1><pre style="white-space:pre-wrap;font-size:12px;color:#D2564B">'
        + String(e.message || e) + '</pre></div>';
    }
  });
</script>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const usd  = (n) => (+n || 0).toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const usd2 = (n) => (+n || 0).toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 });
const num  = (n) => (+n || 0).toLocaleString("en-US");

function SignIn({ onIn, notice }) {
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const go = async () => {
    setBusy(true); setErr("");
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pass });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    onIn();
  };

  return (
    <div className="mid">
      <div className="mark" style={{ fontFamily: "'Barlow Condensed',sans-serif", fontWeight: 700,
        fontSize: 30, letterSpacing: "-.005em", marginBottom: 18,
        display: "flex", alignItems: "baseline", gap: 1 }}>
        Shop<em style={{ fontStyle: "normal", color: "var(--accent)" }}>floor</em>
        <small style={{ fontSize: 14, fontWeight: 600, letterSpacing: ".14em",
          marginLeft: 6, color: "var(--muted)" }}>OPERATOR</small>
      </div>
      <h1 style={{ marginTop: 0 }}>Sign in</h1>
      <p className="sub" style={{ marginBottom: 20 }}>Platform administrators only.</p>
      {notice && <p className="err">{notice}</p>}
      <input className="field" type="email" autoCapitalize="none" placeholder="Email"
        value={email} onChange={(e) => setEmail(e.target.value)} />
      <input className="field" type="password" placeholder="Password" value={pass}
        onChange={(e) => setPass(e.target.value)} onKeyDown={(e) => e.key === "Enter" && go()} />
      {err && <p className="err">{err}</p>}
      <button className="btn" disabled={busy || !email || !pass} onClick={go}>
        {busy ? "Signing in…" : "Sign in"}
      </button>
    </div>
  );
}

function Stat({ n, l, tone }) {
  return (
    <div className="card stat">
      <div className="n" style={tone ? { color: `var(--${tone})` } : null}>{n}</div>
      <div className="l">{l}</div>
    </div>
  );
}

function Overview({ o, signups }) {
  const peak = Math.max(1, ...signups.map((s) => s.n));
  return (
    <>
      <h1>Overview</h1>
      <p className="sub">Everything across every shop.</p>

      <div className="grid">
        <Stat n={usd(o.mrr)} l="Monthly recurring" tone="go" />
        <Stat n={usd(o.arr)} l="Annual run rate" />
        <Stat n={num(o.shops)} l="Shops" />
        <Stat n={num(o.shopsActive7)} l="Used in the last week" />
        <Stat n={num(o.users)} l="People with logins" />
        <Stat n={num(o.ticketsOpen)} l="Open tickets" tone={o.ticketsOpen > 0 ? "warn" : null} />
      </div>

      <div className="grid">
        <Stat n={`+${o.shopsNew7}`} l="New this week" />
        <Stat n={`+${o.shopsNew30}`} l="New in 30 days" />
        <Stat n={num(o.jobs)} l="Jobs on the platform" />
        <Stat n={num(o.clients)} l="Their customers" />
        <Stat n={usd(o.billed)} l="Billed through the app" />
        <Stat n={usd(o.collected)} l="Collected through the app" />
      </div>

      <div className="card">
        <div style={{ fontWeight: 600, marginBottom: 4 }}>Signups, last 12 weeks</div>
        {signups.length === 0 && <p className="sub">Nothing yet.</p>}
        <div className="bars">
          {signups.map((s) => (
            <div className="b" key={s.week}>
              <span style={{ width: 88, color: "var(--muted)" }}>{s.week.slice(5)}</span>
              <span className="t"><i style={{ width: `${(s.n / peak) * 100}%` }} /></span>
              <span style={{ width: 26, textAlign: "right" }}>{s.n}</span>
            </div>
          ))}
        </div>
      </div>

      <p className="sub">
        Billed and collected are the money moving through your customers' shops, not your revenue.
        They're the number that tells you whether the app is actually being used for real work.
      </p>
    </>
  );
}

function Shops({ rows }) {
  const [q, setQ] = useState("");
  const [only, setOnly] = useState("all");

  const shown = rows.filter((r) => {
    if (only === "quiet" && !r.quiet) return false;
    if (only === "new" && r.created < new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10)) return false;
    if (!q.trim()) return true;
    return `${r.name} ${r.city || ""}`.toLowerCase().includes(q.toLowerCase());
  });

  const quiet = rows.filter((r) => r.quiet).length;

  return (
    <>
      <h1>Shops</h1>
      <p className="sub">{rows.length} in total{quiet > 0 ? `, ${quiet} quiet for a fortnight` : ""}.</p>

      <div style={{ display: "flex", gap: 8, margin: "18px 0 10px", flexWrap: "wrap" }}>
        <input className="field" style={{ maxWidth: 280, marginBottom: 0 }} placeholder="Search"
          value={q} onChange={(e) => setQ(e.target.value)} />
        {[["all", "All"], ["new", "New this month"], ["quiet", "Gone quiet"]].map(([k, l]) => (
          <button className="btn sm" key={k} data-v={only === k ? undefined : "quiet"} onClick={() => setOnly(k)}>{l}</button>
        ))}
      </div>

      <div className="card" style={{ overflowX: "auto" }}>
        <table>
          <thead>
            <tr>
              <th>Shop</th><th>Signed up</th><th>Last used</th>
              <th className="num">Crew</th><th className="num">Jobs</th><th className="num">Clients</th>
              <th className="num">Monthly</th><th>Status</th>
            </tr>
          </thead>
          <tbody>
            {shown.map((r) => (
              <tr key={r.id} className={r.quiet ? "quiet" : ""}>
                <td>
                  <div style={{ fontWeight: 600 }}>{r.name}</div>
                  <div style={{ color: "var(--muted)", fontSize: 12.5 }}>{r.city || "—"}</div>
                </td>
                <td>{r.created}</td>
                <td>{r.lastSeen || "never"}</td>
                <td className="num">{r.staff}</td>
                <td className="num">{r.jobs}</td>
                <td className="num">{r.clients}</td>
                <td className="num">{r.monthly ? usd(r.monthly) : "—"}</td>
                <td>
                  <span className="chip" data-t={r.status === "active" ? (r.quiet ? "warn" : "ok") : "bad"}>
                    {r.status === "active" ? (r.quiet ? "Quiet" : "Active") : r.status}
                  </span>
                </td>
              </tr>
            ))}
            {shown.length === 0 && <tr><td colSpan={8} style={{ color: "var(--muted)" }}>Nothing matches.</td></tr>}
          </tbody>
        </table>
      </div>

      <p className="sub">
        A shop that hasn't opened the app in a fortnight is the earliest warning you get before they
        cancel. Worth a phone call rather than an email.
      </p>
    </>
  );
}

function Tickets({ rows, reload }) {
  const [filter, setFilter] = useState("open");
  const [open, setOpen] = useState(null);
  const [reply, setReply] = useState("");
  const [busy, setBusy] = useState(false);

  const shown = rows.filter((t) => (filter === "all" ? true : filter === "open" ? t.status !== "closed" : t.status === filter));

  const save = async (t, patch) => {
    setBusy(true);
    const { error } = await sb.rpc("admin_ticket_update", {
      p_id: t.id, p_status: patch.status || "", p_priority: patch.priority || "",
      p_reply: patch.reply ?? null,
    });
    setBusy(false);
    if (error) { alert(error.message); return; }
    setOpen(null); setReply(""); await reload();
  };

  return (
    <>
      <h1>Tickets</h1>
      <p className="sub">{rows.filter((t) => t.status !== "closed").length} still open.</p>

      <div style={{ display: "flex", gap: 8, margin: "18px 0 10px", flexWrap: "wrap" }}>
        {[["open", "Open"], ["waiting", "Waiting"], ["closed", "Closed"], ["all", "Everything"]].map(([k, l]) => (
          <button className="btn sm" key={k} data-v={filter === k ? undefined : "quiet"} onClick={() => setFilter(k)}>{l}</button>
        ))}
      </div>

      {shown.length === 0 && <div className="card"><p className="sub">Nothing here.</p></div>}

      {shown.map((t) => (
        <div className="card" key={t.id}>
          <div className="row" style={{ marginBottom: 8 }}>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontWeight: 600 }}>{t.subject}</div>
              <div style={{ color: "var(--muted)", fontSize: 12.5 }}>
                {t.ref} · {t.shop || "unknown shop"} · {t.by} · {t.created}
                {t.age > 2 && t.status !== "closed" ? ` · ${t.age} days old` : ""}
              </div>
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              <span className="chip" data-t={t.priority === "high" ? "bad" : t.priority === "low" ? undefined : "warn"}>
                {t.priority}
              </span>
              <span className="chip" data-t={t.status === "closed" ? "ok" : t.status === "waiting" ? "warn" : "bad"}>
                {t.status}
              </span>
            </div>
          </div>

          <div style={{ fontSize: 14, whiteSpace: "pre-wrap", marginBottom: 10 }}>{t.body}</div>

          {t.context && (
            <div style={{ font: "12px ui-monospace,monospace", color: "var(--muted)", marginBottom: 10 }}>
              {Object.entries(t.context).map(([k, v]) => `${k}: ${v}`).join("  ·  ")}
            </div>
          )}

          {t.reply && (
            <div className="card" style={{ background: "var(--bg)", marginBottom: 10 }}>
              <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 4 }}>Your reply</div>
              <div style={{ fontSize: 14, whiteSpace: "pre-wrap" }}>{t.reply}</div>
            </div>
          )}

          {open === t.id ? (
            <>
              <textarea className="field" rows={4} autoFocus placeholder="What you told them"
                value={reply} onChange={(e) => setReply(e.target.value)} />
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button className="btn sm" disabled={busy} onClick={() => save(t, { reply, status: "waiting" })}>
                  Save and mark waiting
                </button>
                <button className="btn sm" data-v="quiet" disabled={busy} onClick={() => save(t, { reply, status: "closed" })}>
                  Save and close
                </button>
                <button className="btn sm" data-v="quiet" onClick={() => { setOpen(null); setReply(""); }}>Cancel</button>
              </div>
            </>
          ) : (
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button className="btn sm" onClick={() => { setOpen(t.id); setReply(t.reply || ""); }}>
                {t.reply ? "Edit the reply" : "Write a reply"}
              </button>
              {t.email && (
                <a className="btn sm" data-v="quiet" style={{ textDecoration: "none" }}
                  href={`mailto:${t.email}?subject=${encodeURIComponent(`Re: ${t.subject} (${t.ref})`)}`}>
                  Email {t.by?.split(" ")[0] || "them"}
                </a>
              )}
              {t.status !== "closed" && (
                <button className="btn sm" data-v="quiet" disabled={busy} onClick={() => save(t, { status: "closed" })}>Close it</button>
              )}
              {t.priority !== "high" && t.status !== "closed" && (
                <button className="btn sm" data-v="quiet" disabled={busy} onClick={() => save(t, { priority: "high" })}>Flag it</button>
              )}
            </div>
          )}
        </div>
      ))}
    </>
  );
}

function Money({ o, rows }) {
  const active = rows.filter((r) => r.status === "active");
  const intro = active.filter((r) => r.monthly === 75);
  const full = active.filter((r) => r.monthly === 159);
  const quiet = active.filter((r) => r.quiet);
  const atRisk = quiet.reduce((a, r) => a + r.monthly, 0);

  return (
    <>
      <h1>Money</h1>
      <p className="sub">What the business is worth today, and what's wobbling.</p>

      <div className="grid">
        <Stat n={usd(o.mrr)} l="Monthly recurring" tone="go" />
        <Stat n={usd(o.arr)} l="Annual run rate" />
        <Stat n={usd(atRisk)} l="At risk — quiet shops" tone={atRisk > 0 ? "flag" : null} />
        <Stat n={num(intro.length)} l="On intro pricing" />
        <Stat n={num(full.length)} l="At full price" />
        <Stat n={usd(active.length ? o.mrr / active.length : 0)} l="Average per shop" />
      </div>

      <div className="card">
        <div style={{ fontWeight: 600, marginBottom: 10 }}>What happens when intro pricing ends</div>
        <p className="sub" style={{ marginTop: 0 }}>
          {intro.length} {intro.length === 1 ? "shop is" : "shops are"} paying {usd(75)} and will move to {usd(159)}.
          If every one of them stays, monthly recurring goes from {usd(o.mrr)} to {usd(o.mrr + intro.length * 84)}.
          If half leave, it goes to {usd(o.mrr - intro.length * 75 / 2 + (intro.length / 2) * 159)}.
        </p>
        <p className="sub" style={{ marginBottom: 0 }}>
          That gap is the single most important number in this app. The shops using it daily will stay;
          the quiet ones won't. Worth knowing which is which before the price moves.
        </p>
      </div>

      <div className="card" style={{ overflowX: "auto" }}>
        <div style={{ fontWeight: 600, marginBottom: 10 }}>Every paying shop</div>
        <table>
          <thead><tr><th>Shop</th><th>Since</th><th className="num">Monthly</th><th>Health</th></tr></thead>
          <tbody>
            {active.sort((a, b) => b.monthly - a.monthly).map((r) => (
              <tr key={r.id}>
                <td style={{ fontWeight: 500 }}>{r.name}</td>
                <td>{r.created}</td>
                <td className="num">{usd(r.monthly)}</td>
                <td><span className="chip" data-t={r.quiet ? "bad" : "ok"}>{r.quiet ? "Quiet" : "Using it"}</span></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      <p className="sub">
        These figures come from each shop's plan and signup date, not from a payment processor.
        Once billing is wired up they should be checked against what actually cleared.
      </p>
    </>
  );
}

function Portal() {
  const [phase, setPhase] = useState("boot");
  const [notice, setNotice] = useState("");
  const [tab, setTab] = useState("overview");
  const [me, setMe] = useState(null);
  const [o, setO] = useState(null);
  const [shops, setShops] = useState([]);
  const [tickets, setTickets] = useState([]);
  const [signups, setSignups] = useState([]);

  const load = async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { setPhase("signin"); return; }
    setMe(session.user);

    const admin = await sb.rpc("is_platform_admin");
    if (admin.error || !admin.data) {
      await sb.auth.signOut();
      setNotice("That account isn't a platform administrator.");
      setPhase("signin");
      return;
    }

    const [ov, sh, tk, su] = await Promise.all([
      sb.rpc("admin_overview"), sb.rpc("admin_shops"),
      sb.rpc("admin_tickets", { p_status: null }), sb.rpc("admin_signups"),
    ]);
    if (ov.error) { setNotice(ov.error.message); setPhase("signin"); return; }
    setO(ov.data); setShops(sh.data || []); setTickets(tk.data || []); setSignups(su.data || []);
    setPhase("in");
  };

  useEffect(() => { load(); }, []);

  if (phase === "boot") return <div className="mid"><p className="sub">Loading…</p></div>;
  if (phase === "signin") return <SignIn notice={notice} onIn={load} />;

  const openTickets = tickets.filter((t) => t.status !== "closed").length;

  return (
    <>
      <div className="top">
        <span className="mark">Shopfloor <em>Operator</em></span>
        <span className="who">{me?.email}</span>
        <button className="btn sm" data-v="quiet" onClick={async () => { await sb.auth.signOut(); window.location.reload(); }}>
          Sign out
        </button>
      </div>

      <div className="tabs">
        {[["overview", "Overview"], ["shops", "Shops"],
          ["tickets", `Tickets${openTickets ? ` (${openTickets})` : ""}`], ["money", "Money"]].map(([k, l]) => (
          <button key={k} data-on={tab === k ? "1" : "0"} onClick={() => setTab(k)}>{l}</button>
        ))}
      </div>

      <div className="wrap">
        {tab === "overview" && <Overview o={o} signups={signups} />}
        {tab === "shops" && <Shops rows={shops} />}
        {tab === "tickets" && <Tickets rows={tickets} reload={load} />}
        {tab === "money" && <Money o={o} rows={shops} />}
      </div>
    </>
  );
}

class Boundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div className="mid">
        <h1>Something broke</h1>
        <pre style={{ whiteSpace: "pre-wrap", fontSize: 12, color: "var(--flag)" }}>
          {String(this.state.err.stack || this.state.err)}
        </pre>
        <button className="btn" onClick={() => window.location.reload()}>Try again</button>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <Boundary><Portal /></Boundary>
);
</script>
</body>
</html>
