<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>No signal · Shopfloor Pros</title>
<style>
  body { margin:0; background:#0E1216; color:#E8ECEF; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:32px;
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .box { max-width:360px; text-align:center; }
  h1 { font-size:26px; margin:20px 0 8px; color:#fff; }
  p { color:#8B98A5; margin:0 0 10px; }
  img { width:76px; height:76px; border-radius:18px; }
  button { margin-top:22px; padding:13px 26px; border:none; border-radius:9px;
    background:#2E7CB8; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
  <div class="box">
    <img src="/icon-192.png" alt="" />
    <h1>No signal</h1>
    <p>Your phone can't reach the shop right now. Nothing has been lost.</p>
    <p>This usually sorts itself out in a moment — common in a bay with a metal roof.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
