<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColorCode Pro — setup check</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px 18px 60px;
         background: #EDEDE9; color: #14202B; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: #6B7580; font-size: 14px; margin: 0 0 20px; line-height: 1.45; }
  .row { background: #fff; border: 1px solid #DCDCD5; border-radius: 9px;
         padding: 12px 14px; margin-bottom: 8px; }
  .row b { display: block; font-size: 14.5px; margin-bottom: 2px; }
  .row span { font-size: 13px; color: #6B7580; word-break: break-word; }
  .ok b   { color: #2E7D52; }
  .bad b  { color: #B4352C; }
  .wait b { color: #8A6410; }
  pre { white-space: pre-wrap; word-break: break-word; font-size: 11.5px;
        background: #F4F4F1; border-radius: 6px; padding: 8px; margin: 6px 0 0; }
  #summary { margin-top: 18px; padding: 14px; border-radius: 9px; font-size: 14.5px; line-height: 1.5; }
</style>
</head>
<body>

<h1>Setup check</h1>
<p class="sub">This page tests every piece the app needs. Nothing here can break anything — it only reads.</p>

<div id="out"></div>
<div id="summary"></div>

<script>
/* ============================================================
   YOUR TWO VALUES — already filled in.
   ============================================================ */
var SUPABASE_URL      = 'https://tlzlsxouwmlpvjeshzqh.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRsemxzeG91d21scHZqZXNoenFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMDA5ODksImV4cCI6MjEwMzc3Njk4OX0.kJqxNcpXNE2WT8Qnkg0b0WEHGu45l0Um7KdzfpW3l6Y';

var out = document.getElementById('out');
var results = [];

function say(cls, title, detail, extra) {
  var d = document.createElement('div');
  d.className = 'row ' + cls;
  d.innerHTML = '<b>' + (cls === 'ok' ? '✓ ' : cls === 'bad' ? '✗ ' : '… ') + title + '</b>' +
                '<span>' + (detail || '') + '</span>' +
                (extra ? '<pre>' + String(extra).replace(/[&<>]/g, function (c) {
                  return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }) + '</pre>' : '');
  out.appendChild(d);
  results.push(cls);
}

/* 0 — are we in a preview pane instead of the real website? */
var inFrame = false;
try { inFrame = window.top !== window.self; } catch (e) { inFrame = true; }
var isSrcdoc = location.protocol === 'about:' || location.href.indexOf('srcdoc') > -1;

if (inFrame || isSrcdoc) {
  var w = document.createElement('div');
  w.style.cssText = 'background:#FBEEEC;border:2px solid #B4352C;border-radius:9px;padding:14px;margin-bottom:16px;line-height:1.5';
  w.innerHTML = '<b style="color:#B4352C">You are looking at a preview, not your website.</b><br>' +
    '<span style="font-size:13.5px;color:#14202B">Preview panes block outside scripts, so almost everything below will fail ' +
    'no matter how your setup is. Upload this file to your repo and open ' +
    '<b>https://kriscogs.github.io/colorcode-pro/check.html</b> in a normal browser tab instead.</span>';
  out.parentNode.insertBefore(w, out);
}

/* 1 — is this page even running JavaScript */
say('ok', 'JavaScript runs', 'This page loaded and executed. Good starting point.');

/* 2 — page address, which tells us how it is being served */
say(location.protocol === 'https:' ? 'ok' : 'bad',
    'Served over ' + location.protocol.replace(':', ''),
    location.href +
    (location.protocol === 'https:' ? '' : ' — the camera and logins need https, so this must be on the web, not a file on your computer.'));

/* 3 — load each library one at a time so we learn which one fails */
function loadScript(url) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = url;
    s.onload = function () { resolve(); };
    s.onerror = function () { reject(new Error('blocked or unreachable')); };
    document.head.appendChild(s);
  });
}

var LIBS = [
  { name: 'React',    url: 'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js',            check: function () { return window.React && React.version; } },
  { name: 'ReactDOM', url: 'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js',    check: function () { return window.ReactDOM && (ReactDOM.createRoot ? 'createRoot available' : 'OLD BUILD, no createRoot'); } },
  { name: 'Babel',    url: 'https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js',                check: function () { return window.Babel && Babel.version; } },
  { name: 'Supabase', url: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js', check: function () { return window.supabase && typeof supabase.createClient === 'function' ? 'createClient available' : 'loaded but no createClient'; } }
];

function run() {
  var chain = Promise.resolve();
  LIBS.forEach(function (lib) {
    chain = chain.then(function () {
      return loadScript(lib.url).then(function () {
        var v = lib.check();
        say(v ? 'ok' : 'bad', lib.name + ' library', v ? String(v) : 'loaded, but did not define what we expected');
      }).catch(function (e) {
        say('bad', lib.name + ' library', 'Could not load. ' + e.message + '. A network filter or ad blocker may be stopping it.', lib.url);
      });
    });
  });
  return chain;
}

/* 4 — can Babel actually compile JSX? this is the piece I suspect */
function testBabel() {
  if (!window.Babel) { say('bad', 'Compiling JSX', 'Skipped — Babel never loaded.'); return; }
  try {
    var code = Babel.transform('var x = <div className="a">{1 + 1}</div>;', { presets: ['react'] }).code;
    say('ok', 'Compiling JSX', 'Babel turned JSX into JavaScript correctly.');
  } catch (e) {
    say('bad', 'Compiling JSX', 'Babel is loaded but failed to compile.', e.message);
  }
}

/* 5 — can we reach your Supabase project */
function testSupabase() {
  if (!window.supabase || !supabase.createClient) {
    say('bad', 'Talking to Supabase', 'Skipped — the library never loaded.');
    return Promise.resolve();
  }
  var sb;
  try {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    say('ok', 'Supabase client built', SUPABASE_URL);
  } catch (e) {
    say('bad', 'Supabase client', e.message);
    return Promise.resolve();
  }

  return sb.from('shops').select('id', { count: 'exact', head: true })
    .then(function (r) {
      if (r.error) throw r.error;
      say('ok', 'Database reachable', 'The shops table answered. Your keys and project are correct.');
    })
    .catch(function (e) {
      say('bad', 'Database', e.message + ' — if this says the relation does not exist, schema.sql has not been run yet.');
    })
    .then(function () {
      return sb.from('app_state').select('shop_id', { count: 'exact', head: true }).then(function (r) {
        say(r.error ? 'bad' : 'ok', 'app_state table',
            r.error ? r.error.message + ' — run the small app_state block.' : 'Present. This is where a shop\u2019s data lives.');
      });
    })
    .then(function () {
      return sb.rpc('portal_view').then(function (r) {
        var m = (r.error && r.error.message) || '';
        if (/does not exist|not find/i.test(m)) say('bad', 'Portal functions', 'portal.sql has not been run yet.');
        else say('ok', 'Portal functions', 'portal_view exists. It refused us because we are not a client, which is correct.');
      }).catch(function () { say('wait', 'Portal functions', 'Could not tell.'); });
    })
    .then(function () {
      return sb.auth.signInAnonymously().then(function (r) {
        if (r.error) {
          say(/disabled|not enabled/i.test(r.error.message) ? 'bad' : 'wait',
              'Anonymous sign-ins',
              r.error.message + ' — turn these on under Authentication, Sign In / Providers, so customer links work without a password.');
        } else {
          say('ok', 'Anonymous sign-ins', 'Working. Customer links can open with no account.');
          return sb.auth.signOut();
        }
      }).catch(function (e) { say('wait', 'Anonymous sign-ins', e.message); });
    });
}

/* 6 — verdict */
function summarise() {
  var bad = results.filter(function (r) { return r === 'bad'; }).length;
  var el = document.getElementById('summary');
  if (bad === 0) {
    el.style.background = '#E4F0E9'; el.style.border = '1px solid #2E7D52';
    el.innerHTML = '<b>Everything works.</b><br>Send me a screenshot of this page and I\u2019ll build the apps on top of it.';
  } else {
    el.style.background = '#FBEEEC'; el.style.border = '1px solid #B4352C';
    el.innerHTML = '<b>' + bad + ' thing' + (bad > 1 ? 's' : '') + ' need' + (bad > 1 ? '' : 's') +
      ' fixing.</b><br>Send me a screenshot of this page. Each red line says what to do.';
  }
}

window.addEventListener('error', function (e) {
  say('bad', 'Unexpected error', (e.message || '') + ' ' + (e.filename || '') + ':' + (e.lineno || ''));
});

run().then(testBabel).then(testSupabase).then(summarise);
</script>

</body>
</html>
