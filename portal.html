<script>
// Shows any startup error on screen, so you don't need a console to read it.
(function () {
  function show(kind, text) {
    var el = document.getElementById('boot');
    if (!el) return;
    el.style.textAlign = 'left';
    el.innerHTML =
      '<div style="font:600 15px system-ui;color:#B4352C;margin-bottom:8px">' + kind + '</div>' +
      '<pre style="white-space:pre-wrap;word-break:break-word;font:12px ui-monospace,monospace;' +
      'color:#14202B;background:#fff;border:1px solid #DCDCD5;border-radius:8px;padding:12px;margin:0">' +
      String(text).replace(/[&<>]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
      }) + '</pre>';
  }
  window.addEventListener('error', function (e) {
    show('Startup error', (e.message || e.error || 'unknown') +
      (e.filename ? '\n' + e.filename + ' line ' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    show('Startup error', (e.reason && (e.reason.message || e.reason)) || 'unknown');
  });
  var ce = console.error;
  console.error = function () {
    var msg = Array.prototype.map.call(arguments, function (a) {
      return a && a.message ? a.message : String(a);
    }).join(' ');
    if (/SyntaxError|Unexpected|Parse|transform/i.test(msg)) show('Could not compile the page', msg);
    ce.apply(console, arguments);
  };
})();
</script>

function themeVars(id, mode) {
  const t = THEMES[id] || THEMES.gaz;
  const dark = mode === "dark";
  const v = { ...(dark ? t.dark : t.light), ...(dark ? MODE_DARK : MODE_LIGHT),
              accent: dark ? t.accentDark : t.accent, onAccent: dark ? t.onAccentDark : t.onAccent };
  return Object.fromEntries(Object.entries(v).map(([k, x]) => [`--${k}`, x]));
}

/* ── VIN check digit, so a typo is caught before it reaches the shop ── */
const VIN_T = { A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9 };
const VIN_W = [8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
function vinOk(vin) {
  if (!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) return false;
  let sum = 0;
  for (let i = 0; i < 17; i++) {
    const c = vin[i], v = /\d/.test(c) ? +c : VIN_T[c];
    if (v === undefined) return false;
    sum += v * VIN_W[i];
  }
  const r = sum % 11;
  return vin[8] === (r === 10 ? "X" : String(r));
}
async function decodeVin(vin) {
  const r = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${vin}?format=json`);
  const d = (await r.json())?.Results?.[0];
  if (!d) throw new Error("no result");
  const cap = (x) => (x || "").replace(/\b\w/g, (c) => c.toUpperCase());
  return {
    year: d.ModelYear || "", make: cap(d.Make), model: d.Model || "",
    trim: d.Trim || d.Series || "", body: d.BodyClass || "", drive: d.DriveType || "",
    engine: [d.DisplacementL ? (+d.DisplacementL).toFixed(1) + "L" : "",
             d.EngineCylinders ? d.EngineCylinders + "-cyl" : ""].filter(Boolean).join(" "),
  };
}

/* ── shrink before upload, phones shoot huge files ── */
async function shrinkToBlob(file, max, q) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
  const scale = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return new Promise((r) => c.toBlob(r, "image/jpeg", q));
}

function usePhotoUrls(photos) {
  const [urls, setUrls] = useState({});
  const key = (photos || []).map((p) => p.id).join(",");
  useEffect(() => {
    const need = (photos || []).filter((p) => p.path && !urls[p.id]);
    if (!need.length) return;
    let dead = false;
    (async () => {
      const { data } = await sb.storage.from("job-photos").createSignedUrls(need.map((p) => p.path), 3600);
      if (dead || !data) return;
      const next = {};
      data.forEach((d, i) => { if (d?.signedUrl) next[need[i].id] = d.signedUrl; });
      setUrls((u) => ({ ...u, ...next }));
    })();
    return () => { dead = true; };
  }, [key]);
  return urls;
}

function SignIn({ onDone, error }) {
  const [mode, setMode] = useState("in");
  const [email, setEmail] = useState("");
  const [pass, setPass] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(error || "");

  const go = async () => {
    setBusy(true); setErr("");
    try {
      const fn = mode === "in"
        ? sb.auth.signInWithPassword({ email: email.trim(), password: pass })
        : sb.auth.signUp({ email: email.trim(), password: pass });
      const { data, error } = await fn;
      if (error) throw new Error(error.message);
      if (!data.session) throw new Error("Check your email to confirm, then sign in.");
      await onDone();
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };

  return (
    <div className="p" style={themeVars("gaz", "light")}>
      <style>{CSS}</style>
      <div className="mid" style={{ alignItems: "stretch" }}>
        <h1>{mode === "in" ? "Sign in" : "Set your password"}</h1>

        </p>

          onKeyDown={(e) => e.key === "Enter" && go()} />
        {err && <p className="err">{err}</p>}
        <button className="btn" disabled={busy || !email || pass.length < 8} onClick={go}>
          {busy ? "Working…" : mode === "in" ? "Sign in" : "Create my password"}
        </button>
        <button className="btn quiet" onClick={() => { setMode(mode === "in" ? "up" : "in"); setErr(""); }}>

function RepSetup({ invite, token, onDone }) {
  const [mode, setMode] = useState(invite.claimed ? "in" : "up");
  const [email, setEmail] = useState(invite.email || "");
  const [pass, setPass] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const go = async () => {
    setBusy(true); setErr("");
    try {
      await sb.auth.signOut();   // clear anything left over from another link
      const { data, error } = mode === "up"
        ? await sb.auth.signUp({ email: email.trim(), password: pass })
        : await sb.auth.signInWithPassword({ email: email.trim(), password: pass });
      if (error) throw new Error(error.message);
      if (!data.session) throw new Error("Check your email to confirm, then open this link again.");
      const claim = await sb.rpc("portal_claim", { p_token: token });
      if (claim.error) throw new Error(claim.error.message);
      await onDone();
    } catch (e) { setErr(e.message); } finally { setBusy(false); }
  };

  return (
    <div className="p" style={themeVars("gaz", "light")}>
      <style>{CSS}</style>
      <div className="mid" style={{ alignItems: "stretch" }}>
        <h1>{invite.shopName}</h1>
        <p className="sub" style={{ marginBottom: 20 }}>
          {invite.name ? `${invite.name.split(" ")[0]}, y` : "Y"}ou've been given access to track your vehicles at{" "}
          {invite.shopName}. {mode === "up" ? "Pick a password and you're set." : "Sign in to carry on."}
        </p>
        <label className="lab">Email</label>
        <input className="field" type="email" autoCapitalize="none" value={email} onChange={(e) => setEmail(e.target.value)} />
        <label className="lab">Password</label>
        <input className="field" type="password" placeholder="At least 8 characters" value={pass}
          onChange={(e) => setPass(e.target.value)} onKeyDown={(e) => e.key === "Enter" && go()} />
        {err && <p className="err">{err}</p>}
        <button className="btn accent" disabled={busy || !email || pass.length < 8} onClick={go}>
          {busy ? "Working…" : mode === "up" ? "Create my access" : "Sign in"}
        </button>
        <button className="btn quiet" onClick={() => { setMode(mode === "up" ? "in" : "up"); setErr(""); }}>
          {mode === "up" ? "I already have a password" : "I need to set a password"}
        </button>
        <p className="sub">Use this on any device — phone at the lot, computer at your desk.</p>
      </div>
    </div>
  );
}

function AddVehicle({ onClose, onDone, toast }) {
  const [f, setF] = useState({ vin: "", year: "", make: "", model: "", trim: "", plate: "",
                               miles: "", stockNo: "", type: "collision", promised: "", request: "" });
  const [picked, setPicked] = useState([]);
  const [extra, setExtra] = useState("");
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState("");
  const set = (k, v) => setF({ ...f, [k]: v });

  const toggle = (name) =>
    setPicked((p) => (p.includes(name) ? p.filter((x) => x !== name) : [...p, name]));

  const setType = (t) => { setF({ ...f, type: t }); setPicked([]); };

  // what the shop will read on the job
  const request = [picked.join(" · "), extra.trim()].filter(Boolean).join("\n");

  const decode = async () => {
    const vin = f.vin.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, "");
    if (vin.length !== 17) { setNote("A VIN is 17 characters."); return; }
    if (!vinOk(vin)) { setNote("That VIN fails its check digit — look for a mistyped character."); return; }
    setBusy(true); setNote("");
    try {
      const d = await decodeVin(vin);
      setF((p) => ({ ...p, vin, year: d.year || p.year, make: d.make || p.make, model: d.model || p.model,
                     trim: d.trim || p.trim, body: d.body, engine: d.engine, drive: d.drive }));
      setNote([d.year, d.make, d.model].filter(Boolean).join(" "));
    } catch { setNote("Couldn't reach the VIN database. Fill it in by hand."); }
    setBusy(false);
  };

  const send = async () => {
    setBusy(true);
    const { error } = await sb.rpc("portal_add_job", { p_job: { ...f, request } });
    setBusy(false);
    if (error) { toast(error.message); return; }
    await onDone(); onClose(); toast("Sent to the shop");
  };

  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1>Send a vehicle in</h1>
        <p className="sub" style={{ marginBottom: 16 }}>
          The shop sees it straight away and writes the estimate from there.
        </p>

        <label className="lab">VIN</label>
        <div style={{ display: "flex", gap: 8 }}>
          <input className="field" style={{ letterSpacing: ".04em" }} maxLength={17} autoCapitalize="characters"
            value={f.vin} onChange={(e) => { set("vin", e.target.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, "")); setNote(""); }} />
          <button className="btn" style={{ width: 92, marginBottom: 9 }} disabled={busy || f.vin.length !== 17} onClick={decode}>
            {busy ? "…" : "Decode"}
          </button>
        </div>
        <p className="sub" style={{ marginTop: -4 }}>{note || "Decoding fills the year, make and model for you."}</p>

        <div style={{ display: "flex", gap: 8 }}>
          <input className="field" placeholder="Year" inputMode="numeric" value={f.year} onChange={(e) => set("year", e.target.value)} />
          <input className="field" placeholder="Make" value={f.make} onChange={(e) => set("make", e.target.value)} />
        </div>
        <input className="field" placeholder="Model" value={f.model} onChange={(e) => set("model", e.target.value)} />
        <div style={{ display: "flex", gap: 8 }}>
          <input className="field" placeholder="Stock number" value={f.stockNo} onChange={(e) => set("stockNo", e.target.value)} />
          <input className="field" placeholder="Plate" value={f.plate} onChange={(e) => set("plate", e.target.value)} />
        </div>

        <label className="lab">What's it in for</label>
        <div className="seg" style={{ marginTop: 0, marginBottom: 10 }}>
          {[["collision","Body"],["mechanical","Mechanical"],["maintenance","Service"]].map(([k, l]) => (
            <button key={k} data-on={f.type === k ? "1" : "0"} onClick={() => setType(k)}>{l}</button>
          ))}
        </div>

        <label className="lab">Tap everything that applies</label>
        <div className="chips">
          {SERVICES[f.type].map((name) => (
            <button key={name} data-on={picked.includes(name) ? "1" : "0"} onClick={() => toggle(name)}>{name}</button>
          ))}
        </div>

        <label className="lab">Anything else the shop should know</label>
        <textarea className="field" rows={3}
          placeholder="Deep scratch down to metal on the driver's side. Sale pending, needs to be retail ready."
          value={extra} onChange={(e) => setExtra(e.target.value)} />

        {request && (
          <div className="picked">
            <div className="sub2" style={{ marginBottom: 4 }}>The shop will see</div>
            {request.split("\n").map((l, i) => <div key={i}>{l}</div>)}
          </div>
        )}

        <label className="lab">When do you need it back</label>
        <input className="field" placeholder="e.g. Sep 12" value={f.promised} onChange={(e) => set("promised", e.target.value)} />

        <button className="btn accent" disabled={busy || !f.make.trim() || !request} onClick={send}>
          {busy ? "Sending…" : "Send it to the shop"}
        </button>
        {!request && <p className="sub" style={{ marginTop: -4 }}>Pick at least one thing, or type what's needed.</p>}
        <button className="btn quiet" onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

/** What this client should look at next on a vehicle, if anything. */
function clientNext(job, perms, dealer) {
  const can = (p) => (perms || []).includes(p);
  if (job.est?.status === "sent" && can("approve"))
    return { tab: "cost", cta: "Look at the estimate", title: "Waiting on you to approve",
             why: "Nothing gets ordered or started until you say yes." };
  if (job.hold)
    return { tab: "msgs", cta: "Ask the shop", title: "Paused, usually for a part",
             why: "The shop will move it on as soon as the part lands." };
  if (dealer && !job.stockNo)
    return { tab: "status", cta: "Add it", title: "No stock number on this one",
             why: "Add yours and it shows on the shop's screen next to their RO." };
  if (stageIdx(job) === STAGE_SETS[typeKey(job)].length - 1)
    return { tab: "msgs", cta: "Arrange pickup", title: "Ready to collect",
             why: "Message the shop to sort out collection." };
  return null;
}

function Strip({ job }) {
  const cur = stageIdx(job), all = STAGE_SETS[typeKey(job)];
  return (
    <div className="strip">
      {all.map((s, i) => <i key={s} data-s={i < cur ? "done" : i === cur ? (job.hold ? "hold" : "now") : "next"} />)}
    </div>
  );
}

function JobView({ job, shop, shopId, perms, meName, isDealer, onBack, reload, toast }) {
  const [tab, setTab] = useState("status");
  const [draft, setDraft] = useState("");
  const [note, setNote] = useState("");
  const [stock, setStock] = useState(job.stockNo || "");
  const [busy, setBusy] = useState(false);
  const [viewing, setViewing] = useState(null);
  const fileRef = useRef(null);
  const urls = usePhotoUrls(job.photos);
  const tot = totalOf(job, shop.tax);
  const owed = Math.max(0, tot - paidOf(job));
  const can = (p) => (perms || []).includes(p);
  const all = STAGE_SETS[typeKey(job)], cur = stageIdx(job);

  const send = async () => {
    if (!draft.trim()) return;
    setBusy(true);
    const { error } = await sb.rpc("portal_message", { p_job: job.id, p_body: draft.trim() });
    setBusy(false);
    if (error) { toast(error.message); return; }
    setDraft(""); await reload(); toast("Sent to the shop");
  };

  const addPhotos = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (!files.length) return;
    setBusy(true);
    for (const f of files) {
      try {
        const blob = await shrinkToBlob(f, 1600, 0.72);
        const path = `${shopId}/${job.id}/${crypto.randomUUID()}.jpg`;
        const up = await sb.storage.from("job-photos").upload(path, blob, { contentType: "image/jpeg" });
        if (up.error) throw new Error(up.error.message);
        const { error } = await sb.rpc("portal_photo", { p_job: job.id, p_path: path, p_label: `From ${meName || "the customer"}` });
        if (error) throw new Error(error.message);
      } catch (err) { toast("A photo didn't send: " + err.message); }
    }
    setBusy(false); await reload(); toast("Photos sent to the shop");
  };

  const addNote = async () => {
    if (!note.trim()) return;
    setBusy(true);
    const { error } = await sb.rpc("portal_note", { p_job: job.id, p_body: note.trim() });
    setBusy(false);
    if (error) { toast(error.message); return; }
    setNote(""); await reload(); toast("Note added for the shop");
  };

  const saveStock = async () => {
    setBusy(true);
    const { error } = await sb.rpc("portal_stock", { p_job: job.id, p_stock: stock.trim() });
    setBusy(false);
    if (error) { toast(error.message); return; }
    await reload(); toast("Stock number saved");
  };

  const approve = async () => {
    setBusy(true);
    const { error } = await sb.rpc("portal_approve", { p_job: job.id, p_name: meName || "" });
    setBusy(false);
    if (error) { toast(error.message); return; }
    await reload(); toast("Approved — the shop has been told");
  };

  return (
    <>
      <div className="bar">
        <button className="back" onClick={onBack}>‹ All vehicles</button>
        <h1 style={{ fontSize: 20 }}>{job.v?.year} {job.v?.make} {job.v?.model}</h1>
        <p className="sub">{job.ro} · {shop.name}</p>
        <div className="seg">
          {[["status","Status"],["photos",`Photos ${(job.photos||[]).length}`],["msgs","Messages"],
            ["notes",`Notes ${(job.clientNotes||[]).length || ""}`.trim()],["cost","Cost"]]
            .map(([k,l]) => <button key={k} data-on={tab===k?"1":"0"} onClick={()=>setTab(k)}>{l}</button>)}
        </div>
      </div>

      <div className="pad">
        {(() => {
          const n = clientNext(job, perms, isDealer);
          if (!n || n.tab === tab) return null;
          return (
            <div className="nudge">
              <div className="nt">{n.title}</div>
              <div className="nw">{n.why}</div>
              <button className="btn accent" style={{ marginBottom: 0 }} onClick={() => setTab(n.tab)}>{n.cta}</button>
            </div>
          );
        })()}

        {tab === "status" && (
          <>
            <div className="card">
              <div className="row" style={{ marginBottom: 4 }}>
                <span className="strong" style={{ fontSize: 17 }}>{job.hold ? "On hold" : stageName(job)}</span>
                <span className="chip">Step {cur + 1} of {all.length}</span>
              </div>
              <p className="sub2" style={{ marginBottom: 12 }}>In since {job.dropped} · due back {job.promised}</p>
              <Strip job={job} />
              <div className="steps">
                {all.map((s, i) => (
                  <span key={s} className="step" data-s={i < cur ? "done" : i === cur ? "now" : "next"}>{s}</span>
                ))}
              </div>
              {job.hold && <p className="sub" style={{ marginTop: 12 }}>
                Work is paused, usually waiting on a part. Your shop will message you when it moves again.
              </p>}
            </div>

            {job.warranty?.campaign && (
              <div className="card">
                <div className="strong">Recall or warranty work</div>
                <p className="sub2">Campaign {job.warranty.campaign}. Covered by {job.warranty.maker} — nothing to pay.</p>
              </div>

            {isDealer && (
              <div className="card">
                <div className="strong" style={{ marginBottom: 8 }}>Your stock number</div>
                <div style={{ display: "flex", gap: 8 }}>
                  <input className="field" style={{ marginBottom: 0 }} placeholder="e.g. 24T1198"
                    value={stock} onChange={(e) => setStock(e.target.value)} />
                  <button className="btn" style={{ width: 88, marginBottom: 0 }}
                    disabled={busy || stock.trim() === (job.stockNo || "")} onClick={saveStock}>Save</button>
                </div>
                <p className="sub">Your number, not theirs. It shows up on the shop's screen next to the RO.</p>

            <div className="card">
              <div className="strong" style={{ marginBottom: 8 }}>Your vehicle</div>
              {[["Plate", job.v?.plate], ["VIN", job.v?.vin], ["Odometer", job.v?.miles], ["Paint", job.v?.paint]]

                <div className="line" key={k}><span className="sub2" style={{ width: 86 }}>{k}</span><span>{v}</span></div>

            </div>

            <div className="card">
              <div className="strong" style={{ marginBottom: 6 }}>{shop.name}</div>
              <p className="sub2">{shop.address}{shop.address ? <br /> : null}{shop.city}</p>
              {shop.phone && <a className="btn quiet" href={`tel:${shop.phone.replace(/\D/g, "")}`}>Call {shop.phone}</a>}
            </div>
          </>
        )}

        {tab === "photos" && (
          <>
            {(job.photos || []).length === 0 && <div className="card empty">No photos yet. Your shop adds them as work progresses.</div>}
            <div className="grid3">
              {(job.photos || []).map((p) => {
                const src = p.url || urls[p.id];
                return (
                  <div className="ph" key={p.id}>
                    {src ? <img src={src} alt={p.label} onClick={() => setViewing({ src, label: p.label })} />
                         : p.css ? <div style={{ width: "100%", height: "100%", background: p.css }} />
                         : <div className="spin">Loading…</div>}
                    <span className="tag">{p.label}</span>
                  </div>
                );
              })}
            </div>
            <input ref={fileRef} type="file" accept="image/*" multiple onChange={addPhotos} style={{ display: "none" }} />
            <button className="btn" disabled={busy} onClick={() => fileRef.current?.click()}>
              {busy ? "Sending…" : "Send photos to the shop"}
            </button>
            <p className="sub">Handy for showing damage you spotted, or a part number off the old part.</p>
          </>
        )}

        {tab === "msgs" && (
          <>
            {(job.msgs || []).map((m) => (
              <div key={m.id}>
                <div className="bub" data-w={m.w === "client" ? "me" : "shop"}>{m.body}</div>
                <div className="stamp" style={{ textAlign: m.w === "client" ? "right" : "left" }}>
                  {m.w === "client" ? "You" : shop.name} · {m.at}
                </div>
              </div>
            ))}
            {(job.msgs || []).length === 0 && <div className="card empty">No messages yet. Ask anything.</div>}
            {can("message") ? (
              <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                <input className="field" style={{ marginBottom: 0 }} placeholder="Message the shop"
                  value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} />
                <button className="btn" style={{ width: 78 }} disabled={busy || !draft.trim()} onClick={send}>Send</button>
              </div>
            ) : <p className="sub">Messaging isn't switched on for this login. Call the shop on {shop.phone}.</p>}
          </>
        )}

        {tab === "notes" && (
          <>
            {(job.clientNotes || []).map((n) => (
              <div className="card" key={n.id}>
                <div className="row" style={{ marginBottom: 6 }}>
                  <span className="strong" style={{ fontSize: 14 }}>{n.by}</span>
                  <span className="sub2">{n.at}</span>
                </div>
                <div style={{ fontSize: 14.5, lineHeight: 1.45 }}>{n.body}</div>
              </div>
            ))}
            {(job.clientNotes || []).length === 0 && (
              <div className="card empty">
                Nothing here yet. Notes are for things the shop should know about this vehicle.
              </div>
            )}
            <input className="field" placeholder="e.g. Needs to be on the lot by Friday. Don't wash it."
              value={note} onChange={(e) => setNote(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addNote()} />
            <button className="btn" disabled={busy || !note.trim()} onClick={addNote}>Add a note</button>
            <p className="sub">
              The shop sees these on the vehicle. Use Messages if you want a reply — notes are for standing
              instructions, not conversation.
            </p>
          </>
        )}

        {tab === "cost" && (
          <>
            <div className="card">
              <div className="row" style={{ marginBottom: 10 }}>
                <span className="strong">{job.est?.status === "approved" ? "Approved" : job.est?.status === "sent" ? "Waiting for your approval" : "Being written"}</span>
                {job.est?.status === "approved" && <span className="chip ok">Approved</span>}
              </div>
              {(job.est?.lines || []).map((l) => (
                <div className="line" key={l.id}>
                  <div style={{ flex: 1 }}>
                    <div>{l.d}</div>
                    {l.supp && <div className="sub2">Extra damage found during the repair</div>}
                  </div>
                  <span className="money">{usd2(lineTotal(l))}</span>
                </div>
              ))}
              {(job.est?.lines || []).length === 0 && <p className="sub2">Nothing priced yet.</p>}
              <div className="line"><span className="sub2" style={{ flex: 1 }}>Sales tax {shop.tax}%</span>
                <span className="money">{usd2(subtotal(job) * (+shop.tax || 0) / 100)}</span></div>
              <div className="row" style={{ paddingTop: 10 }}>
                <span className="strong">Total</span><span className="money" style={{ fontSize: 24 }}>{usd2(tot)}</span>
              </div>
              {paidOf(job) > 0 && (
                <div className="row" style={{ paddingTop: 8 }}>
                  <span className="sub2">Received so far</span><span className="money">{usd2(paidOf(job))}</span>
                </div>
              )}
              {owed > 0.004 && paidOf(job) > 0 && (
                <div className="row" style={{ paddingTop: 4 }}>
                  <span className="strong">Still owing</span><span className="money">{usd2(owed)}</span>
                </div>
              )}
            </div>

            {job.est?.status === "sent" && can("approve") && (
              <>
                <button className="btn accent" disabled={busy} onClick={approve}>
                  {busy ? "Approving…" : `Approve ${usd2(tot)}`}
                </button>
                <p className="sub">Approving lets the shop order parts and start work. Questions first? Use the Messages tab.</p>
              </>
            )}
            {job.est?.status === "sent" && !can("approve") && (
              <p className="sub">This estimate needs approval from whoever handles authorisations at your business.</p>
            )}
            {job.est?.approvedBy && <p className="sub">Approved by {job.est.approvedBy} on {job.est.approvedAt}.</p>}
            {shop.guarantee && <div className="card"><div className="strong" style={{ marginBottom: 6 }}>Our guarantee</div><p className="sub2">{shop.guarantee}</p></div>}
          </>
        )}
      </div>

      {viewing && (
        <div className="lb" onClick={() => setViewing(null)}>
          <div className="lbbar"><span>{viewing.label}</span><button onClick={() => setViewing(null)}>×</button></div>
          <img src={viewing.src} alt={viewing.label} />
        </div>
      )}
    </>
  );
}

/* ════════════════  APP  ════════════════ */

function Portal() {
  const [state, setState] = useState({ phase: "boot" });
  const [openId, setOpenId] = useState(null);
  const [sheet, setSheet] = useState(null);
  const [msg, setMsg] = useState("");
  const toast = (t) => { setMsg(t); setTimeout(() => setMsg(""), 2600); };

  const token = new URLSearchParams(window.location.search).get("t");

  const load = async () => {
    const { data, error } = await sb.rpc("portal_view");
    if (error) { setState({ phase: "error", message: error.message }); return null; }
    setState({ phase: "ready", ...data });
    return data;
  };

  const [step, setStep] = useState("starting");

  useEffect(() => {
    if (window.supabaseLoadError) {
      setState({ phase: "error", message: window.supabaseLoadError, step: "loading the library" }); return;
    }
    if (!sb) {
      setState({ phase: "error", message: "This page has no Supabase keys in it.", step: "configuration" }); return;
    }

    // never sit on a spinner forever
    const bail = setTimeout(() => {
      setState((st) => st.phase === "boot"
        ? { phase: "error", message: "The server didn't answer. Check your connection and try again.", step }
        : st);
    }, 15000);

    (async () => {
      let where = "checking your session";
      try {
        setStep(where);
        let { data: { session } } = await sb.auth.getSession();

        if (token) {
          where = "checking your link";
          setStep(where);
          const peek = await sb.rpc("portal_peek", { p_token: token });
          const info = peek.data;
          if (peek.error || !info || !info.ok) {
            clearTimeout(bail);
            setState({ phase: "error", step: where, message: "That link is not valid any more. Ask the shop for a new one." });
            return;
          }

          // A dealership invite needs a genuine account. An anonymous session
          // left over from a customer link doesn't count.
          const anonSession = !session || !session.user?.email || session.user?.is_anonymous;
          if (info.kind === "account" && anonSession) {
            clearTimeout(bail);
            if (session) await sb.auth.signOut();
            setState({ phase: "setup", invite: info, token });
            return;
          }

          if (!session) {
            where = "opening your link";
            setStep(where);
            const { data, error } = await sb.auth.signInAnonymously();
            if (error) {
              clearTimeout(bail);
              setState({ phase: "error", step: where,
                message: "Anonymous sign-ins are switched off for this project, so this link can't open on its own. "
                       + "Turn them on in Supabase under Authentication, Sign In / Providers. (" + error.message + ")" });
              return;
            }
            session = data.session;
          }
          where = "checking your link";
          setStep(where);
          const { error } = await sb.rpc("portal_claim", { p_token: token });
          if (error) { clearTimeout(bail); setState({ phase: "error", message: error.message, step: where }); return; }
          window.history.replaceState({}, "", window.location.pathname);
        }

        if (!session) { clearTimeout(bail); setState({ phase: "signin" }); return; }

        where = "loading your vehicles";
        setStep(where);
        const { data, error } = await sb.rpc("portal_view");
        clearTimeout(bail);
        if (error) { setState({ phase: "error", message: error.message, step: where }); return; }
        setState({ phase: "ready", ...data });
      } catch (e) {
        clearTimeout(bail);
        setState({ phase: "error", message: e.message || String(e), step: where });
      }
    })();
    return () => clearTimeout(bail);
  }, []);

  if (state.phase === "boot") return <Splash title="Opening your vehicle…" body={step} />;
  if (state.phase === "setup") return (
    <RepSetup invite={state.invite} token={state.token}
      onDone={async () => { const d = await load(); if (d) window.history.replaceState({}, "", window.location.pathname); }} />
  );
  if (state.phase === "signin") return <SignIn error={state.message} onDone={load} />;
  if (state.phase === "error") return (
    <div className="p" style={themeVars("gaz", "light")}>
      <style>{CSS}</style>
      <div className="mid">
        <h1>We can't open that.</h1>
        <p className="sub">{state.message}</p>
        {state.step && <p className="sub" style={{ opacity: .7 }}>Stopped while {state.step}.</p>}
        <p className="sub">Ask your shop to send a fresh link, or call them directly.</p>
        <button className="btn quiet" onClick={async () => { await sb.auth.signOut(); window.location.href = window.location.pathname; }}>
          Start again
        </button>
      </div>
    </div>
  );

  const { shop, jobs, me, client, shopId } = state;
  const job = (jobs || []).find((j) => j.id === openId);
  const vars = themeVars(shop.theme, shop.mode);
  const dealer = client?.kind === "dealer";
  const canAdd = (me.perms || []).includes("add");

  return (
    <div className="p" style={vars}>
      <style>{CSS}</style>
      {job ? (
        <JobView job={job} shop={shop} shopId={shopId} perms={me.perms} meName={me.name} isDealer={dealer}
          onBack={() => setOpenId(null)} reload={load} toast={toast} />
      ) : (
        <>
          <div className="bar">
            <div style={{ display: "flex", gap: 11, alignItems: "center" }}>
              {shop.logo && <img className="logo" src={shop.logo} alt="" />}
              <div>
                <h1>{shop.name}</h1>
                <p className="sub">
                  {dealer ? client?.name : `Hello${me.name ? `, ${me.name.split(" ")[0]}` : ""}`}
                  {" · "}{(jobs || []).length} {(jobs || []).length === 1 ? "vehicle" : "vehicles"}
                </p>
              </div>
            </div>
          </div>
          <div className="pad">
            {(jobs || []).length === 0 && <div className="card empty">Nothing of yours is in the shop right now.</div>}
            {(jobs || []).map((j) => (
              <JobCard key={j.id} job={j} tax={shop.tax}
                hint={clientNext(j, me.perms, dealer)?.title} onOpen={() => setOpenId(j.id)} />
            ))}
            {dealer && (
              <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
                {canAdd && <button className="btn accent" style={{ marginBottom: 0 }} onClick={() => setSheet("add")}>Send a vehicle in</button>}
                <button className="btn quiet" style={{ marginBottom: 0 }} onClick={() => setSheet("team")}>Your team</button>
              </div>
            )}
            <p className="sub" style={{ marginTop: 20 }}>
              Questions about any of these? Open the vehicle and use Messages, or call {shop.phone}.
            </p>
            <div className="card" style={{ marginTop: 14 }}>
              <div className="row">
                <span className="sub2">
                  Signed in as {me.name || "you"}{me.kind === "link" ? " · opened from a link" : ""}
                </span>
                <button className="chip" onClick={async () => { await sb.auth.signOut(); window.location.reload(); }}>
                  Sign out
                </button>
              </div>
            </div>
          </div>
        </>
      )}
      {sheet === "add" && <AddVehicle onClose={() => setSheet(null)} onDone={load} toast={toast} />}
      {sheet === "team" && <TeamSheet perms={me.perms} onClose={() => setSheet(null)} toast={toast} />}
      {msg && <div className="toast">{msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Portal />);

</script>
</body>
</html>
