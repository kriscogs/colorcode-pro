function themeVars(id, mode) {
  const t = THEMES[id] || THEMES.gaz;
  const dark = mode === "dark";
  const base = dark ? t.dark : t.light;
  const sem = dark ? MODE_DARK : MODE_LIGHT;
  const v = {
    ...base, ...sem,
    accent: dark ? t.accentDark : t.accent,
    onAccent: dark ? t.onAccentDark : t.onAccent,
    paint: t.paint,
  };
  return Object.fromEntries(Object.entries(v).map(([k, val]) => [`--${k}`, val]));

function vinCheck(vin) {
  if (!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) return false;
  let sum = 0;
  for (let i = 0; i < 17; i++) {

  if (!vinCheck(vin)) return { ok: false, why: "That VIN fails its check digit. Look for a mistyped character." };
  const i = YEAR_CODES.indexOf(vin[9]);

  if (!d) throw new Error("no result");
  const cap = (s) => (s || "").replace(/\b\w/g, (c) => c.toUpperCase());
  const model = [d.Model, d.Series && d.Series !== d.Model ? d.Series : ""].filter(Boolean).join(" ").trim();
  return {
    make: cap(d.Make), model, year: d.ModelYear || "",
    trim: [d.Trim, d.Trim2].filter(Boolean).join(" ") || d.Series2 || "",
    body: d.BodyClass || "",
    drive: d.DriveType || "",
    engine: [

      d.FuelTypePrimary && !/gasoline/i.test(d.FuelTypePrimary) ? d.FuelTypePrimary : "",
    ].filter(Boolean).join(" "),
  };
}

function friendly(msg) {
  if (/invalid login/i.test(msg)) return "That email and password don't match an account.";
  if (/already registered|already been registered/i.test(msg)) return "That email already has an account. Sign in instead.";
  if (/at least 6/i.test(msg)) return "Passwords need at least 8 characters.";

}

function withSampleData(shop) {

const usd = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const usd2 = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 });
const subtotal = (est) => est.lines.reduce((a, l) => a + (+l.q || 0) * (+l.r || 0), 0);
const totalOf = (est, taxPct) => subtotal(est) * (1 + taxPct / 100);
const unit = (t) => LINE_TYPES.find((x) => x.id === t)?.unit || "ea";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function payouts(job, staff, info) {
  const gross = totalOf(job.est, info.tax);
  const fee = gross * 0.029 + 0.3;
  const rows = job.crew.map((id) => {
    const s = staff.find((x) => x.id === id);
    if (!s) return null;
    const mine = job.est.lines.filter((l) => l.who === id);
    const hours = mine.reduce((a, l) => a + (+l.q || 0), 0);
    const billed = mine.reduce((a, l) => a + (+l.q || 0) * (+l.r || 0), 0);
    let amt = 0, basis = "";
    if (s.payType === "hourly") { amt = hours * (s.hourlyRate || 0); basis = `${hours} hrs × ${usd2(s.hourlyRate || 0)}`; }
    else if (s.payType === "percent") { amt = billed * (s.percent || 0) / 100; basis = `${s.percent}% of ${usd2(billed)} labor`; }
    else { amt = job.flatPay?.[id] ?? s.flat ?? 0; basis = "Flat for this job"; }
    return { id, s, amt, basis, hours, billed };
  }).filter(Boolean).filter((r) => r.amt > 0 || r.hours > 0);
  const crewTotal = rows.reduce((a, r) => a + r.amt, 0);
  return { gross, fee, rows, crewTotal, shop: gross - fee - crewTotal };
}

/** Build a notification aimed at the owner plus everyone on the job's crew. */
function buildNotif(shop, job, { kind, title, body, actorId, toClient }) {
  const to = shop.staff
    .filter((s) => s.role === "owner" || job.crew.includes(s.id))
    .map((s) => s.id)
    .filter((id) => id !== actorId);
  return { id: uid(), jobId: job.id, kind, title, body, at: now(), to, read: [], toClient: !!toClient };
}

/** Paint codes this shop has already recorded for a make — the shop's own code book. */
function codeBook(shop, make) {
  const seen = new Set();
  shop.jobs.forEach((j) => {
    const p = (j.v.paint || "").trim();
    if (!p || /^not recorded/i.test(p)) return;
    if (!make || j.v.make === make) seen.add(p);
  });
  return [...seen].sort();
}

async function shrink(file, max, quality) {
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file);
  });
  const scale = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return c.toDataURL("image/jpeg", quality);
}

function DocSheet({ job, client, info, kind, onClose, onSent, toast }) {
  const html = docHTML(job, client, info, kind);
  const text = docText(job, client, info, kind);
  const label = kind === "invoice" ? "Invoice" : "Estimate";

  const download = () => {
    const docCSS = CSS.split(".bs .doc {")[1] ? ".bs .doc {" + CSS.split(".bs .doc {")[1].split("@media print")[0] : "";
    const page = `<!doctype html><meta charset="utf-8"><title>${label} ${job.ro}</title>
<style>body{font-family:Barlow,system-ui,sans-serif;margin:0;padding:32px;background:#fff}${docCSS}</style>
<div class="bs">${html}</div>`;
    const url = URL.createObjectURL(new Blob([page], { type: "text/html" }));
    const a = document.createElement("a");
    a.href = url; a.download = `${info.name.replace(/\W+/g, "-")}-${job.ro}-${kind}.html`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Downloaded");
  };
  const sms = () => {
    const body = encodeURIComponent(text);
    window.location.href = `sms:${(client?.phone || "").replace(/\D/g, "")}${/iPhone|iPad|Mac/.test(navigator.userAgent) ? "&" : "?"}body=${body}`;
    onSent?.("text");
  };
  const email = () => {
    window.location.href = `mailto:${client?.email || ""}?subject=${encodeURIComponent(`${label} ${job.ro} — ${info.name}`)}&body=${encodeURIComponent(text)}`;
    onSent?.("email");
  };
  const share = async () => {
    try {
      if (navigator.share) { await navigator.share({ title: `${label} ${job.ro}`, text }); onSent?.("share"); }
      else { await navigator.clipboard.writeText(text); toast("Copied to the clipboard"); }
    } catch {}
  };

  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <div className="noprint" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h1 style={{ fontSize: 22, margin: 0 }}>{label} {job.ro}</h1>
          <button onClick={onClose} style={{ fontSize: 22, color: "var(--muted)", padding: "0 4px" }}>×</button>
        </div>
        <div dangerouslySetInnerHTML={{ __html: html }} />
        <div className="noprint" style={{ marginTop: 16 }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <button className="btn sm" onClick={sms}>Text it</button>
            <button className="btn sm" onClick={email}>Email it</button>
          </div>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <button className="btn sm" data-v="quiet" onClick={() => window.print()}>Print</button>
            <button className="btn sm" data-v="quiet" onClick={download}>Download</button>
            <button className="btn sm" data-v="quiet" onClick={share}>Share</button>
          </div>
          <button className="btn" data-v="quiet" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════  VIN FIELD  ══════════════════ */

function VinLookup({ vin, setVin, onDecoded }) {
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState(null);
  const run = async () => {
    const off = decodeOffline(vin);
    if (!off.ok) { setNote({ bad: true, text: off.why }); return; }
    setBusy(true); setNote(null);
    let result = { year: off.year, make: off.make, model: "", trim: "", body: "", engine: "", drive: "" };
    let full = false;
    try {
      const on = await decodeOnline(off.vin);
      result = { ...result, ...Object.fromEntries(Object.entries(on).filter(([, v]) => v)) };
      full = true;
    } catch {}
    setBusy(false); setVin(off.vin); onDecoded(result);
    const line = [result.year, result.make, result.model, result.trim].filter(Boolean).join(" ");
    setNote({
      bad: false, make: result.make,
      text: full
        ? `${line}${result.engine ? ` · ${result.engine}` : ""}${result.drive ? ` · ${result.drive}` : ""}`
        : `${line} — read from the VIN itself. Fill in the model by hand.`,
    });
  };
  return (
    <>
      <span className="lab">VIN</span>
      <div style={{ display: "flex", gap: 8 }}>
        <input className="field" style={{ letterSpacing: ".04em" }} autoCapitalize="characters" maxLength={17}
          placeholder="17 characters" value={vin}
          onChange={(e) => { setVin(e.target.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, "")); setNote(null); }} />
        <button className="btn" style={{ width: 96, padding: 11 }} disabled={vin.length !== 17 || busy} onClick={run}>{busy ? "…" : "Decode"}</button>
      </div>
      <p className="sub" style={{ margin: "-2px 0 10px", color: note?.bad ? "var(--flag)" : "var(--muted)" }}>
        {note ? note.text : "Decode fills year, make, model, trim, body style, and engine."}
      </p>
    </>
  );
}

          </>
        )}

        {tab === "money" && !owner && (
          <>
            <div className="card">
              <div style={{ fontSize: 13, color: "var(--muted)" }}>Your pay on this job</div>
              <div className="money" style={{ fontSize: 34 }}>{usd2(mine?.amt || 0)}</div>
              <div style={{ fontSize: 13, color: "var(--muted)" }}>{mine?.basis || "Nothing booked yet"}</div>
              <hr className="hr" />
              {job.est.lines.filter((l) => l.who === me.id).map((l) => (
                <div key={l.id} className="line"><span style={{ flex: 1 }}>{l.d}</span><span className="money">{l.q} {unit(l.t)}</span></div>
              ))}
            </div>
            <p className="sub">{job.inv.status === "paid" ? `Deposited to ${me.bank} on ${job.inv.when}.` : `Lands in ${me.bank || "your account"} the day the client pays.`}</p>
          </>
        )}

        {tab === "money" && owner && (
          <>
            <div className="card">
              <div className="row" style={{ marginBottom: 12 }}>
                <span style={{ fontWeight: 600 }}>Estimate</span>
                <span className="chip" data-t={job.est.status === "approved" ? "ok" : job.est.status === "sent" ? "warn" : ""}>
                  {job.est.status === "approved" ? "Approved" : job.est.status === "sent" ? "Waiting on client" : "Draft"}
                </span>
              </div>
              {job.est.lines.length === 0 && <div style={{ color: "var(--muted)", fontSize: 14, padding: "8px 0" }}>Nothing on this estimate yet.</div>}
              {job.est.lines.map((l) => (
                <button key={l.id} className="line" style={{ width: "100%", textAlign: "left", alignItems: "flex-start" }} onClick={() => setEditLine(l)}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 500 }}>{l.d}</div>
                    <div style={{ fontSize: 12, color: "var(--muted)" }}>
                      {l.q} {unit(l.t)} × {usd2(l.r)}{l.who ? ` · ${staff.find((s) => s.id === l.who)?.name.split(" ")[0]}` : ""}{l.supp ? " · supplement" : ""}
                    </div>
                  </div>
                  <span className="money">{usd2(l.q * l.r)}</span>
                </button>
              ))}
              <button className="btn sm" data-v="quiet" style={{ marginTop: 12 }} onClick={() => setEditLine(null)}>Add a line</button>
              <hr className="hr" />
              <div className="line" style={{ color: "var(--muted)" }}><span style={{ flex: 1 }}>Subtotal</span><span className="money">{usd2(subtotal(job.est))}</span></div>
              <div className="line" style={{ color: "var(--muted)" }}><span style={{ flex: 1 }}>Sales tax {info.tax}%</span><span className="money">{usd2(subtotal(job.est) * info.tax / 100)}</span></div>
              <div className="row" style={{ paddingTop: 12 }}>
                <span style={{ fontWeight: 600 }}>Total</span><span className="money" style={{ fontSize: 26 }}>{usd2(tot)}</span>
              </div>
              {job.est.approvedBy && <p className="sub" style={{ marginTop: 10 }}>Approved by {job.est.approvedBy} on {job.est.approvedAt}.</p>}
            </div>

            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <button className="btn sm" data-v="quiet" disabled={!job.est.lines.length} onClick={() => setDoc("estimate")}>Estimate document</button>
              <button className="btn sm" data-v="quiet" disabled={!job.est.lines.length} onClick={() => setDoc("invoice")}>Invoice document</button>
            </div>

            <div className="head">What the crew earns on this</div>
            <div className="card">
              {po.rows.length === 0 && <div style={{ color: "var(--muted)", fontSize: 14 }}>No crew pay booked yet.</div>}
              {po.rows.map((r) => (
                <div key={r.id} className="line">
                  <span className="avatar" style={{ width: 26, height: 26, fontSize: 10 }}>{r.s.init}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontWeight: 500 }}>{r.s.name}</div>
                    <div style={{ fontSize: 12, color: "var(--muted)" }}>{r.basis}</div>
                  </div>
                  <span className="money">{usd2(r.amt)}</span>
                </div>
              ))}
              <div className="line" style={{ color: "var(--muted)" }}><span style={{ flex: 1 }}>Processing fee</span><span className="money">−{usd2(po.fee)}</span></div>
              <div className="line"><span style={{ flex: 1, fontWeight: 600 }}>Shop keeps</span><span className="money" style={{ fontSize: 18 }}>{usd2(po.shop)}</span></div>
            </div>

            {job.est.status === "draft" && (
              <button className="btn" disabled={!job.est.lines.length} onClick={() => setDoc("estimate")}>
                Send to {(client?.contact || "client").split(" ")[0]} for approval
              </button>
            )}
            {job.est.status === "sent" && (
              <button className="btn" data-v="ghost" onClick={() => update(
                { ...job, est: { ...job.est, status: "approved", approvedBy: client?.contact, approvedAt: now() } },
                { kind: "money", title: `${job.v.model} estimate approved`, body: `${client?.contact} approved ${usd2(tot)}.`, toClient: false })}>
                Record approval
              </button>
            )}
            {job.est.status === "approved" && job.inv.status !== "paid" && (
              <button className="btn" onClick={() => {
                update({ ...job, inv: { status: "paid", method: "Visa ••4242", when: "Today" } },
                  { kind: "money", title: `${job.ro} paid`, body: `${client?.name} paid ${usd2(tot)}. Payouts are on the way.`, toClient: true });
                toast("Paid and split to the crew");
              }}>Charge {usd2(tot)}</button>
            )}
            {job.inv.status === "paid" && (
              <div className="card">
                <div className="row" style={{ marginBottom: 12 }}>
                  <span style={{ fontWeight: 600 }}>Paid {job.inv.when}</span>
                  <span className="chip" data-t="ok">{job.inv.method}</span>
                </div>
                {po.rows.map((r) => (
                  <div key={r.id} className="line">
                    <span className="avatar" style={{ width: 24, height: 24, fontSize: 10 }}>{r.s.init}</span>
                    <span style={{ flex: 1 }}>{r.s.name} → {r.s.bank || "no account"}</span>
                    <span className="money">{usd2(r.amt)}</span>
                  </div>
                ))}
                <div className="line"><span style={{ flex: 1, fontWeight: 600 }}>Shop → {info.bank}</span><span className="money">{usd2(po.shop)}</span></div>
              </div>
            )}
          </>
        )}
      </div>

      {doc && (
        <DocSheet job={job} client={client} info={info} kind={doc} toast={toast} onClose={() => setDoc(null)}
          onSent={(how) => {
            if (doc === "estimate" && job.est.status === "draft") {
              update({ ...job, est: { ...job.est, status: "sent", sentAt: now() } },
                { kind: "money", title: `Estimate sent for the ${job.v.model}`, body: `${usd2(tot)} sent to ${client?.contact}.`, toClient: true });
            }
            toast(how === "email" ? "Opening your mail app" : how === "text" ? "Opening your messages app" : "Shared");
          }} />
      )}

      {editLine !== undefined && (
        <LineEditor line={editLine} staff={staff} defaultRate={laborRate} jobType={job.type} onSave={saveLine} onClose={() => setEditLine(undefined)}
          onDelete={() => { update({ ...job, est: { ...job.est, lines: job.est.lines.filter((x) => x.id !== editLine.id) } }); setEditLine(undefined); toast("Line removed"); }} />
      )}

      {crewOpen && (
        <div className="sheet" onClick={() => setCrewOpen(false)}>
          <div onClick={(e) => e.stopPropagation()}>
            <h1 style={{ fontSize: 22, margin: "0 0 16px" }}>Crew and pay</h1>
            {staff.filter((s) => s.role === "tech").map((s) => {
              const on = job.crew.includes(s.id);
              return (
                <div className="card" key={s.id}>
                  <button style={{ width: "100%" }} onClick={() => update(
                    { ...job, crew: on ? job.crew.filter((x) => x !== s.id) : [...job.crew, s.id] },
                    on ? null : { kind: "alert", title: `${s.name.split(" ")[0]} added to the ${job.v.model}`, body: `${vlabel} · due ${job.promised}`, toClient: false })}>
                    <div className="row">
                      <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                        <span className="avatar">{s.init}</span>
                        <div style={{ textAlign: "left" }}>
                          <div style={{ fontWeight: 600 }}>{s.name}</div>
                          <div style={{ fontSize: 12.5, color: "var(--muted)" }}>
                            {s.payType === "hourly" ? `${usd(s.hourlyRate)}/hr` : s.payType === "percent" ? `${s.percent}% of labor` : `${usd(s.flat)} flat`}
                          </div>
                        </div>
                      </div>
                      <span className="chip" data-t={on ? "ok" : ""}>{on ? "On" : "Off"}</span>
                    </div>
                  </button>
                  {on && s.payType === "flat" && (
                    <><hr className="hr" /><span className="lab">Flat amount for this job</span>
                    <input className="field" style={{ marginBottom: 0 }} inputMode="decimal" value={job.flatPay?.[s.id] ?? s.flat}
                      onChange={(e) => update({ ...job, flatPay: { ...(job.flatPay || {}), [s.id]: +e.target.value.replace(/[^\d.]/g, "") || 0 } })} /></>
                  )}
                </div>
              );
            })}
            <button className="btn" style={{ marginTop: 6 }} onClick={() => setCrewOpen(false)}>Done</button>
          </div>
        </div>
      )}
    </>
  );
}

/* ══════════════════  APP  ══════════════════ */

function ColorCodePro() {
  const [phase, setPhase] = useState("loading");   // loading | auth | noshop | ready
  const [shop, setShop] = useState(null);          // this shop's whole record
  const [shopId, setShopId] = useState(null);
  const [account, setAccount] = useState(null);    // the Supabase user
  const [inviteLink, setInviteLink] = useState(null);
  const [view, setView] = useState("jobs");
  const [openId, setOpenId] = useState(null);
  const [filter, setFilter] = useState("all");
  const [sheet, setSheet] = useState(null);
  const [msg, setMsg] = useState("");
  const [editContact, setEditContact] = useState(null);
  const [editStaff, setEditStaff] = useState(null);
  const [contactFilter, setContactFilter] = useState("dealer");
  const [ticket, setTicket] = useState(null);
  const [portalOf, setPortalOf] = useState(null);
  const logoRef = useRef(null);

  const blankVehicle = { year: "", make: "", model: "", trim: "", vin: "", plate: "", miles: "", color: "#8C9196", body: "", engine: "", drive: "", paint: "" };
  /* type: collision | mechanical | maintenance */
  const [nv, setNv] = useState({ ...blankVehicle, type: "collision", kind: "private", clientId: "", promised: "" });

  /* ── boot: follow the Supabase session ── */
  useEffect(() => {
    if (!sb) { setPhase("config"); return; }
    let alive = true;
    const handle = (session) => { if (alive) resolve(session); };
    sb.auth.getSession().then(({ data }) => handle(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, session) => handle(session));
    return () => { alive = false; sub?.subscription?.unsubscribe(); };
  }, []);

  async function resolve(session) {
    if (!session) { setPhase("auth"); setShop(null); setAccount(null); return; }
    setAccount(session.user);

    // redeem an invite link if one brought us here
    const token = new URLSearchParams(window.location.search).get("join");
    if (token) {
      try { await sb.rpc("accept_staff_invite", { invite: token }); } catch {}
      window.history.replaceState({}, "", window.location.pathname);
    }

    try {
      const id = await myShopId();
      if (!id) { setPhase("noshop"); return; }
      setShopId(id);

      let blob = await readBlob(id);
      if (!blob) {
        const { data: row } = await sb.from("shops").select("name,city").eq("id", id).maybeSingle();
        blob = blankShop(id, row?.name, row?.city, {
          id: session.user.id, name: session.user.email.split("@")[0], email: session.user.email,
        });
        await writeBlob(id, blob);
      }

      // make sure whoever just signed in exists in the staff list
      const email = session.user.email.toLowerCase();
      if (!blob.staff.some((x) => (x.email || "").toLowerCase() === email)) {
        const { data: srow } = await sb.from("staff").select("name,role,title").eq("id", session.user.id).maybeSingle();
        const name = srow?.name || email.split("@")[0];
        blob = { ...blob, staff: [...blob.staff, {
          id: session.user.id, name, email, role: srow?.role === "owner" ? "owner" : "tech",
          title: srow?.title || "Technician", init: initialsOf(name), bank: null, payout: "pending",
          payType: "hourly", hourlyRate: 34, percent: 45, flat: 150, mode: null,
        }] };
        await writeBlob(id, blob);
      }

      setShop(blob);
      setPhase("ready");
    } catch (e) {
      setPhase("noshop");
    }
  }

  const saveShop = async (next) => {
    setShop(next);
    try { await writeBlob(shopId, next); }
    catch (e) { setMsg("Couldn't save — " + e.message); setTimeout(() => setMsg(""), 4000); }
  };
  const toast = (t) => { setMsg(t); setTimeout(() => setMsg(""), 2400); };

  const doSignIn = async (email, password) => {
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    if (error) throw new Error(friendly(error.message));
  };

  const doSignUpShop = async (f) => {
    const { data, error } = await sb.auth.signUp({ email: f.email.trim(), password: f.pass });
    if (error) throw new Error(friendly(error.message));
    if (!data.session) throw new Error("Account made. Confirm your email, then sign in — or switch off email confirmation in Supabase.");
    const { data: newId, error: e2 } = await sb.rpc("create_shop_for_owner", {
      shop_name: f.shop.trim(), owner_name: f.name.trim(), shop_city: f.city?.trim() || null,
    });
    if (e2) throw new Error(e2.message);
    await writeBlob(newId, blankShop(newId, f.shop.trim(), f.city?.trim(), {
      id: data.user.id, name: f.name.trim(), email: f.email.trim().toLowerCase(),
    }));
    await resolve((await sb.auth.getSession()).data.session);
  };

  const doCreateShop = async (f) => {
    const { data: newId, error } = await sb.rpc("create_shop_for_owner", {
      shop_name: f.shop.trim(), owner_name: f.name.trim(), shop_city: f.city?.trim() || null,
    });
    if (error) throw new Error(error.message);
    await writeBlob(newId, blankShop(newId, f.shop.trim(), f.city?.trim(), {
      id: account.id, name: f.name.trim(), email: account.email.toLowerCase(),
    }));
    await resolve((await sb.auth.getSession()).data.session);
  };

  const doJoin = async (pasted) => {
    const m = pasted.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
    if (!m) throw new Error("That doesn't look like an invite link.");
    const { error } = await sb.rpc("accept_staff_invite", { invite: m[0] });
    if (error) throw new Error(error.message);
    await resolve((await sb.auth.getSession()).data.session);
  };

  const signOut = async () => { await sb.auth.signOut(); setOpenId(null); setView("jobs"); };

  if (phase === "config") return <NeedsConfig />;
  if (phase === "loading") return <div className="bs plain" style={themeVars("gaz", "light")}><style>{CSS}</style><div className="pad" style={{ paddingTop: 60, color: "#657482" }}>Opening the shop…</div></div>;
  if (phase === "auth") return <Auth onSignIn={doSignIn} onSignUpShop={doSignUpShop}
    onReset={(email) => sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href })} />;
  if (phase === "noshop") return <NoShop email={account?.email} onCreate={doCreateShop} onJoin={doJoin} onSignOut={signOut} />;

  const me = shop.staff.find((x) => (x.email || "").toLowerCase() === (account?.email || "").toLowerCase()) || shop.staff[0];
  const owner = me.role === "owner";
  const info = shop.info;
  const mode = me.mode || info.mode || "light";
  const theme = THEMES[info.theme] || THEMES.gaz;
  const clientOf = (j) => shop.contacts.find((c) => c.id === j.clientId);

  const patch = (fields) => saveShop({ ...shop, ...fields });
  const setInfo = (k, v) => patch({ info: { ...info, [k]: v } });
  const setMyMode = (m) => patch({ staff: shop.staff.map((s) => (s.id === me.id ? { ...s, mode: m } : s)) });

  /** Update a job and optionally raise a notification for everyone attached to it. */
  const update = (nextJob, notif) => {
    const jobs = shop.jobs.map((j) => (j.id === nextJob.id ? nextJob : j));
    const notifs = notif
      ? [buildNotif(shop, nextJob, { ...notif, actorId: me.id }), ...shop.notifs].slice(0, 60)
      : shop.notifs;
    patch({ jobs, notifs });
  };

  const myNotifs = shop.notifs.filter((n) => n.to.includes(me.id));
  const unreadCount = myNotifs.filter((n) => !n.read.includes(me.id)).length;
  const jobUnread = (jobId) => shop.notifs.some((n) => n.jobId === jobId && n.to.includes(me.id) && !n.read.includes(me.id));
  const markAllRead = () => patch({
    notifs: shop.notifs.map((n) => (n.to.includes(me.id) && !n.read.includes(me.id) ? { ...n, read: [...n.read, me.id] } : n)),
  });

  const visible = owner ? shop.jobs : shop.jobs.filter((j) => j.crew.includes(me.id));
  const job = visible.find((j) => j.id === openId);
  const shown = visible.filter((j) => {
    if (filter === "all") return true;
    if (filter === "hold") return j.hold;
    if (filter === "done") return isLast(j);
    if (JOB_TYPES.some((t) => t.id === filter)) return (j.type || "collision") === filter;
    return clientOf(j)?.kind === filter;
  });
  const unpaid = visible.filter((j) => j.inv.status !== "paid").reduce((a, j) => a + totalOf(j.est, info.tax), 0);
  const activeCount = visible.filter((j) => !isLast(j)).length;
  const myRow = (j) => payouts(j, shop.staff, info).rows.find((r) => r.id === me.id);
  const myEarned = shop.jobs.reduce((a, j) => a + (myRow(j)?.amt || 0), 0);
  const myPaid = shop.jobs.filter((j) => j.inv.status === "paid").reduce((a, j) => a + (myRow(j)?.amt || 0), 0);
  const pickable = shop.contacts.filter((c) => c.kind === nv.kind);

  const createJob = () => {
    const id = uid();
    patch({
      jobs: [{
        id, ro: `RO-${2430 + shop.jobs.length}`, clientId: nv.clientId, type: nv.type,
        v: { year: nv.year || "—", make: nv.make || "Vehicle", model: nv.model || "", trim: nv.trim, color: nv.color,
             paint: nv.paint || "Not recorded yet", vin: nv.vin || "Add at teardown", plate: nv.plate || "—",
             miles: nv.miles || "—", body: nv.body, engine: nv.engine, drive: nv.drive },
        claim: null, stage: "intake", hold: false, dropped: "Today", promised: nv.promised || "Not set",
        crew: [], flatPay: {}, photos: [], notes: [], msgs: [],
        ccc: nv.type === "mechanical" ? { complaint: "", cause: "", correction: "" } : undefined,
        service: nv.type === "maintenance" ? { nextDue: "", items: newChecklist() } : undefined,
        est: { status: "draft", lines: [] }, inv: { status: "unpaid" },
      }, ...shop.jobs],
    });
    setNv({ ...blankVehicle, type: "collision", kind: "private", clientId: "", promised: "" });
    setSheet(null); setOpenId(id); setView("jobs"); toast("Job started");
  };

  const saveContact = (c, keepOpen) => {
    const exists = shop.contacts.some((x) => x.id === c.id);
    patch({ contacts: exists ? shop.contacts.map((x) => (x.id === c.id ? c : x)) : [...shop.contacts, c] });
    if (keepOpen) { setEditContact(c); return; }
    setEditContact(null);
    toast(exists ? "Saved" : `${c.kind === "dealer" ? "Dealership" : "Customer"} added`);
  };
  const saveStaff = async (st) => {
    const exists = shop.staff.some((x) => x.id === st.id);
    patch({ staff: exists ? shop.staff.map((x) => (x.id === st.id ? st : x)) : [...shop.staff, st] });
    setEditStaff(null);
    if (exists) { toast("Saved"); return; }
    try {
      const { data, error } = await sb.from("staff_invites").insert({
        shop_id: shopId, email: st.email.trim().toLowerCase(), name: st.name, title: st.title, role: "tech",
        pay_type: st.payType, hourly_rate: st.hourlyRate, percent: st.percent, flat_amount: st.flat,
      }).select().single();
      if (error) throw new Error(error.message);
      setInviteLink({
        name: st.name, email: st.email, phone: "",
        url: `${window.location.origin}${window.location.pathname}?join=${data.token}`,
      });
    } catch (e) { toast("Added, but the invite link failed: " + e.message); }
  };
  const submitTicket = (t) => {
    const ref = `CC-${1040 + shop.tickets.length}`;
    patch({ tickets: [{ ...t, id: uid(), ref, by: me.name, at: now(), status: "open" }, ...shop.tickets] });
    setTicket(null);
    toast(`Ticket ${ref} submitted`);
  };
  const uploadLogo = async (e) => {
    const f = e.target.files?.[0]; e.target.value = "";
    if (!f) return;
    try { setInfo("logo", await shrink(f, 320, 0.85)); toast("Logo updated"); } catch { toast("Couldn't read that image"); }
  };

  const TABS = owner
    ? [["jobs", "◱", "Jobs"], ["money", "$", "Money"], ["clients", "☰", "Clients"], ["team", "◍", "Team"], ["set", "⚙", "Settings"]]
    : [["jobs", "◱", "My jobs"], ["money", "$", "My pay"], ["set", "⚙", "Settings"]];

  const Bell = () => (
    <button className="bell" onClick={() => { setView("alerts"); setOpenId(null); }} aria-label="Alerts">
      ◔{unreadCount > 0 && <span className="badge">{unreadCount > 9 ? "9+" : unreadCount}</span>}
    </button>
  );

  return (
    <div className="bs" style={themeVars(info.theme, mode)}>
      <style>{CSS}</style>

      {view === "jobs" && job && (
        <JobDetail job={job} client={clientOf(job)} me={me} staff={shop.staff} info={info}
          back={() => setOpenId(null)} update={update} toast={toast} />
      )}

      {view === "jobs" && !job && (
        <>
          <div className="bar">
            <div className="row">
              <div style={{ display: "flex", gap: 11, alignItems: "center", minWidth: 0 }}>
                {info.logo && <img className="logo" src={info.logo} alt="" />}
                <div style={{ minWidth: 0 }}>
                  <h1>{owner ? info.name : `Morning, ${me.name.split(" ")[0]}`}</h1>
                  <p className="sub">
                    {activeCount} {activeCount === 1 ? "vehicle" : "vehicles"} in the shop
                    {owner ? <> · <span className="money">{usd(unpaid)}</span> out</> : <> · <span className="money">{usd(myEarned - myPaid)}</span> coming</>}
                  </p>
                </div>
              </div>
              <Bell />
            </div>
          </div>
          <div className="pad">
            <div className="seg">
              {[["all", "All"], ["collision", "Body"], ["mechanical", "Mech"], ["maintenance", "Service"],
                ["private", "Private"], ["dealer", "Dealerships"], ["hold", "On hold"], ["done", "Ready"]].map(([k, l]) => (
                <button key={k} data-on={filter === k ? "1" : "0"} onClick={() => setFilter(k)}>{l}</button>
              ))}

                  {codeBook(shop, nv.make).map((c) => <option key={c} value={c} />)}
                </datalist>
                <p className="sub" style={{ margin: "-2px 0 12px" }}>
                  The VIN doesn't carry paint — it's on the body sticker.{" "}
                  {nv.make ? <><strong>{nv.make}:</strong> {STICKER_SPOTS[nv.make] || DEFAULT_SPOT}</> : DEFAULT_SPOT}
                  {codeBook(shop, nv.make).length > 0 && " Codes you've used before will autocomplete."}
                </p>
              </>
            )}
            <span className="lab">Color</span>
            <div className="colorrow">
              {CAR_COLORS.map((c) => <button key={c} style={{ background: c }} data-on={nv.color === c ? "1" : "0"} onClick={() => setNv({ ...nv, color: c })} aria-label={c} />)}
              <input type="color" value={nv.color} onChange={(e) => setNv({ ...nv, color: e.target.value })}
                style={{ width: 32, height: 32, border: "none", background: "none", padding: 0 }} aria-label="Custom color" />
            </div>
            <input className="field" placeholder="Promise date, e.g. Sep 9" value={nv.promised} onChange={(e) => setNv({ ...nv, promised: e.target.value })} />
            <button className="btn" data-v="tape" disabled={!nv.clientId} onClick={createJob}>Start the job</button>
            {!nv.clientId && <p className="sub" style={{ marginTop: 8 }}>Pick a client before you can start the job.</p>}
            <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={() => setSheet(null)}>Cancel</button>
          </div>
        </div>
      )}

      {editContact && (
        <ContactSheet c={editContact} info={info} toast={toast}
          jobs={shop.jobs.filter((j) => j.clientId === editContact.id)}
          onSave={saveContact} onClose={() => setEditContact(null)}
          onPreview={(c) => setPortalOf(c)}
          onDelete={shop.jobs.some((j) => j.clientId === editContact.id) ? null : () => {
            patch({ contacts: shop.contacts.filter((x) => x.id !== editContact.id) });
            setEditContact(null); toast("Removed");
          }} />
      )}
      {portalOf && (
        <PortalPreview c={portalOf} info={info} taxPct={info.tax}
          jobs={shop.jobs.filter((j) => j.clientId === portalOf.id)} onClose={() => setPortalOf(null)} />
      )}
      {editStaff && <StaffSheet s={editStaff} onSave={saveStaff} onClose={() => setEditStaff(null)} />}
      {inviteLink && <InviteSheet i={inviteLink} shopName={info.name} toast={toast} onClose={() => setInviteLink(null)} />}
      {ticket && (
        <TicketSheet t={ticket} jobs={shop.jobs} me={me} shop={shop} theme={theme} mode={mode}
          onSubmit={submitTicket} onClose={() => setTicket(null)} />
      )}
      {msg && <div className="toast">{msg}</div>}

      <div className="tabbar">
        {TABS.map(([k, g, l]) => (
          <button key={k} data-on={view === k ? "1" : "0"} onClick={() => { setView(k); setOpenId(null); }}>
            <span className="glyph">{g}</span>{l}
          </button>
        ))}
      </div>
    </div>
  );
}

/* ══════════════════  SHEETS  ══════════════════ */

function ContactSheet({ c, info, jobs, toast, onSave, onClose, onDelete, onPreview }) {
  const [f, setF] = useState({ people: [], ...c });
  const [person, setPerson] = useState(null);
  const set = (k, v) => setF({ ...f, [k]: v });
  const dealer = f.kind === "dealer";
  const people = f.people || [];

  /* People changes commit straight away so an invite is never lost in a draft. */
  const commit = (nextPeople) => {
    const merged = { ...f, people: nextPeople, isNew: undefined, contact: dealer ? f.contact || f.name : f.name, rate: +f.rate || 0 };
    setF({ ...merged, isNew: f.isNew });
    onSave(merged, true);
  };

  const invite = (pp, how) => {
    const link = `${(info.name || "shop").toLowerCase().replace(/\W+/g, "")}.colorcodepro.app/portal`;
    const body = `${pp.name.split(" ")[0]}, you can now follow your vehicles with ${info.name} — status, photos, estimates, and invoices in one place. Set your password here: ${link}`;
    if (how === "text") window.location.href = `sms:${(pp.phone || "").replace(/\D/g, "")}${/iPhone|iPad|Mac/.test(navigator.userAgent) ? "&" : "?"}body=${encodeURIComponent(body)}`;
    else window.location.href = `mailto:${pp.email || ""}?subject=${encodeURIComponent(`Your ${info.name} portal`)}&body=${encodeURIComponent(body)}`;
    const next = people.map((x) => (x.id === pp.id ? { ...x, portal: x.portal === "active" ? "active" : "invited", invitedAt: now() } : x));
    commit(next);
    toast(how === "text" ? "Opening your messages app" : "Opening your mail app");
  };

  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 16px" }}>{f.isNew ? `New ${dealer ? "dealership" : "customer"}` : f.name}</h1>
        <span className="lab">{dealer ? "Dealership name" : "Full name"}</span>
        <input className="field" value={f.name} onChange={(e) => set("name", e.target.value)} />
        {dealer && (<><span className="lab">Who you deal with</span>
          <input className="field" value={f.contact} onChange={(e) => set("contact", e.target.value)} /></>)}
        <span className="lab">Phone</span>
        <input className="field" inputMode="tel" value={f.phone} onChange={(e) => set("phone", e.target.value)} />
        <span className="lab">Email</span>
        <input className="field" type="email" autoCapitalize="none" value={f.email} onChange={(e) => set("email", e.target.value)} />
        <span className="lab">Address</span>
        <input className="field" value={f.address} onChange={(e) => set("address", e.target.value)} />
        {dealer ? (
          <div style={{ display: "flex", gap: 8 }}>
            <div style={{ flex: 1 }}><span className="lab">Payment terms</span>
              <input className="field" placeholder="Net 30" value={f.terms} onChange={(e) => set("terms", e.target.value)} /></div>
            <div style={{ flex: 1 }}><span className="lab">Their labor rate /hr</span>
              <input className="field" inputMode="decimal" placeholder="62" value={f.rate} onChange={(e) => set("rate", e.target.value.replace(/[^\d.]/g, ""))} /></div>
          </div>
        ) : (
          <div style={{ display: "flex", gap: 8 }}>
            <div style={{ flex: 1 }}><span className="lab">Insurer</span>
              <input className="field" value={f.insurer || ""} onChange={(e) => set("insurer", e.target.value)} /></div>
            <div style={{ flex: 1 }}><span className="lab">Policy number</span>
              <input className="field" value={f.policy || ""} onChange={(e) => set("policy", e.target.value)} /></div>
          </div>
        )}
        <span className="lab">Notes</span>
        <textarea className="field" rows={2} value={f.notes || ""} onChange={(e) => set("notes", e.target.value)} />

        {!f.isNew && (
          <>
            <div className="head">Portal access</div>
            <div className="card">
              {people.length === 0 && (
                <div style={{ color: "var(--muted)", fontSize: 14, paddingBottom: 10 }}>
                  Nobody here can see their vehicles yet.
                </div>
              )}
              {people.map((pp) => (
                <button className="line" key={pp.id} style={{ width: "100%", textAlign: "left" }} onClick={() => setPerson(pp)}>
                  <span className="avatar" style={{ width: 28, height: 28, fontSize: 10 }}>
                    {pp.name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase()}
                  </span>
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <span style={{ display: "block", fontWeight: 500 }}>{pp.name}</span>
                    <span style={{ display: "block", fontSize: 12, color: "var(--muted)" }}>
                      {pp.title || "No title"} · {(pp.perms || []).length} of {PORTAL_PERMS.length} permissions
                    </span>
                  </span>
                  <span className="chip" data-t={pp.portal === "active" ? "ok" : pp.portal === "invited" ? "warn" : ""}>
                    {pp.portal === "active" ? "Active" : pp.portal === "invited" ? "Invited" : "No access"}
                  </span>
                </button>
              ))}
              <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                <button className="btn sm" data-v="quiet" onClick={() => setPerson({
                  id: uid(), name: "", title: dealer ? "Service manager" : "Owner", email: "", phone: f.phone || "",
                  perms: ["status", "message"], portal: "none", isNew: true,
                })}>
                  {dealer ? "Invite someone here" : "Invite the customer"}
                </button>
                {people.some((x) => x.portal === "active") && (
                  <button className="btn sm" data-v="quiet" style={{ width: 118 }} onClick={() => onPreview(f)}>What they see</button>
                )}
              </div>
            </div>
            <p className="sub" style={{ marginBottom: 14 }}>
              {dealer
                ? "Give each person at the dealership their own login. A service manager who can approve and pay, a used car manager who only watches status — their choice of light or dark, your shop's paint colour."
                : "One login per person. Handy when a spouse or an adjuster needs to follow the repair too."}
            </p>
          </>
        )}

        <button className="btn" disabled={!f.name.trim()}
          onClick={() => onSave({ ...f, isNew: undefined, contact: dealer ? f.contact || f.name : f.name, rate: +f.rate || 0 })}>
          {f.isNew ? "Add" : "Save"}
        </button>
        {f.isNew && <p className="sub" style={{ marginTop: 8 }}>Add them first, then you can send portal invites.</p>}
        {onDelete && !f.isNew && <button className="btn" data-v="danger" style={{ marginTop: 8 }} onClick={onDelete}>Delete</button>}
        <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={onClose}>Cancel</button>
      </div>

      {person && (
        <PersonSheet p={person} dealer={dealer} onClose={() => setPerson(null)}
          onSave={(pp) => {
            const exists = people.some((x) => x.id === pp.id);
            commit(exists ? people.map((x) => (x.id === pp.id ? pp : x)) : [...people, pp]);
            setPerson(null);
          }}
          onInvite={(pp, how) => {
            const exists = people.some((x) => x.id === pp.id);
            if (!exists) commit([...people, pp]);
            invite(pp, how);
            setPerson(null);
          }}
          onRemove={() => { commit(people.filter((x) => x.id !== person.id)); setPerson(null); }} />
      )}
    </div>
  );
}

function PersonSheet({ p, dealer, onSave, onInvite, onRemove, onClose }) {
  const [f, setF] = useState(p);
  const set = (k, v) => setF({ ...f, [k]: v });
  const toggle = (id) => set("perms", (f.perms || []).includes(id) ? f.perms.filter((x) => x !== id) : [...(f.perms || []), id]);
  const ready = f.name.trim() && (f.email.trim() || f.phone.trim());
  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 16px" }}>{f.isNew ? "Invite to the portal" : f.name}</h1>
        <span className="lab">Name</span>
        <input className="field" value={f.name} onChange={(e) => set("name", e.target.value)} />
        <span className="lab">{dealer ? "Their job at the dealership" : "Relationship"}</span>
        <input className="field" placeholder={dealer ? "Service manager" : "Owner"} value={f.title} onChange={(e) => set("title", e.target.value)} />
        <span className="lab">Email</span>
        <input className="field" type="email" autoCapitalize="none" value={f.email} onChange={(e) => set("email", e.target.value)} />
        <span className="lab">Mobile</span>
        <input className="field" inputMode="tel" value={f.phone} onChange={(e) => set("phone", e.target.value)} />

        <span className="lab">What they can do</span>
        <div className="card">
          {PORTAL_PERMS.map((perm) => {
            const on = (f.perms || []).includes(perm.id);
            return (
              <button className="line" key={perm.id} style={{ width: "100%", textAlign: "left" }} onClick={() => toggle(perm.id)}>
                <span style={{ flex: 1 }}>{perm.label}</span>
                <span className="chip" data-t={on ? "ok" : ""}>{on ? "Yes" : "No"}</span>
              </button>
            );
          })}
        </div>

        {f.portal !== "none" && (
          <p className="sub" style={{ marginBottom: 12 }}>
            {f.portal === "active" ? `Signed in. Last seen ${f.lastSeen || "recently"}.` : `Invited ${f.invitedAt || "recently"}, hasn't set a password yet.`}
          </p>
        )}

        <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <button className="btn sm" disabled={!ready || !f.phone.trim()} onClick={() => onInvite({ ...f, isNew: undefined }, "text")}>
            {f.portal === "none" ? "Text the invite" : "Text again"}
          </button>
          <button className="btn sm" disabled={!ready || !f.email.trim()} onClick={() => onInvite({ ...f, isNew: undefined }, "email")}>
            {f.portal === "none" ? "Email the invite" : "Email again"}
          </button>
        </div>
        <button className="btn" data-v="quiet" disabled={!ready} onClick={() => onSave({ ...f, isNew: undefined })}>Save without inviting</button>
        {!f.isNew && <button className="btn" data-v="danger" style={{ marginTop: 8 }} onClick={onRemove}>Remove their access</button>}
        <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

function PortalPreview({ c, info, jobs, taxPct, onClose }) {
  const active = (c.people || []).filter((p) => p.portal === "active");
  const can = (id) => active.some((p) => (p.perms || []).includes(id));
  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <div className="row" style={{ marginBottom: 4 }}>
          <h1 style={{ fontSize: 22, margin: 0 }}>{c.name}</h1>
          <button onClick={onClose} style={{ fontSize: 22, color: "var(--muted)", padding: "0 4px" }}>×</button>
        </div>
        <p className="sub" style={{ marginBottom: 16 }}>
          Read-only preview of the portal, in your shop's colours. {active.length} {active.length === 1 ? "person" : "people"} can sign in.
        </p>

        {jobs.length === 0 && (
          <div className="card" style={{ textAlign: "center", padding: 30, color: "var(--muted)" }}>
            Nothing of theirs is in the shop right now.
          </div>
        )}
        {jobs.map((j) => (
          <div className="card" key={j.id}>
            <div className="row" style={{ marginBottom: 10 }}>
              <div style={{ display: "flex", gap: 10, alignItems: "center", minWidth: 0 }}>
                <span className="swatch" style={{ background: j.v.color }} />
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 15 }}>{j.v.year} {j.v.make} {j.v.model}</div>
                  <div style={{ fontSize: 12.5, color: "var(--muted)" }}>{j.ro} · due {j.promised}</div>
                </div>
              </div>
              {can("pay") && <span className="money" style={{ fontSize: 17 }}>{usd(totalOf(j.est, taxPct))}</span>}
            </div>
            <Strip job={j} />
            <div className="row" style={{ marginTop: 9, fontSize: 12.5, color: "var(--muted)" }}>
              <span>{j.hold ? "On hold" : stageNow(j).label}</span>
              <span>{j.photos.length} photos</span>
            </div>
            {can("approve") && j.est.status === "sent" && (
              <button className="btn sm" data-v="tape" style={{ marginTop: 12 }} disabled>Approve {usd2(totalOf(j.est, taxPct))}</button>
            )}
            {can("pay") && j.est.status === "approved" && j.inv.status !== "paid" && (
              <button className="btn sm" style={{ marginTop: 12 }} disabled>Pay {usd2(totalOf(j.est, taxPct))}</button>
            )}
          </div>
        ))}

        <div className="head">What this login allows</div>
        <div className="card">
          {PORTAL_PERMS.map((perm) => (
            <div className="line" key={perm.id}>
              <span style={{ flex: 1 }}>{perm.label}</span>
              <span className="chip" data-t={can(perm.id) ? "ok" : ""}>{can(perm.id) ? "Yes" : "No"}</span>
            </div>
          ))}
        </div>
        <button className="btn" data-v="quiet" onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

function StaffSheet({ s, onSave, onClose }) {
  const [f, setF] = useState(s);
  const set = (k, v) => setF({ ...f, [k]: v });
  const owner = f.role === "owner";
  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 16px" }}>{f.isNew ? "Invite a technician" : f.name}</h1>
        <span className="lab">Full name</span>
        <input className="field" value={f.name} onChange={(e) => set("name", e.target.value)} />
        <span className="lab">Email</span>
        <input className="field" type="email" autoCapitalize="none" value={f.email} onChange={(e) => set("email", e.target.value)} />
        <span className="lab">Job title</span>
        <input className="field" placeholder="Painter" value={f.title} onChange={(e) => set("title", e.target.value)} />
        {!owner && (
          <>
            <span className="lab">How they get paid</span>
            <div className="seg">
              {PAY_TYPES.map((p) => <button key={p.id} data-on={f.payType === p.id ? "1" : "0"} onClick={() => set("payType", p.id)}>{p.label}</button>)}
            </div>
            {f.payType === "hourly" && (<><span className="lab">Their rate per hour</span>
              <input className="field" inputMode="decimal" value={f.hourlyRate} onChange={(e) => set("hourlyRate", +e.target.value.replace(/[^\d.]/g, "") || 0)} />
              <p className="sub" style={{ margin: "-2px 0 12px" }}>Paid on hours booked to them, at their own rate rather than what you bill.</p></>)}
            {f.payType === "percent" && (<><span className="lab">Their share of the labor they book</span>
              <input className="field" inputMode="decimal" value={f.percent} onChange={(e) => set("percent", +e.target.value.replace(/[^\d.]/g, "") || 0)} />
              <p className="sub" style={{ margin: "-2px 0 12px" }}>Commission on billed labor. A 50% tech on 9 hours at $68 earns $306.</p></>)}
            {f.payType === "flat" && (<><span className="lab">Default amount per job</span>
              <input className="field" inputMode="decimal" value={f.flat} onChange={(e) => set("flat", +e.target.value.replace(/[^\d.]/g, "") || 0)} />
              <p className="sub" style={{ margin: "-2px 0 12px" }}>A lump sum per job, overridable on any individual job from the crew screen.</p></>)}
            <span className="lab">Deposit account</span>
            <div className="row" style={{ padding: "2px 0 14px" }}>
              <span style={{ fontSize: 14 }}>{f.bank || "Not set up yet"}</span>
              {f.payout === "active" ? <span className="chip" data-t="ok">Verified</span>
                : <button className="chip" data-t="bad" onClick={() => setF({ ...f, payout: "active", bank: "Truist ••7731" })}>Complete setup</button>}
            </div>
          </>
        )}
        <button className="btn" disabled={!f.name.trim() || !f.email.trim()}
          onClick={() => onSave({ ...f, isNew: undefined, init: f.name.trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase() })}>
          {f.isNew ? "Send invite" : "Save"}
        </button>
        {f.isNew && <p className="sub" style={{ marginTop: 8 }}>You'll get a link to send them. They pick their own password when they open it.</p>}
        <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={onClose}>Cancel</button>
      </div>
    </div>
  );

function TicketSheet({ t, jobs, me, shop, theme, mode, onSubmit, onClose }) {
  const [f, setF] = useState(t);
  const set = (k, v) => setF({ ...f, [k]: v });
  const j = jobs.find((x) => x.id === f.jobId);
  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 6px" }}>Contact support</h1>
        <p className="sub" style={{ marginBottom: 16 }}>No phone queue. You'll get an email reply, usually within one business day.</p>

        <span className="lab">What's going on</span>
        <select className="field" value={f.cat} onChange={(e) => set("cat", e.target.value)}>
          {TICKET_CATS.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>

        <span className="lab">One-line summary</span>
        <input className="field" placeholder="Estimate total is off by the tax amount" value={f.subject} onChange={(e) => set("subject", e.target.value)} />

        <span className="lab">What happened, and what you expected</span>
        <textarea className="field" rows={5} placeholder="Walk us through it step by step. The more detail the fewer round trips."
          value={f.body} onChange={(e) => set("body", e.target.value)} />

        <span className="lab">Attach a vehicle (optional)</span>
        <select className="field" value={f.jobId} onChange={(e) => set("jobId", e.target.value)}>
          <option value="">Not about a specific vehicle</option>
          {jobs.map((x) => <option key={x.id} value={x.id}>{x.ro} · {x.v.year} {x.v.make} {x.v.model}</option>)}
        </select>

        <div className="card">
          <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 8 }}>Sent with your ticket</div>
          {[
            ["Shop", `${shop.info.name}${shop.info.city ? ` · ${shop.info.city}` : ""}`],
            ["Account", `${me.name} · ${me.email} · ${me.role}`],
            ["Plan", `${shop.sub.status === "intro" ? "Intro" : "Standard"} · month ${shop.sub.used}`],
            ["Theme", `${theme.code} ${theme.name} · ${mode}`],
            ["Vehicle", j ? `${j.ro} · ${j.v.year} ${j.v.make} ${j.v.model} · VIN ${j.v.vin}` : "None"],
            ["Data", `${shop.jobs.length} jobs · ${shop.contacts.length} clients · ${shop.staff.length} on the team`],
          ].map(([k, v]) => (
            <div key={k} className="line" style={{ padding: "6px 0", fontSize: 13 }}>
              <span style={{ color: "var(--muted)", width: 62, flex: "none" }}>{k}</span>
              <span style={{ wordBreak: "break-word" }}>{v}</span>
            </div>
          ))}
        </div>

        <button className="btn" disabled={!f.subject.trim() || !f.body.trim()} onClick={() => onSubmit(f)}>Send to support</button>
        <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

function InviteSheet({ i, shopName, toast, onClose }) {
  const body = `${i.name.split(" ")[0]}, you're set up on ${shopName}'s job system. Open this to pick a password: ${i.url}`;
  const copy = async () => {
    try { await navigator.clipboard.writeText(i.url); toast("Link copied"); }
    catch { toast("Couldn't copy — select the link and copy it by hand"); }
  };
  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 6px" }}>Send {i.name.split(" ")[0]} their link</h1>
        <p className="sub" style={{ marginBottom: 16 }}>
          One use, tied to {i.email}. They open it, pick a password, and land straight in your shop.
        </p>
        <div className="card" style={{ fontFamily: "ui-monospace, monospace", fontSize: 11.5, wordBreak: "break-all", lineHeight: 1.6 }}>
          {i.url}
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <button className="btn sm" onClick={() => { window.location.href = `sms:?body=${encodeURIComponent(body)}`; }}>Text it</button>
          <button className="btn sm" onClick={() => { window.location.href = `mailto:${i.email}?subject=${encodeURIComponent(`Your ${shopName} login`)}&body=${encodeURIComponent(body)}`; }}>Email it</button>
        </div>
        <button className="btn" data-v="quiet" onClick={copy}>Copy the link</button>
        <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={onClose}>Done</button>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<ColorCodePro />);
</script>
</body>
</html>
