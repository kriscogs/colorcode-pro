<script>
// Shows any startup error on screen, so you don't need a console to read it.
(function () {
  function show(kind, text) {
    var el = document.getElementById('boot');
    if (!el) return;
    el.style.textAlign = 'left';
    el.innerHTML =
      '<div style="font:600 15px system-ui;color:#B4352C;margin-bottom:8px">' + kind + '</div>' +
      '<pre style="white-space:pre-wrap;word-break:break-word;font:12px ui-monospace,monospace;' +
      'color:#14202B;background:#fff;border:1px solid #DCDCD5;border-radius:8px;padding:12px;margin:0">' +
      String(text).replace(/[&<>]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
      }) + '</pre>';
  }
  window.addEventListener('error', function (e) {
    show('Startup error', (e.message || e.error || 'unknown') +
      (e.filename ? '\n' + e.filename + ' line ' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    show('Startup error', (e.reason && (e.reason.message || e.reason)) || 'unknown');
  });
  var ce = console.error;
  console.error = function () {
    var msg = Array.prototype.map.call(arguments, function (a) {
      return a && a.message ? a.message : String(a);
    }).join(' ');
    if (/SyntaxError|Unexpected|Parse|transform/i.test(msg)) show('Could not compile the page', msg);
    ce.apply(console, arguments);
  };
})();
</script>

function themeVars(id, mode) {
  const t = THEMES[id] || THEMES.gaz;
  const dark = mode === "dark";
  const base = dark ? t.dark : t.light;
  const sem = dark ? MODE_DARK : MODE_LIGHT;
  const v = {
    ...base, ...sem,
    accent: dark ? t.accentDark : t.accent,
    onAccent: dark ? t.onAccentDark : t.onAccent,
    paint: t.paint,
  };
  return Object.fromEntries(Object.entries(v).map(([k, val]) => [`--${k}`, val]));
}

  "1HG": "Honda", "2HG": "Honda", "5J6": "Honda", "SHH": "Honda", "JHM": "Honda", "5FN": "Honda", "19U": "Acura",

  "KMH": "Hyundai", "5NP": "Hyundai", "KM8": "Hyundai", "KNA": "Kia", "KND": "Kia", "5XY": "Kia", "3KP": "Kia",
  "WBA": "BMW", "WBS": "BMW", "5UX": "BMW", "4US": "BMW", "WDD": "Mercedes-Benz", "WDC": "Mercedes-Benz",
  "4JG": "Mercedes-Benz", "W1K": "Mercedes-Benz", "W1N": "Mercedes-Benz", "WAU": "Audi", "WA1": "Audi", "TRU": "Audi",
  "3VW": "Volkswagen", "1VW": "Volkswagen", "WVW": "Volkswagen", "WVG": "Volkswagen",
  "JM1": "Mazda", "JM3": "Mazda", "3MZ": "Mazda", "4F2": "Mazda", "JF1": "Subaru", "JF2": "Subaru", "4S3": "Subaru", "4S4": "Subaru",
  "5YJ": "Tesla", "7SA": "Tesla", "7G2": "Tesla", "1GT": "GMC", "3GT": "GMC", "1G6": "Cadillac", "1GY": "Cadillac",
  "ML3": "Mitsubishi", "JA4": "Mitsubishi", "SAL": "Land Rover", "SAJ": "Jaguar", "YV1": "Volvo", "LYV": "Volvo", "WP0": "Porsche", "WP1": "Porsche",
};
function vinCheck(vin) {
  if (!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) return false;
  let sum = 0;
  for (let i = 0; i < 17; i++) {
    const c = vin[i], val = /\d/.test(c) ? +c : VIN_TRANS[c];
    if (val === undefined) return false;
    sum += val * VIN_WEIGHTS[i];
  }
  const rem = sum % 11;
  return vin[8] === (rem === 10 ? "X" : String(rem));
}
function decodeOffline(raw) {
  const vin = raw.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, "");
  if (vin.length !== 17) return { ok: false, why: `A VIN is 17 characters. That one has ${vin.length}.` };
  if (!vinCheck(vin)) return { ok: false, why: "That VIN fails its check digit. Look for a mistyped character." };
  const i = YEAR_CODES.indexOf(vin[9]);
  return { ok: true, vin, make: WMI[vin.slice(0, 3)] || "", year: i === -1 ? "" : String((/[A-Z]/.test(vin[6]) ? 2010 : 1980) + i) };
}
async function decodeOnline(vin) {
  const r = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${vin}?format=json`);
  if (!r.ok) throw new Error("lookup failed");
  const d = (await r.json())?.Results?.[0];
  if (!d) throw new Error("no result");
  const cap = (s) => (s || "").replace(/\b\w/g, (c) => c.toUpperCase());
  const model = [d.Model, d.Series && d.Series !== d.Model ? d.Series : ""].filter(Boolean).join(" ").trim();
  return {
    make: cap(d.Make), model, year: d.ModelYear || "",
    trim: [d.Trim, d.Trim2].filter(Boolean).join(" ") || d.Series2 || "",
    body: d.BodyClass || "",
    drive: d.DriveType || "",
    engine: [
      d.DisplacementL ? `${(+d.DisplacementL).toFixed(1)}L` : "",
      d.EngineCylinders ? `${d.EngineCylinders}-cyl` : "",
      d.FuelTypePrimary && !/gasoline/i.test(d.FuelTypePrimary) ? d.FuelTypePrimary : "",
    ].filter(Boolean).join(" "),
  };
}

  if (error) throw new Error(error.message);
  return data || null;

  const { data, error } = await sb.from("app_state").select("value").eq("shop_id", shopId).maybeSingle();
  if (error) throw new Error(error.message);
  return data?.value ? JSON.parse(data.value) : null;
}

  const { error } = await sb.from("app_state")
    .upsert({ shop_id: shopId, value: JSON.stringify(blob), updated_at: new Date().toISOString() });
  if (error) throw new Error(error.message);
}

    payType: "percent", percent: 0, hourlyRate: 0, flat: 0, mode: null,
  }],
  contacts: [], jobs: [], notifs: [], tickets: [],
});

/* Fills an empty shop with the sample jobs so there's something to look at. */
function withSampleData(shop) {
  const d = demoShop();
  const extras = d.staff.filter((x) => x.role !== "owner").map((x) => ({ ...x, pass: undefined, demo: true }));
  const owner = shop.staff.find((x) => x.role === "owner") || shop.staff[0];
  const remap = { e1: owner?.id };
  const staff = [...shop.staff, ...extras.filter((x) => !shop.staff.some((y) => y.email === x.email))];
  const fix = (id) => remap[id] || id;
  return {
    ...shop,
    staff,
    contacts: d.contacts,
    jobs: d.jobs.map((j) => ({
      ...j,
      crew: j.crew.map(fix),
      est: { ...j.est, lines: j.est.lines.map((l) => ({ ...l, who: l.who ? fix(l.who) : null })) },
    })),
    notifs: [], tickets: shop.tickets || [],
  };
}

const usd = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const usd2 = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 });
const subtotal = (est) => est.lines.reduce((a, l) => a + (+l.q || 0) * (+l.r || 0), 0);
const totalOf = (est, taxPct) => subtotal(est) * (1 + taxPct / 100);
const unit = (t) => LINE_TYPES.find((x) => x.id === t)?.unit || "ea";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const received = (job) => (job.receipts || []).reduce((a, r) => a + (+r.amount || 0), 0);
const balanceOf = (job, taxPct) => Math.max(0, totalOf(job.est, taxPct) - received(job));

/** Who owes what. Insurance jobs split between the carrier and the deductible. */
function payerSplit(job, client, taxPct) {
  const total = totalOf(job.est, taxPct);
  const p = job.payer || "customer";
  if (p === "insurance") {
    const ded = Math.min(+job.claim?.deductible || 0, total);
    return [
      { from: "insurance", label: job.claim?.insurer || "Insurance carrier", amount: total - ded },
      { from: "customer", label: "Customer deductible", amount: ded },
    ].filter((r) => r.amount > 0.004);
  }
  if (p === "warranty") return [{ from: "warranty", label: job.warranty?.maker || `${job.v.make} warranty`, amount: total }];
  if (p === "dealer") return [{ from: "dealer", label: client?.name || "Dealership", amount: total }];
  return [{ from: "customer", label: client?.name || "Customer", amount: total }];
}

/** The single most useful next action on a job, or null when nothing is waiting.
 *  Never blocks anything — it only points. */
function nextStep(job, me, info, client) {
  const owner = me.role === "owner";
  const kind = typeOf(job).id;
  const lines = job.est?.lines || [];
  const parts = lines.filter((l) => l.t === "part");
  const photos = job.photos || [];
  const step = sIdx(job);
  const upcoming = stagesOf(job)[step + 1];
  const owing = balanceOf(job, info.tax);
  const who = (client?.contact || "the client").split(" ")[0];

  if (!owner) {
    if (photos.length === 0)
      return { pri: 2, group: "Photos to take", tab: "photos", cta: "Open the camera", title: "Shoot it before you touch it",
               why: "A before photo settles arguments with insurers and dealers later. Thirty seconds now." };
    if (kind === "mechanical" && step >= 1 && !job.ccc?.cause)
      return { pri: 3, group: "Write-ups to finish", tab: "work", cta: "Write it up", title: "Note what you found",
               why: "Cause and correction have to be on the invoice or a warranty claim gets kicked back." };
    if (kind === "maintenance" && (job.service?.items || []).length && (job.service.items).some((i) => !i.done))
      return { pri: 3, group: "Checklists to finish", tab: "work", cta: "Tick them off", title: "Finish the checklist",
               why: "Completed items print on the invoice, so the customer sees what they paid for." };
    if (job.hold)
      return { pri: 6, group: "Waiting on parts", tab: "parts", cta: "See why", title: "This one's on hold",
               why: "Work is paused until a part lands. Nothing to do here yet." };
    if (upcoming)
      return { pri: 4, group: "Ready to move on", tab: "work", cta: `Move to ${upcoming.label}`, title: `Done with ${stageNow(job).label}?`,
               why: "Moving it on notifies the office and the client automatically." };
    return null;
  }

  if (!job.clientId)
    return { pri: 1, group: "Needs attention", tab: "work", cta: "Pick a client", title: "No client on this job", why: "Nothing can be billed until there's someone to bill." };
  if (job.fromClient && step === 0)
    return { pri: 1, group: "New requests", tab: "work", cta: "Look it over", title: `${client?.name || "A client"} sent this in`,
             why: "Check the details, put someone on it, and write the estimate." };
  if (job.crew.length === 0)
    return { pri: 2, group: "Nobody assigned", tab: "work", cta: "Assign the crew", title: "Nobody's on this yet",
             why: "Techs only see jobs they're assigned, and pay is worked out from who books the hours." };
  if (!(job.requested || []).length && !job.notes.length)
    return { pri: 2, group: "Missing details", tab: "work", cta: "Tag what it's in for", title: "Nothing says why it's here",
             why: "Tap the services so whoever writes the estimate isn't guessing." };
  if (lines.length === 0)
    return { pri: 3, group: "Estimates to write", tab: "money", cta: "Start the estimate", title: "Nothing priced yet",
             why: "Add labor, parts and materials. Rates come from your settings." };
  if (job.est.status === "draft")
    return { pri: 3, group: "Estimates to send", tab: "money", cta: "Send it", title: `Estimate is ready for ${who}`,
             why: "Send it as a document by text or email and they can approve it from their phone." };
  if (job.est.status === "sent")
    return { pri: 5, group: "Waiting on approval", tab: "msgs", cta: `Nudge ${who}`, title: `Waiting on ${who} to approve`,
             why: "Nothing should be ordered or started until this comes back." };
  if (parts.some((l) => (l.ps || "needed") === "needed"))
    return { pri: 2, group: "Parts to order", tab: "parts", cta: "Mark them ordered", title: "Parts still to order",
             why: "Approved and priced, so nothing's stopping the order going in." };
  if (job.hold)
    return { pri: 6, group: "Waiting on parts", tab: "parts", cta: "Check the parts", title: "On hold",
             why: "Something's backordered. The client has been told." };
  if (upcoming)
    return { pri: 4, group: "Ready to move on", tab: "work", cta: `Move to ${upcoming.label}`, title: `Sitting in ${stageNow(job).label}`,
             why: "Every move updates the client without you writing anything." };
  if (owing > 0.004)
    return { pri: 1, group: "Money to collect", tab: "money", cta: "Collect", title: `${usd2(owing)} still outstanding`,
             why: "It's finished. Send the invoice or record what's come in." };
  return null;
}

function payouts(job, staff, info) {
  const gross = totalOf(job.est, info.tax);
  const fee = gross * 0.029 + 0.3;
  const rows = job.crew.map((id) => {
    const s = staff.find((x) => x.id === id);
    if (!s) return null;
    const mine = job.est.lines.filter((l) => l.who === id);
    const hours = mine.reduce((a, l) => a + (+l.q || 0), 0);
    const billed = mine.reduce((a, l) => a + (+l.q || 0) * (+l.r || 0), 0);
    let amt = 0, basis = "";
    if (s.payType === "hourly") { amt = hours * (s.hourlyRate || 0); basis = `${hours} hrs × ${usd2(s.hourlyRate || 0)}`; }
    else if (s.payType === "percent") { amt = billed * (s.percent || 0) / 100; basis = `${s.percent}% of ${usd2(billed)} labor`; }
    else { amt = job.flatPay?.[id] ?? s.flat ?? 0; basis = "Flat for this job"; }
    return { id, s, amt, basis, hours, billed };
  }).filter(Boolean).filter((r) => r.amt > 0 || r.hours > 0);
  const crewTotal = rows.reduce((a, r) => a + r.amt, 0);
  return { gross, fee, rows, crewTotal, shop: gross - fee - crewTotal };
}

/** Build a notification aimed at the owner plus everyone on the job's crew. */
function buildNotif(shop, job, { kind, title, body, actorId, toClient }) {
  const to = shop.staff
    .filter((s) => s.role === "owner" || job.crew.includes(s.id))
    .map((s) => s.id)
    .filter((id) => id !== actorId);
  return { id: uid(), jobId: job.id, kind, title, body, at: now(), to, read: [], toClient: !!toClient };
}

/** What this shop has actually booked for a job like this before.
 *  Licensed guides sell a national average; this is your own history,
 *  which for your building and your people is usually closer. */
function laborBook(shop, desc, make, model) {
  const key = (t) => t.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter((w) => w.length > 2);
  const want = key(desc || "");
  if (want.length < 2) return null;

  const hits = [];
  shop.jobs.forEach((j) => {
    (j.est?.lines || []).forEach((l) => {
      if (!["labor", "paint", "mech", "diag"].includes(l.t) || !(+l.q > 0)) return;
      const words = key(l.d);
      const overlap = want.filter((w) => words.includes(w)).length;
      if (overlap < Math.min(2, want.length)) return;
      hits.push({
        hours: +l.q,
        score: overlap / want.length
          + (j.v.make === make ? 0.5 : 0)
          + (j.v.model === model ? 0.5 : 0),
        same: j.v.make === make && j.v.model === model,
        vehicle: `${j.v.year} ${j.v.make} ${j.v.model}`.trim(),
      });
    });
  });
  if (!hits.length) return null;

  hits.sort((a, b) => b.score - a.score);
  const best = hits.slice(0, 6);
  const exact = best.filter((h) => h.same);
  const use = exact.length ? exact : best;
  const avg = use.reduce((a, h) => a + h.hours, 0) / use.length;
  const lo = Math.min(...use.map((h) => h.hours));
  const hi = Math.max(...use.map((h) => h.hours));

  return {
    hours: Math.round(avg * 10) / 10,
    times: use.length,
    spread: lo === hi ? null : `${lo} – ${hi}`,
    sameVehicle: exact.length > 0,
    example: use[0].vehicle,
  };
}

/** Paint codes this shop has already recorded for a make — the shop's own code book. */
function codeBook(shop, make) {
  const seen = new Set();
  shop.jobs.forEach((j) => {
    const p = (j.v.paint || "").trim();
    if (!p || /^not recorded/i.test(p)) return;
    if (!make || j.v.make === make) seen.add(p);
  });
  return [...seen].sort();
}

/** Same as shrink, but hands back a Blob ready to upload. */
async function shrinkToBlob(file, max, quality) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = rej; i.src = url;
  });
  const scale = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return new Promise((res) => c.toBlob((b) => res(b), "image/jpeg", quality));
}

/** Photos live in private storage, so each one needs a short-lived signed link. */
function usePhotoUrls(photos) {
  const [urls, setUrls] = useState({});
  const key = photos.map((p) => p.id).join(",");
  useEffect(() => {
    const need = photos.filter((p) => p.path && !urls[p.id]);
    if (!need.length || !sb) return;
    let dead = false;
    (async () => {
      const { data, error } = await sb.storage.from("job-photos")
        .createSignedUrls(need.map((p) => p.path), 3600);
      if (error || dead || !data) return;
      const next = {};
      data.forEach((d, i) => { if (d?.signedUrl) next[need[i].id] = d.signedUrl; });
      setUrls((u) => ({ ...u, ...next }));
    })();
    return () => { dead = true; };
  }, [key]);
  return urls;
}

async function shrink(file, max, quality) {
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file);
  });
  const scale = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return c.toDataURL("image/jpeg", quality);
}

function docText(job, client, info, kind) {
  const sub = subtotal(job.est), tot = sub * (1 + info.tax / 100);

    `${info.name} — ${kind === "invoice" ? "Invoice" : "Estimate"} ${job.ro}`,
    `${job.v.year} ${job.v.make} ${job.v.model} · plate ${job.v.plate}`, "",

    `Subtotal ${usd2(sub)}`, `Tax ${info.tax}% ${usd2(sub * info.tax / 100)}`,
    `${kind === "invoice" ? "Amount due" : "Estimated total"} ${usd2(tot)}`, "", `Questions: ${info.phone}`,
  ].join("\n");
}

function DocSheet({ job, client, info, kind, onClose, onSent, toast }) {
  const html = docHTML(job, client, info, kind);
  const text = docText(job, client, info, kind);
  const label = kind === "invoice" ? "Invoice" : "Estimate";

  const download = () => {
    const docCSS = CSS.split(".bs .doc {")[1] ? ".bs .doc {" + CSS.split(".bs .doc {")[1].split("@media print")[0] : "";
    const page = `<!doctype html><meta charset="utf-8"><title>${label} ${job.ro}</title>
<style>body{font-family:Barlow,system-ui,sans-serif;margin:0;padding:32px;background:#fff}${docCSS}</style>
<div class="bs">${html}</div>`;
    const url = URL.createObjectURL(new Blob([page], { type: "text/html" }));
    const a = document.createElement("a");
    a.href = url; a.download = `${info.name.replace(/\W+/g, "-")}-${job.ro}-${kind}.html`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Downloaded");
  };
  const sms = () => {
    const body = encodeURIComponent(text);
    window.location.href = `sms:${(client?.phone || "").replace(/\D/g, "")}${/iPhone|iPad|Mac/.test(navigator.userAgent) ? "&" : "?"}body=${body}`;
    onSent?.("text");
  };
  const email = () => {
    window.location.href = `mailto:${client?.email || ""}?subject=${encodeURIComponent(`${label} ${job.ro} — ${info.name}`)}&body=${encodeURIComponent(text)}`;
    onSent?.("email");
  };
  const share = async () => {
    try {
      if (navigator.share) { await navigator.share({ title: `${label} ${job.ro}`, text }); onSent?.("share"); }
      else { await navigator.clipboard.writeText(text); toast("Copied to the clipboard"); }
    } catch {}
  };

  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <div className="noprint" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h1 style={{ fontSize: 22, margin: 0 }}>{label} {job.ro}</h1>
          <button onClick={onClose} style={{ fontSize: 22, color: "var(--muted)", padding: "0 4px" }}>×</button>
        </div>
        <div dangerouslySetInnerHTML={{ __html: html }} />
        <div className="noprint" style={{ marginTop: 16 }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <button className="btn sm" onClick={sms}>Text it</button>
            <button className="btn sm" onClick={email}>Email it</button>
          </div>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <button className="btn sm" data-v="quiet" onClick={() => window.print()}>Print</button>
            <button className="btn sm" data-v="quiet" onClick={download}>Download</button>
            <button className="btn sm" data-v="quiet" onClick={share}>Share</button>
          </div>
          <button className="btn" data-v="quiet" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

const Strip = ({ job }) => {
  const cur = sIdx(job);
  return <div className="strip">{stagesOf(job).map((s, i) => <i key={s.id} data-s={i < cur ? "done" : i === cur ? (job.hold ? "hold" : "now") : "next"} />)}</div>;
};

const Wordmark = () => <div className="wordmark">Shop<em>floor</em><small>PROS</small></div>;

/** Photo if they have one, initials if they don't. */
function Avatar({ person, size = 30 }) {
  const px = { width: size, height: size, borderRadius: size / 2, fontSize: Math.round(size * 0.36) };
  return (
    <span className="avatar" style={px}>
      {person?.photo ? <img src={person.photo} alt="" /> : (person?.init || "??")}
    </span>
  );
}

function JobCard({ job, client, taxPct, unread, hint, onOpen }) {
  return (
    <button className="card" onClick={onOpen}>
      <div className="row" style={{ marginBottom: 10 }}>
        <div style={{ display: "flex", gap: 10, alignItems: "center", minWidth: 0 }}>
          <span className="swatch" style={{ background: job.v.color }} />
          <div style={{ minWidth: 0 }}>
            <div style={{ fontWeight: 600, fontSize: 15.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
              {job.v.year} {job.v.make} {job.v.model}
            </div>
            <div style={{ fontSize: 13, color: "var(--muted)", display: "flex", alignItems: "center", gap: 6 }}>
              {client?.name || "No client"}{unread ? <span className="dot" /> : null}
            </div>
          </div>
        </div>
        <span className="money" style={{ fontSize: 18 }}>{usd(totalOf(job.est, taxPct))}</span>
      </div>
      <Strip job={job} />
      {hint && (
        <div style={{ marginTop: 9, fontSize: 12.5, color: "var(--accent)", fontWeight: 500 }}>{hint}</div>
      )}
      <div className="row" style={{ marginTop: 9, fontSize: 12.5, color: "var(--muted)" }}>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
          <span className="chip" style={{ padding: "1px 7px", fontSize: 11 }}>{typeOf(job).short}</span>
          {(job.payer === "insurance" || job.payer === "warranty") && (
            <span className="chip" data-t="blue" style={{ padding: "1px 7px", fontSize: 11 }}>{payerOf(job).short}</span>
          )}
          {job.fromClient && job.stage === "intake" && (
            <span className="chip" data-t="warn" style={{ padding: "1px 7px", fontSize: 11 }}>New request</span>
          )}
          {job.hold ? <span className="chip" data-t="bad">On hold</span> : stageNow(job).label}
        </span>
        <span>Due {job.promised}</span>
      </div>
    </button>
  );
}

/* A password box with a show/hide eye, and an optional second box
   that has to match. Typos in a password you can't see are the
   commonest reason a new account never gets used. */
function PasswordField({ value, onChange, placeholder, confirm, onConfirm, onEnter, autoFocus }) {
  const [show, setShow] = useState(false);
  const mismatch = confirm !== undefined && confirm.length > 0 && confirm !== value;
  const matched = confirm !== undefined && confirm.length > 0 && confirm === value && value.length >= 8;

  const Eye = ({ on }) => (
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
      stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
      <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" />
      <circle cx="12" cy="12" r="2.8" />
      {!on && <line x1="4" y1="20" x2="20" y2="4" />}
    </svg>
  );

  return (
    <>
      <div className="pwwrap">
        <input className="field" type={show ? "text" : "password"} placeholder={placeholder || "Password"}
          autoComplete={confirm !== undefined ? "new-password" : "current-password"}
          autoFocus={autoFocus} value={value} onChange={(e) => onChange(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && onEnter && onEnter()} />
        <button type="button" className="pweye" onClick={() => setShow(!show)}
          aria-label={show ? "Hide password" : "Show password"} title={show ? "Hide" : "Show"}>
          <Eye on={show} />
        </button>
      </div>

      {confirm !== undefined && (
        <>
          <div className="pwwrap">
            <input className="field" type={show ? "text" : "password"} placeholder="Type it again"
              autoComplete="new-password" value={confirm} onChange={(e) => onConfirm(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && onEnter && onEnter()}
              data-bad={mismatch ? "1" : "0"} />
            {matched && <span className="pwtick">✓</span>}
          </div>
          {mismatch && <p className="pwmsg">Those two don't match yet.</p>}
        </>
      )}
    </>
  );
}

/* ── Reading an estimate out of CCC, Mitchell or Audatex.
      No deal with any of them is needed: the shop exports its own
      estimate as a BMS file and this reads it. Vendors phrase the
      same fields differently, so everything is matched loosely and
      shown for confirmation before anything is imported. ── */

const LABOR_WORDS = /body|refinish|paint|mech|frame|struct|glass|diag|detail|labor/i;

/** Index every element by lowercased tag, since XML is case-sensitive
 *  and the three vendors disagree on capitalisation. */
function indexXml(doc) {
  const map = {};
  doc.querySelectorAll("*").forEach((el) => {
    const k = el.tagName.replace(/^.*:/, "").toLowerCase();
    (map[k] = map[k] || []).push(el);
  });
  return map;
}
const firstText = (idx, names) => {
  for (const n of names) {
    const el = (idx[n] || [])[0];
    const t = el && el.textContent.trim();
    if (t) return t;
  }
  return "";
};
const num = (v) => { const n = parseFloat(String(v).replace(/[^0-9.\-]/g, "")); return isNaN(n) ? 0 : n; };

function parseEstimateFile(text, defaults) {
  const isXml = text.trim().startsWith("<");
  return isXml ? parseBMS(text, defaults) : parseEstimateCSV(text, defaults);
}

function parseBMS(text, defaults) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.querySelector("parsererror")) throw new Error("That file isn't readable XML.");
  const idx = indexXml(doc);

  const vehicle = {
    year:  firstText(idx, ["modelyear", "vehicleyear", "year"]),
    make:  firstText(idx, ["makedesc", "make", "manufacturer"]),
    model: firstText(idx, ["modelname", "model", "modeldesc"]),
    trim:  firstText(idx, ["trimcode", "subseries", "trim"]),
    vin:   firstText(idx, ["vinnum", "vin", "vehicleidentificationnumber"]).toUpperCase(),
    plate: firstText(idx, ["licenseplatenum", "plate", "licenseplate"]),
    miles: firstText(idx, ["odometerreading", "odometer", "mileage"]),
    paint: [firstText(idx, ["paintcode", "exteriorcolorcode", "colorcode"]),
            firstText(idx, ["exteriorcolordesc", "colordesc", "exteriorcolor"])]
             .filter(Boolean).join(" / "),
  };

  const claim = {
    insurer:    firstText(idx, ["insurancecompanyname", "companyname", "carriername", "insurancecompany"]),
    no:         firstText(idx, ["claimnum", "claimnumber"]),
    adjuster:   firstText(idx, ["adjustername", "adjuster", "estimatorname"]),
    deductible: num(firstText(idx, ["deductibleamt", "deductible", "deductibleamount"])),
  };

  // damage lines live under a few different parents depending on vendor
  const lineEls = [].concat(idx["damagelineinfo"] || [], idx["estimatelineinfo"] || [],
                            idx["lineitem"] || [], idx["damageline"] || []);
  const lines = [];
  lineEls.forEach((el) => {
    const sub = indexXml(el);
    const desc = firstText(sub, ["linedesc", "description", "lidescription", "partdesc", "operationdesc"]);
    if (!desc) return;

    const hours = num(firstText(sub, ["laborhours", "hours", "laborhrs"]));
    const op    = firstText(sub, ["labortype", "laboroperation", "laborcategory", "operation"]);
    const price = num(firstText(sub, ["partprice", "price", "unitprice", "partamt"]));
    const qty   = num(firstText(sub, ["partqty", "quantity", "qty"])) || 1;
    const partNo = firstText(sub, ["oempartnum", "partnum", "partnumber"]);

    if (hours > 0) {
      const t = /refinish|paint/i.test(op) ? "paint"
              : /mech/i.test(op) ? "mech" : "labor";
      lines.push({ t, d: desc, q: hours, r: null, op });
    } else if (price > 0) {
      lines.push({ t: "part", d: partNo ? `${desc} (${partNo})` : desc, q: qty, r: price, op });
    } else if (LABOR_WORDS.test(op || desc)) {
      lines.push({ t: "labor", d: desc, q: 0, r: null, op });
    }
  });

  return { vehicle, claim, lines, source: firstText(idx, ["applicationname", "softwarename"]) || "BMS file" };
}

/** Fallback for shops that can only export a spreadsheet. */
function parseEstimateCSV(text, defaults) {
  const rows = text.split(/\r?\n/).filter((r) => r.trim()).map((r) => {
    const out = []; let cur = "", q = false;
    for (const ch of r) {
      if (ch === '"') q = !q;
      else if (ch === "," && !q) { out.push(cur); cur = ""; }
      else cur += ch;
    }
    out.push(cur);
    return out.map((c) => c.trim().replace(/^"|"$/g, ""));
  });
  if (rows.length < 2) throw new Error("That file has no rows in it.");

  const head = rows[0].map((h) => h.toLowerCase());
  const col = (...names) => head.findIndex((h) => names.some((n) => h.includes(n)));
  const cDesc = col("desc", "operation", "item");
  const cHours = col("hour", "hrs", "labor time");
  const cPrice = col("price", "amount", "cost");
  const cQty = col("qty", "quantity");
  const cType = col("type", "category", "oper");
  if (cDesc === -1) throw new Error("No description column found. Expected a header row.");

  const lines = [];
  rows.slice(1).forEach((r) => {
    const d = r[cDesc];
    if (!d) return;
    const hours = cHours > -1 ? num(r[cHours]) : 0;
    const price = cPrice > -1 ? num(r[cPrice]) : 0;
    const op = cType > -1 ? r[cType] : "";
    if (hours > 0) {
      lines.push({ t: /refinish|paint/i.test(op) ? "paint" : /mech/i.test(op) ? "mech" : "labor",
                   d, q: hours, r: null, op });
    } else if (price > 0) {
      lines.push({ t: "part", d, q: (cQty > -1 ? num(r[cQty]) : 0) || 1, r: price, op });
    }
  });
  return { vehicle: {}, claim: {}, lines, source: "Spreadsheet" };
}

/** Reads an exported estimate and shows what it found before importing. */
function ImportSheet({ job, info, integrations, onApply, onClose, toast }) {
  const fileRef = useRef(null);
  const [found, setFound] = useState(null);
  const [err, setErr] = useState("");
  const rate = job.payer === "warranty"
    ? (job.warranty?.rate || info.warrantyRate)
    : (info.bodyRate || 68);

  const read = async (e) => {
    const f = e.target.files?.[0];
    e.target.value = "";
    if (!f) return;
    setErr("");
    try {
      const parsed = parseEstimateFile(await f.text(), {});
      if (!parsed.lines.length) throw new Error("No estimate lines found in that file.");
      setFound(parsed);
    } catch (x) { setErr(x.message); }
  };

  const apply = () => {
    const priced = found.lines.map((l) => ({
      id: uid(), t: l.t, d: l.d,
      q: l.q || 1,
      r: l.r != null ? l.r : (l.t === "paint" ? (info.paintRate || rate) : rate),
      who: null,
      ps: l.t === "part" ? "needed" : undefined,
    }));
    onApply(found, priced);
  };

  const hrs = (found?.lines || []).filter((l) => l.r == null).reduce((a, l) => a + l.q, 0);
  const parts = (found?.lines || []).filter((l) => l.t === "part");

  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 6px" }}>Bring in an estimate</h1>
        <p className="sub" style={{ marginBottom: 16 }}>
          Export the estimate from {integrations?.ems_source || "CCC, Mitchell or Audatex"} as a BMS file,
          then pick it here. A spreadsheet export works too.
        </p>

        <input ref={fileRef} type="file" accept=".xml,.bms,.csv,.txt,text/xml,text/csv"
          onChange={read} style={{ display: "none" }} />
        <button className="btn" data-v={found ? "quiet" : "tape"} onClick={() => fileRef.current?.click()}>
          {found ? "Pick a different file" : "Choose the file"}
        </button>
        {err && <p style={{ color: "var(--flag)", fontSize: 13.5, marginTop: 8 }}>{err}</p>}

        {found && (
          <>
            <div className="head">What's in it</div>
            <div className="card">
              {found.vehicle?.vin && (
                <div className="line"><span style={{ color: "var(--muted)", width: 88 }}>Vehicle</span>
                  <span>{[found.vehicle.year, found.vehicle.make, found.vehicle.model].filter(Boolean).join(" ")}</span></div>
              )}
              {found.vehicle?.vin && (
                <div className="line"><span style={{ color: "var(--muted)", width: 88 }}>VIN</span>
                  <span style={{ wordBreak: "break-all" }}>{found.vehicle.vin}</span></div>
              )}
              {found.vehicle?.paint && (
                <div className="line"><span style={{ color: "var(--muted)", width: 88 }}>Paint</span><span>{found.vehicle.paint}</span></div>
              )}
              {found.claim?.insurer && (
                <div className="line"><span style={{ color: "var(--muted)", width: 88 }}>Claim</span>
                  <span>{found.claim.insurer} {found.claim.no}</span></div>
              )}
              <div className="line"><span style={{ color: "var(--muted)", width: 88 }}>Lines</span>
                <span>{found.lines.length} · {hrs.toFixed(1)} hrs · {parts.length} parts</span></div>
            </div>

            <div className="card">
              {found.lines.slice(0, 8).map((l, i) => (
                <div className="line" key={i} style={{ fontSize: 13 }}>
                  <span style={{ flex: 1, minWidth: 0 }}>{l.d}</span>
                  <span className="money">{l.r != null ? usd2(l.r) : `${l.q} hrs`}</span>
                </div>
              ))}
              {found.lines.length > 8 && (
                <p className="sub" style={{ margin: "8px 0 0" }}>and {found.lines.length - 8} more.</p>
              )}
            </div>

            <p className="sub">
              Hours come across without prices — they'll be costed at your own rates, not the insurer's.
              Check the totals before you send it.
            </p>
            <button className="btn" data-v="tape" onClick={apply}>
              Add {found.lines.length} {found.lines.length === 1 ? "line" : "lines"} to this job
            </button>
          </>
        )}
        <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

    sb.rpc("my_integrations").then(({ data, error }) => {
      if (error) { toast(error.message); onClose(); return; }
      setF(data); setSaved(JSON.stringify(data));
    });

/* ── Scheduling ──────────────────────────────────────────────
   Shifts live on the shop record so everyone can see who's in.
   Dates are plain YYYY-MM-DD so they sort and compare without
   any timezone arithmetic. */

const SHIFTS = [
  { id: "full",  label: "8 – 5",     start: "08:00", end: "17:00" },
  { id: "early", label: "7 – 4",     start: "07:00", end: "16:00" },
  { id: "late",  label: "10 – 7",    start: "10:00", end: "19:00" },
  { id: "am",    label: "Morning",   start: "08:00", end: "12:00" },
  { id: "pm",    label: "Afternoon", start: "12:00", end: "17:00" },
];

const iso = (d) => {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
};
const todayISO = () => iso(new Date());
const addDays = (isoStr, n) => {
  const [y, m, d] = isoStr.split("-").map(Number);
  const x = new Date(y, m - 1, d + n);
  return iso(x);
};
/** Monday of the week containing this date. */
const weekStart = (isoStr) => {
  const [y, m, d] = isoStr.split("-").map(Number);
  const x = new Date(y, m - 1, d);
  return addDays(isoStr, -((x.getDay() + 6) % 7));
};
const dayName = (isoStr, long) => {
  const [y, m, d] = isoStr.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: long ? "long" : "short" });
};
const dayLabel = (isoStr) => {
  const [y, m, d] = isoStr.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" });
};
const clock = (hhmm) => {
  if (!hhmm) return "";
  const [h, m] = hhmm.split(":").map(Number);
  const ampm = h >= 12 ? "PM" : "AM";
  return `${((h + 11) % 12) + 1}${m ? ":" + String(m).padStart(2, "0") : ""} ${ampm}`;
};
const shiftLabel = (sh) => {
  const preset = SHIFTS.find((x) => x.start === sh.start && x.end === sh.end);
  return preset ? preset.label : `${clock(sh.start)} – ${clock(sh.end)}`;
};
const shiftsOn = (shop, date) => (shop.shifts || []).filter((s) => s.date === date);
const myShift = (shop, staffId, date) =>
  (shop.shifts || []).find((s) => s.date === date && s.staffId === staffId);

/** Everything the reports screen shows, worked out in one pass.
 *  Jobs and payments carry an ISO date from now on; anything older
 *  has none, so it only appears under All time. */
function reportOn(shop, info, clientOf, fromISO) {
  const inRange = (d) => !fromISO || (d && d >= fromISO);
  const jobs = shop.jobs.filter((j) => !fromISO || inRange(j.createdAt));

  let billed = 0, collected = 0, outstanding = 0;
  const byPayer = {}, byType = {}, byKind = { labor: 0, parts: 0, materials: 0 };
  const crew = {}, clients = {};
  let cycleSum = 0, cycleN = 0, supplements = 0;

  jobs.forEach((j) => {
    const total = totalOf(j.est, info.tax);
    const paid = (j.receipts || []).filter((r) => !r.declared)
      .filter((r) => !fromISO || inRange(r.on)).reduce((a, r) => a + (+r.amount || 0), 0);
    billed += total;
    collected += paid;
    outstanding += Math.max(0, total - paid);

    const p = payerOf(j).label;
    byPayer[p] = (byPayer[p] || 0) + total;
    const t = typeOf(j).label;
    byType[t] = (byType[t] || 0) + total;

    (j.est.lines || []).forEach((l) => {
      const amt = (+l.q || 0) * (+l.r || 0);
      if (["labor", "paint", "mech", "diag"].includes(l.t)) byKind.labor += amt;
      else if (l.t === "part") byKind.parts += amt;
      else byKind.materials += amt;
      if (l.supp) supplements += amt;
    });

    payouts(j, shop.staff, info).rows.forEach((r) => {
      crew[r.id] = crew[r.id] || { name: r.s.name, init: r.s.init, photo: r.s.photo, hours: 0, pay: 0, jobs: 0 };
      crew[r.id].hours += r.hours;
      crew[r.id].pay += r.amt;
      crew[r.id].jobs += 1;
    });

    const c = clientOf(j);
    if (c) {
      clients[c.id] = clients[c.id] || { name: c.name, kind: c.kind, total: 0, jobs: 0 };
      clients[c.id].total += total;
      clients[c.id].jobs += 1;
    }

    if (isLast(j) && j.createdAt) {
      const days = Math.round((Date.parse(todayISO()) - Date.parse(j.createdAt)) / 86400000);
      if (days >= 0 && days < 400) { cycleSum += days; cycleN += 1; }
    }
  });

  const fees = collected * 0.029 + (collected > 0 ? 0.3 * jobs.filter((j) => (j.receipts || []).length).length : 0);
  const crewPay = Object.values(crew).reduce((a, c) => a + c.pay, 0);

  return {
    jobs, count: jobs.length, billed, collected, outstanding,
    byPayer, byType, byKind, supplements,
    crew: Object.values(crew).sort((a, b) => b.pay - a.pay),
    clients: Object.values(clients).sort((a, b) => b.total - a.total),
    cycle: cycleN ? cycleSum / cycleN : null,
    fees, crewPay, kept: collected - fees - crewPay,
    open: jobs.filter((j) => !isLast(j)).length,
    ready: jobs.filter((j) => isLast(j)).length,
  };
}

/* ── exports ── */
const csvCell = (v) => {
  const t = String(v ?? "");
  return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t;
};
function downloadCSV(name, rows) {
  const body = rows.map((r) => r.map(csvCell).join(",")).join("\n");
  const url = URL.createObjectURL(new Blob(["\ufeff" + body], { type: "text/csv;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/** Paid invoices, one row per line item, in the shape QuickBooks Online
 *  expects from its own invoice importer. */
function quickbooksRows(shop, info, clientOf) {
  const rows = [["InvoiceNo","Customer","InvoiceDate","DueDate","Item","ItemDescription",
                 "ItemQuantity","ItemRate","ItemAmount","Taxable"]];
  shop.jobs.filter((j) => (j.receipts || []).length).forEach((j) => {
    const c = clientOf(j);
    (j.est.lines || []).forEach((l) => {
      rows.push([
        j.ro, c?.name || "Walk-in", j.dropped, j.promised,
        LINE_TYPES.find((t) => t.id === l.t)?.label || l.t,
        `${l.d}${j.v.year ? ` — ${j.v.year} ${j.v.make} ${j.v.model}` : ""}`,
        l.q, (+l.r).toFixed(2), (l.q * l.r).toFixed(2),
        l.t === "labor" || l.t === "paint" || l.t === "mech" || l.t === "diag" ? "N" : "Y",
      ]);
    });
  });
  return rows;
}

/** Completed work, per vehicle, for a service-history feed. */
function carfaxRows(shop, info, shopId) {
  const rows = [["ShopID","ShopName","ShopPhone","ShopAddress","VIN","Date","Odometer","Services"]];
  shop.jobs.filter((j) => isLast(j) && j.v.vin && j.v.vin.length === 17).forEach((j) => {
    const done = [
      ...(j.requested || []),
      ...(j.service?.items || []).filter((x) => x.done).map((x) => x.label),
      ...(j.est.lines || []).filter((l) => ["labor","paint","mech","diag"].includes(l.t)).map((l) => l.d),
    ];
    rows.push([shopId || "", info.name, info.phone, `${info.address} ${info.city}`.trim(),
               j.v.vin, j.promised || j.dropped, (j.v.miles || "").replace(/\D/g, ""),
               [...new Set(done)].join("; ")]);
  });
  return rows;
}

/** Year-end 1099-NEC preparation.
 *  The app never holds an SSN, so the export leaves the TIN column
 *  blank for the shop to fill from the W-9 it keeps on file. */
function TaxSheet({ shop, info, onClose, toast }) {
  const thisYear = new Date().getFullYear();
  const [year, setYear] = useState(String(thisYear));
  const [crew, setCrew] = useState(null);
  const [err, setErr] = useState("");

  useEffect(() => {
    sb.rpc("crew_tax_details").then(({ data, error }) => {
      if (error) { setErr(error.message); return; }
      setCrew(data || []);
    });
  }, []);

  // what each person was actually paid on money that came in that year
  const paidIn = (email) => {
    let total = 0, undated = 0;
    shop.jobs.forEach((j) => {
      const receipts = (j.receipts || []).filter((r) => !r.declared);
      if (!receipts.length) return;
      const inYear = receipts.some((r) => r.on ? r.on.slice(0, 4) === year : false);
      const anyUndated = receipts.some((r) => !r.on);
      if (!inYear && !anyUndated) return;
      payouts(j, shop.staff, info).rows.forEach((row) => {
        if ((row.s.email || "").toLowerCase() !== (email || "").toLowerCase()) return;
        if (inYear) total += row.amt; else if (anyUndated) undated += row.amt;
      });
    });
    return { total, undated };
  };

  const rows = (crew || []).map((c) => {
    const { total, undated } = paidIn(c.email);
    return { ...c, paid: total, undated, needs1099: c.tax_class === "contractor" && total >= 600 };
  }).sort((a, b) => b.paid - a.paid);

  const contractors = rows.filter((r) => r.tax_class === "contractor");
  const unset = rows.filter((r) => !r.tax_class);
  const filing = rows.filter((r) => r.needs1099);
  const missing = filing.filter((r) => !r.complete);

  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 6px" }}>Year-end 1099s</h1>
        <p className="sub" style={{ marginBottom: 14 }}>
          Contractors paid $600 or more in a year need a 1099-NEC. Employees don't — they get a W-2
          from whoever runs your payroll.
        </p>

        <div className="seg" data-wrap="1">
          {[String(thisYear), String(thisYear - 1)].map((y) => (
            <button key={y} data-on={year === y ? "1" : "0"} onClick={() => setYear(y)}>{y}</button>
          ))}
        </div>

        {err && <p style={{ color: "var(--flag)", fontSize: 13.5 }}>{err}</p>}
        {crew === null && !err && <p className="sub">Loading…</p>}

        {unset.length > 0 && (
          <div className="card" style={{ borderColor: "var(--flag)" }}>
            <div style={{ fontWeight: 600, marginBottom: 4 }}>
              {unset.length} {unset.length === 1 ? "person hasn't" : "people haven't"} said which they are
            </div>
            <p className="sub" style={{ margin: 0 }}>
              {unset.map((r) => r.name).join(", ")} — each of them can set it under How you get paid.
              Until then they're left out of the filing, which is safer than guessing wrong.
            </p>
          </div>
        )}

        {rows.map((r) => (
          <div className="card" key={r.email}>
            <div className="row" style={{ marginBottom: 6 }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontWeight: 600, fontSize: 15 }}>{r.legal_name || r.name}</div>
                <div style={{ fontSize: 12.5, color: "var(--muted)" }}>
                  {r.tax_class === "contractor" ? "Contractor" : r.tax_class === "employee" ? "Employee" : "Not set"}
                  {r.legal_name && r.legal_name !== r.name ? ` · known here as ${r.name}` : ""}
                </div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div className="money">{usd(r.paid)}</div>
                {r.needs1099 && <span className="chip" data-t="warn">Needs a 1099</span>}
                {r.tax_class === "contractor" && !r.needs1099 && r.paid > 0 &&
                  <span className="chip">Under $600</span>}
              </div>
            </div>
            {r.needs1099 && !r.complete && (
              <p className="sub" style={{ margin: 0, color: "var(--flag)" }}>
                Missing their legal name or address. Ask them to finish it under How you get paid.
              </p>
            )}
            {r.undated > 0 && (
              <p className="sub" style={{ margin: 0 }}>
                {usd(r.undated)} more from payments recorded before dates were kept — check those by hand.
              </p>
            )}
          </div>
        ))}

        {filing.length > 0 && (
          <>
            <button className="btn" data-v="tape" disabled={missing.length > 0}
              onClick={() => {
                const out = [["Recipient Name", "TIN", "Address 1", "Address 2", "City", "State", "Zip",
                              "Box 1 Nonemployee Compensation", "Payer Name", "Payer Address", "Payer City",
                              "Payer State", "Payer Zip"]];
                filing.forEach((r) => out.push([
                  r.legal_name, "", r.address1, r.address2 || "", r.city, r.state, r.postal,
                  r.paid.toFixed(2), info.name, info.address, info.city, "", "",
                ]));
                downloadCSV(`1099-nec-${year}.csv`, out);
                toast("Exported");
              }}>
              Export {filing.length} {filing.length === 1 ? "recipient" : "recipients"} for {year}
            </button>
            {missing.length > 0 && (
              <p className="sub" style={{ marginTop: -4 }}>
                Fix the missing details above first — a 1099 without an address gets rejected.
              </p>
            )}
          </>
        )}

        <div className="head">Two things this doesn't do</div>
        <div className="card">
          <p className="sub" style={{ marginTop: 0 }}>
            <strong>No tax ID numbers.</strong> The app never asks for an SSN or EIN, so the TIN column
            comes out blank. Fill it from the W-9 you keep on file when you upload to your filing service —
            Track1099 and Tax1099 both take this format.
          </p>
          <p className="sub" style={{ marginBottom: 0 }}>
            <strong>It doesn't file anything.</strong> There's no sending this to the IRS from here.
            The deadline is 31 January, and it's worth chasing missing W-9s in December rather than
            the week before.
          </p>
        </div>

        <button className="btn" data-v="quiet" onClick={onClose}>Close</button>
      </div>
    </div>
  );
}

    <div className="sheet" onClick={onClose}>

        <p className="sub" style={{ marginTop: -2 }}>
          Your crew sees it next to the hours you book, which makes a busy job easier to read at a glance.
        </p>

        <div className="head">Light or dark</div>
        <div className="seg" data-wrap="1">
          {[[null, `Shop default (${info.mode})`], ["light", "Light"], ["dark", "Dark"]].map(([k, l]) => (

/* ══════════════════  RECORD A PAYMENT  ══════════════════ */

function PaymentSheet({ job, client, taxPct, onSave, onClose }) {
  const split = payerSplit(job, client, taxPct);
  const already = (from) => (job.receipts || []).filter((r) => r.from === from).reduce((a, r) => a + (+r.amount || 0), 0);
  const firstOwing = split.find((r) => r.amount - already(r.from) > 0.004) || split[0];
  const [from, setFrom] = useState(firstOwing?.from || "customer");
  const owed = () => {
    const row = split.find((r) => r.from === from);
    return Math.max(0, (row?.amount || 0) - already(from));
  };
  const [amount, setAmount] = useState(String(owed().toFixed(2)));
  const [method, setMethod] = useState(from === "insurance" || from === "warranty" ? "check" : "card");
  const [ref, setRef] = useState("");

  const pick = (id) => {
    setFrom(id);
    const row = split.find((r) => r.from === id);
    setAmount(String(Math.max(0, (row?.amount || 0) - already(id)).toFixed(2)));
    setMethod(id === "insurance" || id === "warranty" ? "check" : "card");
  };

  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 4px" }}>Record a payment</h1>
        <p className="sub" style={{ marginBottom: 16 }}>
          {usd2(balanceOf(job, taxPct))} still outstanding on {job.ro}.
        </p>

        <span className="lab">Who paid</span>
        <div className="card" style={{ marginBottom: 12 }}>
          {split.map((r) => {
            const paid = already(r.from);
            const left = Math.max(0, r.amount - paid);
            return (
              <button className="line" key={r.from} style={{ width: "100%", textAlign: "left" }} onClick={() => pick(r.from)}>
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span style={{ display: "block", fontWeight: from === r.from ? 600 : 500 }}>{r.label}</span>
                  <span style={{ display: "block", fontSize: 12, color: "var(--muted)" }}>
                    {usd2(r.amount)} owed{paid > 0 ? ` · ${usd2(paid)} received` : ""}
                  </span>
                </span>
                <span className="chip" data-t={left < 0.005 ? "ok" : from === r.from ? "warn" : ""}>
                  {left < 0.005 ? "Settled" : from === r.from ? "Paying" : usd2(left)}
                </span>
              </button>
            );
          })}
        </div>

        <span className="lab">Amount</span>
        <input className="field" inputMode="decimal" value={amount}
          onChange={(e) => setAmount(e.target.value.replace(/[^\d.]/g, ""))} />

        <span className="lab">How</span>
        <div className="seg">
          {PAY_METHODS.map((m) => (
            <button key={m.id} data-on={method === m.id ? "1" : "0"} onClick={() => setMethod(m.id)}>{m.label}</button>
          ))}

        </span>
        <input className="field" placeholder={method === "check" ? "44812" : "Optional"} value={ref} onChange={(e) => setRef(e.target.value)} />

        <button className="btn" disabled={!(+amount > 0)}
          onClick={() => onSave({
            id: uid(), from, amount: +amount, method, on: todayISO(),
            ref: ref.trim(), when: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" }),
          })}>

      </div>

  );

function CameraSheet({ stageLabel, onDone, onClose }) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const [facing, setFacing] = useState("environment");
  const [shots, setShots] = useState([]);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const stopStream = () => {
    streamRef.current?.getTracks().forEach((t) => t.stop());
    streamRef.current = null;
  };

  useEffect(() => {
    let dead = false;
    (async () => {
      stopStream();
      if (!navigator.mediaDevices?.getUserMedia) {
        setErr("This browser can't open the camera. Use Choose from library instead.");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1440 } },
          audio: false,
        });
        if (dead) { stream.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play().catch(() => {});
        }
        setErr("");
      } catch (e) {
        setErr(e.name === "NotAllowedError"
          ? "Camera access is blocked. Allow it for this site in your browser settings, or use Choose from library."
          : "No camera found. Use Choose from library instead.");
      }
    })();
    return () => { dead = true; stopStream(); };
  }, [facing]);

  useEffect(() => () => shots.forEach((s) => URL.revokeObjectURL(s.preview)), []);

  const snap = () => {
    const v = videoRef.current, c = canvasRef.current;
    if (!v || !v.videoWidth) return;
    const scale = Math.min(1, 1600 / Math.max(v.videoWidth, v.videoHeight));
    c.width = Math.round(v.videoWidth * scale);
    c.height = Math.round(v.videoHeight * scale);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    c.toBlob((blob) => {
      if (blob) setShots((s) => [...s, { id: uid(), blob, preview: URL.createObjectURL(blob) }]);
    }, "image/jpeg", 0.72);
    if (navigator.vibrate) navigator.vibrate(12);
  };

  const finish = async () => {
    if (!shots.length) { onClose(); return; }
    setBusy(true);
    stopStream();
    await onDone(shots.map((s) => s.blob));
    setBusy(false);
    onClose();
  };

  return (
    <div className="cam">
      <div className="camtop">
        <button onClick={() => { stopStream(); onClose(); }}>Cancel</button>
        <span>{stageLabel}</span>
        <button onClick={() => setFacing((f) => (f === "environment" ? "user" : "environment"))}>Flip</button>
      </div>

      {err
        ? <div style={{ flex: 1, display: "flex", alignItems: "center" }}><div className="camerr">{err}</div></div>
        : <video ref={videoRef} playsInline muted autoPlay />}

      {shots.length > 0 && (
        <div className="strip2">
          {shots.map((s) => <img key={s.id} src={s.preview} alt="" />)}
        </div>
      )}

      <canvas ref={canvasRef} style={{ display: "none" }} />

      <div className="camfoot">
        <span className="camside">{shots.length ? `${shots.length} taken` : ""}</span>
        <button className="shutter" onClick={snap} disabled={!!err} aria-label="Take a photo" />
        <button className="camside" onClick={finish} disabled={busy}>
          {busy ? "Saving…" : shots.length ? "Done" : "Close"}
        </button>
      </div>
    </div>
  );
}

function VinLookup({ vin, setVin, onDecoded }) {
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState(null);
  const run = async () => {
    const off = decodeOffline(vin);
    if (!off.ok) { setNote({ bad: true, text: off.why }); return; }
    setBusy(true); setNote(null);
    let result = { year: off.year, make: off.make, model: "", trim: "", body: "", engine: "", drive: "" };
    let full = false;
    try {
      const on = await decodeOnline(off.vin);
      result = { ...result, ...Object.fromEntries(Object.entries(on).filter(([, v]) => v)) };
      full = true;
    } catch {}
    setBusy(false); setVin(off.vin); onDecoded(result);
    const line = [result.year, result.make, result.model, result.trim].filter(Boolean).join(" ");
    setNote({
      bad: false, make: result.make,
      text: full
        ? `${line}${result.engine ? ` · ${result.engine}` : ""}${result.drive ? ` · ${result.drive}` : ""}`
        : `${line} — read from the VIN itself. Fill in the model by hand.`,
    });
  };
  return (
    <>
      <span className="lab">VIN</span>
      <div style={{ display: "flex", gap: 8 }}>
        <input className="field" style={{ letterSpacing: ".04em" }} autoCapitalize="characters" maxLength={17}
          placeholder="17 characters" value={vin}
          onChange={(e) => { setVin(e.target.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, "")); setNote(null); }} />
        <button className="btn" style={{ width: 96, padding: 11 }} disabled={vin.length !== 17 || busy} onClick={run}>{busy ? "…" : "Decode"}</button>
      </div>
      <p className="sub" style={{ margin: "-2px 0 10px", color: note?.bad ? "var(--flag)" : "var(--muted)" }}>
        {note ? note.text : "Decode fills year, make, model, trim, body style, and engine."}
      </p>
    </>
  );
}

/** Models for a make. Narrows by year when there is one, otherwise
 *  returns everything that make has ever built. */
function useModels(year, make) {
  const [models, setModels] = useState([]);
  const [state, setState] = useState("idle");   // idle | loading | ready | failed
  useEffect(() => {
    if (!make) { setModels([]); setState("idle"); return; }
    let dead = false;
    setState("loading");
    const base = "https://vpic.nhtsa.dot.gov/api/vehicles";
    const url = year
      ? `${base}/GetModelsForMakeYear/make/${encodeURIComponent(make)}/modelyear/${year}?format=json`
      : `${base}/GetModelsForMake/${encodeURIComponent(make)}?format=json`;
    fetch(url).then((r) => r.json()).then((j) => {
      if (dead) return;
      const list = [...new Set((j.Results || []).map((x) => x.Model_Name).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b));
      setModels(list);
      setState(list.length ? "ready" : "failed");
    }).catch(() => { if (!dead) { setModels([]); setState("failed"); } });
    return () => { dead = true; };
  }, [year, make]);
  return { models, state };
}

function VehiclePicker({ year, make, model, onChange }) {
  const { models, state } = useModels(year, make);
  const [typeYear, setTypeYear] = useState(false);
  const [typeMake, setTypeMake] = useState(false);
  const [typeModel, setTypeModel] = useState(false);

  // a value the list doesn't contain means it was typed or decoded from a VIN
  useEffect(() => { if (year && !YEARS.includes(year)) setTypeYear(true); }, [year]);
  useEffect(() => { if (make && !MAKES.includes(make)) setTypeMake(true); }, [make]);
  useEffect(() => {
    if (state === "failed") setTypeModel(true);
    else if (state === "ready" && model && !models.includes(model)) setTypeModel(true);
  }, [state, models, model]);

  const OTHER = "__type";

  return (
    <>
      <div style={{ display: "flex", gap: 8 }}>
        <div style={{ flex: 1 }}>
          <span className="lab">Year</span>
          {typeYear ? (
            <input className="field" inputMode="numeric" maxLength={4} placeholder="Year"
              value={year || ""} onChange={(e) => onChange({ year: e.target.value.replace(/\D/g, "") })}
              onBlur={() => { if (!year) setTypeYear(false); }} />
          ) : (
            <select className="field" value={year || ""}
              onChange={(e) => e.target.value === OTHER
                ? (setTypeYear(true), onChange({ year: "" }))
                : onChange({ year: e.target.value, model: "" })}>
              <option value="">Year</option>
              {YEARS.map((y) => <option key={y} value={y}>{y}</option>)}
              <option value={OTHER}>Type it instead…</option>
            </select>
          )}
        </div>

        <div style={{ flex: 1.4 }}>
          <span className="lab">Make</span>
          {typeMake ? (
            <input className="field" placeholder="Make" value={make || ""}
              onChange={(e) => onChange({ make: e.target.value, model: "" })}
              onBlur={() => { if (!make) setTypeMake(false); }} />
          ) : (
            <select className="field" value={make || ""}
              onChange={(e) => e.target.value === OTHER
                ? (setTypeMake(true), onChange({ make: "", model: "" }))
                : onChange({ make: e.target.value, model: "" })}>
              <option value="">Make</option>
              {MAKES.map((m) => <option key={m} value={m}>{m}</option>)}
              <option value={OTHER}>Type it instead…</option>
            </select>
          )}
        </div>
      </div>

      <span className="lab">Model</span>
      {typeModel || !make || !models.length ? (
        <input className="field" value={model || ""}
          placeholder={!make ? "Pick a make first, or type the model"
                      : state === "loading" ? "Looking up models…" : "Model"}
          onChange={(e) => onChange({ model: e.target.value })} />
      ) : (
        <select className="field" value={models.includes(model) ? model : ""}
          onChange={(e) => e.target.value === OTHER
            ? (setTypeModel(true), onChange({ model: "" }))
            : onChange({ model: e.target.value })}>
          <option value="">{state === "loading" ? "Looking up models…" : `Choose a ${make} model`}</option>
          {models.map((m) => <option key={m} value={m}>{m}</option>)}
          <option value={OTHER}>Type it instead…</option>
        </select>
      )}
      {make && state === "ready" && !typeModel && (
        <p className="sub" style={{ marginTop: -2 }}>
          {models.length} {make} models{year ? ` from ${year}` : ""}. Not there? Choose "Type it instead".
        </p>
      )}
    </>
  );
}

/* One of each common vehicle color. The name is written onto the job,
   so the shop floor reads "Silver Silverado" instead of a swatch. */
const CAR_COLORS = [
  ["#FFFFFF", "White"],     ["#EFEDE6", "Pearl"],   ["#C4C7C9", "Silver"],  ["#8C9196", "Gray"],
  ["#3E4246", "Charcoal"],  ["#101112", "Black"],   ["#C1272D", "Red"],     ["#6E1B24", "Maroon"],
  ["#E2661F", "Orange"],    ["#EFC624", "Yellow"],  ["#B99653", "Gold"],    ["#2F7A46", "Green"],
  ["#1F5FA8", "Blue"],      ["#16305A", "Navy"],    ["#5B2A83", "Purple"],  ["#5C4433", "Brown"],
  ["#D5C4A6", "Beige"],
];

const colorName = (hex) =>
  (CAR_COLORS.find(([h]) => h.toLowerCase() === (hex || "").toLowerCase()) || [, "Custom"])[1];

function ColorPicker({ value, onPick }) {
  return (
    <>
      <div className="swatches">
        {CAR_COLORS.map(([hex, name]) => (
          <button key={hex} title={name} aria-label={name} style={{ background: hex }}
            data-on={value === hex ? "1" : "0"} onClick={() => onPick(hex, name)} />
        ))}
        <input type="color" value={value || "#8C9196"} aria-label="Any other color"
          onChange={(e) => onPick(e.target.value, "Custom")} />
      </div>
      <p className="sub" style={{ marginTop: -2 }}>{colorName(value)}</p>
    </>
  );
}

function LineEditor({ line, staff, defaultRate, jobType, shop, job, integrations, onSave, onDelete, onClose }) {

  const [armed, setArmed] = useState(false);
  const [l, setL] = useState(line || { id: uid(), t: allowed[0].id, d: "", q: 1, r: defaultRate, who: null, ps: "needed", eta: "" });
  const set = (k, v) => setL({ ...l, [k]: v });
  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 16px" }}>{line ? "Edit line" : "Add a line"}</h1>
        <span className="lab">Type</span>
        <div className="seg" data-wrap="1">
          {allowed.map((t) => (
            <button key={t.id} data-on={l.t === t.id ? "1" : "0"}
              onClick={() => setL({ ...l, t: t.id, r: LABOR_TYPES.includes(t.id) ? defaultRate : l.r })}>{t.label}</button>
          ))}
        </div>
        <span className="lab">Description</span>
        <input className="field" placeholder="Quarter panel R&I and repair" value={l.d} onChange={(e) => set("d", e.target.value)} />

        {integrations?.labor_on && LABOR_TYPES.includes(l.t) && (() => {
          const book = laborBook(shop, l.d, job?.v?.make, job?.v?.model);
          if (!book) return null;
          return (
            <div className="card" style={{ borderColor: "var(--accent)" }}>
              <div className="row">
                <div style={{ minWidth: 0 }}>
                  <div style={{ fontWeight: 600, fontSize: 14.5 }}>
                    You've booked this at {book.hours} hrs
                  </div>
                  <div style={{ fontSize: 12.5, color: "var(--muted)", lineHeight: 1.4 }}>
                    {book.times === 1 ? "Once" : `${book.times} times`}
                    {book.sameVehicle ? ", on this same model" : `, closest was a ${book.example}`}
                    {book.spread ? ` · ranged ${book.spread}` : ""}
                  </div>
                </div>
                <button className="chip" data-t="warn" style={{ flex: "none" }}
                  onClick={() => set("q", String(book.hours))}>Use it</button>
              </div>
            </div>
          );
        })()}
        <div style={{ display: "flex", gap: 8 }}>
          <div style={{ flex: 1 }}><span className="lab">{unit(l.t) === "hrs" ? "Hours" : "Quantity"}</span>
            <input className="field" inputMode="decimal" value={l.q} onChange={(e) => set("q", e.target.value.replace(/[^\d.]/g, ""))} /></div>
          <div style={{ flex: 1 }}><span className="lab">{unit(l.t) === "hrs" ? "Billed per hour" : "Price each"}</span>
            <input className="field" inputMode="decimal" value={l.r} onChange={(e) => set("r", e.target.value.replace(/[^\d.]/g, ""))} /></div>
        </div>
        {LABOR_TYPES.includes(l.t) && (
          <>
            <span className="lab">Who books these hours</span>
            <div className="seg">
              {staff.filter((s) => s.role === "tech" && s.active !== false).map((s) => (
                <button key={s.id} data-on={l.who === s.id ? "1" : "0"} onClick={() => set("who", l.who === s.id ? null : s.id)}>{s.name.split(" ")[0]}</button>
              ))}
            </div>
          </>
        )}
        {l.t === "part" && (
          <>
            <div style={{ display: "flex", gap: 8 }}>
              <div style={{ flex: 1 }}><span className="lab">What it costs you</span>
                <input className="field" inputMode="decimal" placeholder="0.00" value={l.cost ?? ""}
                  onChange={(e) => set("cost", e.target.value.replace(/[^\d.]/g, ""))} /></div>
              <div style={{ flex: 1.3 }}><span className="lab">Supplier</span>
                <input className="field" list="suppliers" value={l.supplier || ""}
                  onChange={(e) => set("supplier", e.target.value)} /></div>
            </div>
            <datalist id="suppliers">
              {(integrations?.suppliers || "").split("\n").map((x) => x.trim()).filter(Boolean)
                .map((x) => <option key={x} value={x} />)}
            </datalist>
            {+l.cost > 0 && +l.r > 0 && (
              <p className="sub" style={{ margin: "-2px 0 10px" }}>
                Margin {usd2((+l.r - +l.cost) * (+l.q || 1))} · {Math.round(((+l.r - +l.cost) / +l.r) * 100)}%
              </p>
            )}
            {integrations?.parts_on && +l.cost > 0 && !(+l.r > 0) && (
              <button className="btn sm" data-v="quiet" style={{ marginBottom: 10 }}
                onClick={() => set("r", ((+l.cost) * (1 + (+integrations.parts_markup || 35) / 100)).toFixed(2))}>
                Price it at your {integrations.parts_markup || 35}% markup
              </button>
            )}
            <span className="lab">Order status</span>
            <div className="seg" data-wrap="1">{PART_STATES.map((p) => <button key={p.id} data-on={l.ps === p.id ? "1" : "0"} onClick={() => set("ps", p.id)}>{p.label}</button>)}</div>
            {(l.ps === "ordered" || l.ps === "backorder") && (<><span className="lab">Expected</span>
              <input className="field" placeholder="Sep 3" value={l.eta || ""} onChange={(e) => set("eta", e.target.value)} /></>)}
          </>
        )}
        <label style={{ display: "flex", alignItems: "center", gap: 9, margin: "6px 0 14px", fontSize: 14 }}>
          <input type="checkbox" checked={!!l.supp} onChange={(e) => set("supp", e.target.checked)} style={{ width: 18, height: 18 }} />
          Supplement — hidden damage found after the original estimate
        </label>
        <div className="row" style={{ marginBottom: 14, padding: "0 2px" }}>
          <span style={{ color: "var(--muted)" }}>Line total</span>
          <span className="money" style={{ fontSize: 22 }}>{usd2((+l.q || 0) * (+l.r || 0))}</span>
        </div>
        <button className="btn" disabled={!l.d.trim()} onClick={() => onSave({ ...l, q: +l.q || 0, r: +l.r || 0 })}>{line ? "Save line" : "Add to estimate"}</button>
        {line && (
          armed ? (
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              <button className="btn" data-v="danger" onClick={onDelete}>Yes, remove it</button>
              <button className="btn" data-v="quiet" style={{ width: 104 }} onClick={() => setArmed(false)}>Cancel</button>
            </div>
          ) : (
            <button className="btn" data-v="danger" style={{ marginTop: 8 }} onClick={() => setArmed(true)}>Remove line</button>
          )
        )}
        <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

function JobDetail({ job, client, me, staff, info, integrations, shopAll, back, update, uploadPhotos, removePhoto, toast }) {
  const [tab, setTab] = useState("work");
  const [draft, setDraft] = useState("");
  const [note, setNote] = useState("");
  const [editLine, setEditLine] = useState(undefined);
  const [crewOpen, setCrewOpen] = useState(false);
  const [doc, setDoc] = useState(null);
  const [camOpen, setCamOpen] = useState(false);
  const [payOpen, setPayOpen] = useState(false);
  const [importOpen, setImportOpen] = useState(false);
  const [viewing, setViewing] = useState(null);
  const [uploading, setUploading] = useState(0);
  const [killing, setKilling] = useState(null);
  const fileRef = useRef(null);
  const photoUrls = usePhotoUrls(job.photos);
  const owner = me.role === "owner";
  const tot = totalOf(job.est, info.tax);
  const po = payouts(job, staff, info);
  const parts = job.est.lines.filter((l) => l.t === "part");
  const laborRate = job.payer === "warranty"
    ? (job.warranty?.rate || info.warrantyRate || info.bodyRate)
    : typeOf(job).id === "detail"
    ? (client?.rate || info.detailRate || 65)
    : (client?.rate || info.bodyRate);
  const split = payerSplit(job, client, info.tax);
  const owing = balanceOf(job, info.tax);
  const mine = po.rows.find((r) => r.id === me.id);
  const vlabel = `${job.v.year} ${job.v.make} ${job.v.model}`;

  const stamp = () => `${stageNow(job).label} · ${new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" })}`;

  const addFiles = async (files) => {
    if (!files.length) return;
    const label = stamp();
    setUploading(files.length);
    const added = await uploadPhotos(job, files, label);
    setUploading(0);
    if (!added.length) return;
    update({ ...job, photos: [...job.photos, ...added] },
      { kind: "note", title: `${added.length} photo${added.length > 1 ? "s" : ""} on the ${job.v.model}`,
        body: `${me.name} added ${label.toLowerCase()}.`, toClient: true });
    toast(`${added.length} photo${added.length > 1 ? "s" : ""} saved`);
  };

  const onPick = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    await addFiles(files);
  };

  const dropPhoto = async (p) => {
    await removePhoto(p);
    update({ ...job, photos: job.photos.filter((x) => x.id !== p.id) });
  };

  const saveLine = (l) => {
    const exists = job.est.lines.some((x) => x.id === l.id);
    update({ ...job, est: { ...job.est, lines: exists ? job.est.lines.map((x) => (x.id === l.id ? l : x)) : [...job.est.lines, l] } });
    setEditLine(undefined); toast(exists ? "Line saved" : "Line added");
  };

  const setPartState = (id, ps) => {
    const lines = job.est.lines.map((l) => (l.id === id ? { ...l, ps } : l));
    const part = lines.find((l) => l.id === id);
    const hold = lines.some((l) => l.t === "part" && l.ps === "backorder");
    update({ ...job, est: { ...job.est, lines }, hold },
      { kind: "parts", title: `${part.d} — ${PART_STATES.find((p) => p.id === ps).label.toLowerCase()}`,
        body: `${vlabel}${ps === "backorder" ? ". Job is now on hold." : ""}`, toClient: ps === "backorder" || ps === "received" });
  };

  const noteCount = job.notes.length + (job.clientNotes || []).length;
  const TABS = [["work", "Work"], ["photos", `Photos ${job.photos.length}`], ["parts", `Parts ${parts.length}`],
    ["notes", `Notes ${noteCount || ""}`.trim()], ["msgs", "Messages"], ["money", owner ? "Estimate" : "My pay"]];

  return (
    <>
      <div className="bar">
        <button onClick={back} style={{ fontSize: 14, color: "var(--muted)", marginBottom: 8 }}>‹ Shop Floor</button>
        <div style={{ display: "flex", gap: 11, alignItems: "center", minWidth: 0 }}>
          <span className="swatch" style={{ background: job.v.color, width: 34, height: 34 }} />
          <div style={{ minWidth: 0 }}>
            <h1 style={{ fontSize: 21 }}>{vlabel}</h1>
            <p className="sub">
              {job.ro}{job.stockNo ? ` · stock ${job.stockNo}` : ""} · {client?.name || "No client"}
            </p>
          </div>
        </div>
        <div className="seg" style={{ marginTop: 14, marginBottom: 0 }}>
          {TABS.map(([k, l]) => <button key={k} data-on={tab === k ? "1" : "0"} onClick={() => setTab(k)}>{l}</button>)}
        </div>
      </div>

      <div className="pad">
        {(() => {
          const n = nextStep(job, me, info, client);
          if (!n || n.tab === tab) return null;
          return (
            <div className="nudge">
              <div className="nt">{n.title}</div>
              <div className="nw">{n.why}</div>
              <button className="btn" data-v="tape" onClick={() => setTab(n.tab)}>{n.cta}</button>
            </div>
          );
        })()}

        {tab === "work" && (
          <>
            <div className="card">
              <div className="row" style={{ marginBottom: 4 }}>
                <span style={{ fontWeight: 600, fontSize: 17 }}>{stageNow(job).label}</span>
