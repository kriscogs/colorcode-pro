<script>
// Shows any startup error on screen, so you don't need a console to read it.
(function () {
  function show(kind, text) {
    var el = document.getElementById('boot');
    if (!el) return;
    el.style.textAlign = 'left';
    el.innerHTML =
      '<div style="font:600 15px system-ui;color:#B4352C;margin-bottom:8px">' + kind + '</div>' +
      '<pre style="white-space:pre-wrap;word-break:break-word;font:12px ui-monospace,monospace;' +
      'color:#14202B;background:#fff;border:1px solid #DCDCD5;border-radius:8px;padding:12px;margin:0">' +
      String(text).replace(/[&<>]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
      }) + '</pre>';
  }
  window.addEventListener('error', function (e) {
    show('Startup error', (e.message || e.error || 'unknown') +
      (e.filename ? '\n' + e.filename + ' line ' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    show('Startup error', (e.reason && (e.reason.message || e.reason)) || 'unknown');
  });
  var ce = console.error;
  console.error = function () {
    var msg = Array.prototype.map.call(arguments, function (a) {
      return a && a.message ? a.message : String(a);
    }).join(' ');
    if (/SyntaxError|Unexpected|Parse|transform/i.test(msg)) show('Could not compile the page', msg);
    ce.apply(console, arguments);
  };
})();
</script>

function themeVars(id, mode) {
  const t = THEMES[id] || THEMES.gaz;
  const dark = mode === "dark";
  const base = dark ? t.dark : t.light;
  const sem = dark ? MODE_DARK : MODE_LIGHT;
  const v = {
    ...base, ...sem,
    accent: dark ? t.accentDark : t.accent,
    onAccent: dark ? t.onAccentDark : t.onAccent,
    paint: t.paint,
  };
  return Object.fromEntries(Object.entries(v).map(([k, val]) => [`--${k}`, val]));

const VIN_WEIGHTS = [8, 7, 6, 5, 4, 3, 2, 10, 0, 9, 8, 7, 6, 5, 4, 3, 2];
const YEAR_CODES = "ABCDEFGHJKLMNPRSTVWXY123456789";
const WMI = {
  "1G1": "Chevrolet", "1GC": "Chevrolet", "1GN": "Chevrolet", "3GN": "Chevrolet", "2G1": "Chevrolet", "KL8": "Chevrolet",

  "WBA": "BMW", "WBS": "BMW", "5UX": "BMW", "4US": "BMW", "WDD": "Mercedes-Benz", "WDC": "Mercedes-Benz",
  "4JG": "Mercedes-Benz", "W1K": "Mercedes-Benz", "W1N": "Mercedes-Benz", "WAU": "Audi", "WA1": "Audi", "TRU": "Audi",

  "ML3": "Mitsubishi", "JA4": "Mitsubishi", "SAL": "Land Rover", "SAJ": "Jaguar", "YV1": "Volvo", "LYV": "Volvo", "WP0": "Porsche", "WP1": "Porsche",
};
function vinCheck(vin) {
  if (!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)) return false;
  let sum = 0;
  for (let i = 0; i < 17; i++) {
    const c = vin[i], val = /\d/.test(c) ? +c : VIN_TRANS[c];
    if (val === undefined) return false;
    sum += val * VIN_WEIGHTS[i];
  }
  const rem = sum % 11;
  return vin[8] === (rem === 10 ? "X" : String(rem));
}
function decodeOffline(raw) {
  const vin = raw.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, "");
  if (vin.length !== 17) return { ok: false, why: `A VIN is 17 characters. That one has ${vin.length}.` };
  if (!vinCheck(vin)) return { ok: false, why: "That VIN fails its check digit. Look for a mistyped character." };
  const i = YEAR_CODES.indexOf(vin[9]);
  return { ok: true, vin, make: WMI[vin.slice(0, 3)] || "", year: i === -1 ? "" : String((/[A-Z]/.test(vin[6]) ? 2010 : 1980) + i) };
}
async function decodeOnline(vin) {
  const r = await fetch(`https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/${vin}?format=json`);
  if (!r.ok) throw new Error("lookup failed");
  const d = (await r.json())?.Results?.[0];
  if (!d) throw new Error("no result");
  const cap = (s) => (s || "").replace(/\b\w/g, (c) => c.toUpperCase());
  const model = [d.Model, d.Series && d.Series !== d.Model ? d.Series : ""].filter(Boolean).join(" ").trim();
  return {
    make: cap(d.Make), model, year: d.ModelYear || "",
    trim: [d.Trim, d.Trim2].filter(Boolean).join(" ") || d.Series2 || "",
    body: d.BodyClass || "",
    drive: d.DriveType || "",
    engine: [
      d.DisplacementL ? `${(+d.DisplacementL).toFixed(1)}L` : "",
      d.EngineCylinders ? `${d.EngineCylinders}-cyl` : "",
      d.FuelTypePrimary && !/gasoline/i.test(d.FuelTypePrimary) ? d.FuelTypePrimary : "",
    ].filter(Boolean).join(" "),
  };
}

const sb = typeof window !== "undefined" ? window.supabaseClient : null;

const initialsOf = (name) => (name || "").trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase() || "??";

function friendly(msg) {
  if (/invalid login/i.test(msg)) return "That email and password don't match an account.";
  if (/already registered|already been registered/i.test(msg)) return "That email already has an account. Sign in instead.";
  if (/at least 6/i.test(msg)) return "Passwords need at least 8 characters.";
  if (/email not confirmed/i.test(msg)) return "Confirm your email first, or switch off email confirmation in Supabase.";
  return msg;
}

/* One JSON blob per shop, shared by everyone signed into that shop. */
async function myShopId() {
  const { data, error } = await sb.rpc("my_shop_id");
  if (error) throw new Error(error.message);
  return data || null;
}
async function readBlob(shopId) {
  const { data, error } = await sb.from("app_state").select("value").eq("shop_id", shopId).maybeSingle();
  if (error) throw new Error(error.message);
  return data?.value ? JSON.parse(data.value) : null;
}
async function writeBlob(shopId, blob) {
  const { error } = await sb.from("app_state")
    .upsert({ shop_id: shopId, value: JSON.stringify(blob), updated_at: new Date().toISOString() });
  if (error) throw new Error(error.message);
}

/* Fills an empty shop with the sample jobs so there's something to look at. */
function withSampleData(shop) {
  const d = demoShop();
  const extras = d.staff.filter((x) => x.role !== "owner").map((x) => ({ ...x, pass: undefined, demo: true }));
  const owner = shop.staff.find((x) => x.role === "owner") || shop.staff[0];
  const remap = { e1: owner?.id };
  const staff = [...shop.staff, ...extras.filter((x) => !shop.staff.some((y) => y.email === x.email))];
  const fix = (id) => remap[id] || id;
  return {
    ...shop,
    staff,
    contacts: d.contacts,
    jobs: d.jobs.map((j) => ({
      ...j,
      crew: j.crew.map(fix),
      est: { ...j.est, lines: j.est.lines.map((l) => ({ ...l, who: l.who ? fix(l.who) : null })) },
    })),
    notifs: [], tickets: shop.tickets || [],
  };
}

const usd = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const usd2 = (n) => n.toLocaleString("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2 });
const subtotal = (est) => est.lines.reduce((a, l) => a + (+l.q || 0) * (+l.r || 0), 0);
const totalOf = (est, taxPct) => subtotal(est) * (1 + taxPct / 100);
const unit = (t) => LINE_TYPES.find((x) => x.id === t)?.unit || "ea";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const received = (job) => (job.receipts || []).reduce((a, r) => a + (+r.amount || 0), 0);
const balanceOf = (job, taxPct) => Math.max(0, totalOf(job.est, taxPct) - received(job));

/** Who owes what. Insurance jobs split between the carrier and the deductible. */
function payerSplit(job, client, taxPct) {
  const total = totalOf(job.est, taxPct);
  const p = job.payer || "customer";
  if (p === "insurance") {
    const ded = Math.min(+job.claim?.deductible || 0, total);
    return [
      { from: "insurance", label: job.claim?.insurer || "Insurance carrier", amount: total - ded },
      { from: "customer", label: "Customer deductible", amount: ded },
    ].filter((r) => r.amount > 0.004);
  }
  if (p === "warranty") return [{ from: "warranty", label: job.warranty?.maker || `${job.v.make} warranty`, amount: total }];
  if (p === "dealer") return [{ from: "dealer", label: client?.name || "Dealership", amount: total }];
  return [{ from: "customer", label: client?.name || "Customer", amount: total }];
}

/** The single most useful next action on a job, or null when nothing is waiting.
 *  Never blocks anything — it only points. */
function nextStep(job, me, info, client) {
  const owner = me.role === "owner";
  const kind = typeOf(job).id;
  const lines = job.est?.lines || [];
  const parts = lines.filter((l) => l.t === "part");
  const photos = job.photos || [];
  const step = sIdx(job);
  const upcoming = stagesOf(job)[step + 1];
  const owing = balanceOf(job, info.tax);
  const who = (client?.contact || "the client").split(" ")[0];

  if (!owner) {
    if (photos.length === 0)
      return { pri: 2, group: "Photos to take", tab: "photos", cta: "Open the camera", title: "Shoot it before you touch it",
               why: "A before photo settles arguments with insurers and dealers later. Thirty seconds now." };
    if (kind === "mechanical" && step >= 1 && !job.ccc?.cause)
      return { pri: 3, group: "Write-ups to finish", tab: "work", cta: "Write it up", title: "Note what you found",
               why: "Cause and correction have to be on the invoice or a warranty claim gets kicked back." };
    if (kind === "maintenance" && (job.service?.items || []).length && (job.service.items).some((i) => !i.done))
      return { pri: 3, group: "Checklists to finish", tab: "work", cta: "Tick them off", title: "Finish the checklist",
               why: "Completed items print on the invoice, so the customer sees what they paid for." };
    if (job.hold)
      return { pri: 6, group: "Waiting on parts", tab: "parts", cta: "See why", title: "This one's on hold",
               why: "Work is paused until a part lands. Nothing to do here yet." };
    if (upcoming)
      return { pri: 4, group: "Ready to move on", tab: "work", cta: `Move to ${upcoming.label}`, title: `Done with ${stageNow(job).label}?`,
               why: "Moving it on notifies the office and the client automatically." };
    return null;
  }

  if (!job.clientId)
    return { pri: 1, group: "Needs attention", tab: "work", cta: "Pick a client", title: "No client on this job", why: "Nothing can be billed until there's someone to bill." };
  if (job.fromClient && step === 0)
    return { pri: 1, group: "New requests", tab: "work", cta: "Look it over", title: `${client?.name || "A client"} sent this in`,
             why: "Check the details, put someone on it, and write the estimate." };
  if (job.crew.length === 0)
    return { pri: 2, group: "Nobody assigned", tab: "work", cta: "Assign the crew", title: "Nobody's on this yet",
             why: "Techs only see jobs they're assigned, and pay is worked out from who books the hours." };
  if (!(job.requested || []).length && !job.notes.length)
    return { pri: 2, group: "Missing details", tab: "work", cta: "Tag what it's in for", title: "Nothing says why it's here",
             why: "Tap the services so whoever writes the estimate isn't guessing." };
  if (lines.length === 0)
    return { pri: 3, group: "Estimates to write", tab: "money", cta: "Start the estimate", title: "Nothing priced yet",
             why: "Add labor, parts and materials. Rates come from your settings." };
  if (job.est.status === "draft")
    return { pri: 3, group: "Estimates to send", tab: "money", cta: "Send it", title: `Estimate is ready for ${who}`,
             why: "Send it as a document by text or email and they can approve it from their phone." };
  if (job.est.status === "sent")
    return { pri: 5, group: "Waiting on approval", tab: "msgs", cta: `Nudge ${who}`, title: `Waiting on ${who} to approve`,
             why: "Nothing should be ordered or started until this comes back." };
  if (parts.some((l) => (l.ps || "needed") === "needed"))
    return { pri: 2, group: "Parts to order", tab: "parts", cta: "Mark them ordered", title: "Parts still to order",
             why: "Approved and priced, so nothing's stopping the order going in." };
  if (job.hold)
    return { pri: 6, group: "Waiting on parts", tab: "parts", cta: "Check the parts", title: "On hold",
             why: "Something's backordered. The client has been told." };
  if (upcoming)
    return { pri: 4, group: "Ready to move on", tab: "work", cta: `Move to ${upcoming.label}`, title: `Sitting in ${stageNow(job).label}`,
             why: "Every move updates the client without you writing anything." };
  if (owing > 0.004)
    return { pri: 1, group: "Money to collect", tab: "money", cta: "Collect", title: `${usd2(owing)} still outstanding`,
             why: "It's finished. Send the invoice or record what's come in." };
  return null;
}

function payouts(job, staff, info) {
  const gross = totalOf(job.est, info.tax);
  const fee = gross * 0.029 + 0.3;
  const rows = job.crew.map((id) => {
    const s = staff.find((x) => x.id === id);
    if (!s) return null;
    const mine = job.est.lines.filter((l) => l.who === id);
    const hours = mine.reduce((a, l) => a + (+l.q || 0), 0);
    const billed = mine.reduce((a, l) => a + (+l.q || 0) * (+l.r || 0), 0);
    let amt = 0, basis = "";
    if (s.payType === "hourly") { amt = hours * (s.hourlyRate || 0); basis = `${hours} hrs × ${usd2(s.hourlyRate || 0)}`; }
    else if (s.payType === "percent") { amt = billed * (s.percent || 0) / 100; basis = `${s.percent}% of ${usd2(billed)} labor`; }
    else { amt = job.flatPay?.[id] ?? s.flat ?? 0; basis = "Flat for this job"; }
    return { id, s, amt, basis, hours, billed };
  }).filter(Boolean).filter((r) => r.amt > 0 || r.hours > 0);
  const crewTotal = rows.reduce((a, r) => a + r.amt, 0);
  return { gross, fee, rows, crewTotal, shop: gross - fee - crewTotal };
}

/** Build a notification aimed at the owner plus everyone on the job's crew. */
function buildNotif(shop, job, { kind, title, body, actorId, toClient }) {
  const to = shop.staff
    .filter((s) => s.role === "owner" || job.crew.includes(s.id))
    .map((s) => s.id)
    .filter((id) => id !== actorId);
  return { id: uid(), jobId: job.id, kind, title, body, at: now(), to, read: [], toClient: !!toClient };
}

/** Paint codes this shop has already recorded for a make — the shop's own code book. */
function codeBook(shop, make) {
  const seen = new Set();
  shop.jobs.forEach((j) => {
    const p = (j.v.paint || "").trim();
    if (!p || /^not recorded/i.test(p)) return;
    if (!make || j.v.make === make) seen.add(p);
  });
  return [...seen].sort();
}

/** Same as shrink, but hands back a Blob ready to upload. */
async function shrinkToBlob(file, max, quality) {
  const url = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = rej; i.src = url;
  });
  const scale = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(url);
  return new Promise((res) => c.toBlob((b) => res(b), "image/jpeg", quality));
}

/** Photos live in private storage, so each one needs a short-lived signed link. */
function usePhotoUrls(photos) {
  const [urls, setUrls] = useState({});
  const key = photos.map((p) => p.id).join(",");
  useEffect(() => {
    const need = photos.filter((p) => p.path && !urls[p.id]);
    if (!need.length || !sb) return;
    let dead = false;
    (async () => {
      const { data, error } = await sb.storage.from("job-photos")
        .createSignedUrls(need.map((p) => p.path), 3600);
      if (error || dead || !data) return;
      const next = {};
      data.forEach((d, i) => { if (d?.signedUrl) next[need[i].id] = d.signedUrl; });
      setUrls((u) => ({ ...u, ...next }));
    })();
    return () => { dead = true; };
  }, [key]);
  return urls;
}

async function shrink(file, max, quality) {
  const img = await new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file);
  });
  const scale = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  URL.revokeObjectURL(img.src);
  return c.toDataURL("image/jpeg", quality);
}

function DocSheet({ job, client, info, kind, onClose, onSent, toast }) {
  const html = docHTML(job, client, info, kind);
  const text = docText(job, client, info, kind);
  const label = kind === "invoice" ? "Invoice" : "Estimate";

  const download = () => {
    const docCSS = CSS.split(".bs .doc {")[1] ? ".bs .doc {" + CSS.split(".bs .doc {")[1].split("@media print")[0] : "";
    const page = `<!doctype html><meta charset="utf-8"><title>${label} ${job.ro}</title>
<style>body{font-family:Barlow,system-ui,sans-serif;margin:0;padding:32px;background:#fff}${docCSS}</style>
<div class="bs">${html}</div>`;
    const url = URL.createObjectURL(new Blob([page], { type: "text/html" }));
    const a = document.createElement("a");
    a.href = url; a.download = `${info.name.replace(/\W+/g, "-")}-${job.ro}-${kind}.html`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Downloaded");
  };
  const sms = () => {
    const body = encodeURIComponent(text);
    window.location.href = `sms:${(client?.phone || "").replace(/\D/g, "")}${/iPhone|iPad|Mac/.test(navigator.userAgent) ? "&" : "?"}body=${body}`;
    onSent?.("text");
  };
  const email = () => {
    window.location.href = `mailto:${client?.email || ""}?subject=${encodeURIComponent(`${label} ${job.ro} — ${info.name}`)}&body=${encodeURIComponent(text)}`;
    onSent?.("email");
  };
  const share = async () => {
    try {
      if (navigator.share) { await navigator.share({ title: `${label} ${job.ro}`, text }); onSent?.("share"); }
      else { await navigator.clipboard.writeText(text); toast("Copied to the clipboard"); }
    } catch {}
  };

  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <div className="noprint" style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h1 style={{ fontSize: 22, margin: 0 }}>{label} {job.ro}</h1>
          <button onClick={onClose} style={{ fontSize: 22, color: "var(--muted)", padding: "0 4px" }}>×</button>
        </div>
        <div dangerouslySetInnerHTML={{ __html: html }} />
        <div className="noprint" style={{ marginTop: 16 }}>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <button className="btn sm" onClick={sms}>Text it</button>
            <button className="btn sm" onClick={email}>Email it</button>
          </div>
          <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
            <button className="btn sm" data-v="quiet" onClick={() => window.print()}>Print</button>
            <button className="btn sm" data-v="quiet" onClick={download}>Download</button>
            <button className="btn sm" data-v="quiet" onClick={share}>Share</button>
          </div>
          <button className="btn" data-v="quiet" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════  RECORD A PAYMENT  ══════════════════ */

function PaymentSheet({ job, client, taxPct, onSave, onClose }) {
  const split = payerSplit(job, client, taxPct);
  const already = (from) => (job.receipts || []).filter((r) => r.from === from).reduce((a, r) => a + (+r.amount || 0), 0);
  const firstOwing = split.find((r) => r.amount - already(r.from) > 0.004) || split[0];
  const [from, setFrom] = useState(firstOwing?.from || "customer");
  const owed = () => {
    const row = split.find((r) => r.from === from);
    return Math.max(0, (row?.amount || 0) - already(from));
  };
  const [amount, setAmount] = useState(String(owed().toFixed(2)));
  const [method, setMethod] = useState(from === "insurance" || from === "warranty" ? "check" : "card");
  const [ref, setRef] = useState("");

  const pick = (id) => {
    setFrom(id);
    const row = split.find((r) => r.from === id);
    setAmount(String(Math.max(0, (row?.amount || 0) - already(id)).toFixed(2)));
    setMethod(id === "insurance" || id === "warranty" ? "check" : "card");
  };

  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 4px" }}>Record a payment</h1>
        <p className="sub" style={{ marginBottom: 16 }}>
          {usd2(balanceOf(job, taxPct))} still outstanding on {job.ro}.
        </p>

        <span className="lab">Who paid</span>
        <div className="card" style={{ marginBottom: 12 }}>
          {split.map((r) => {
            const paid = already(r.from);
            const left = Math.max(0, r.amount - paid);
            return (
              <button className="line" key={r.from} style={{ width: "100%", textAlign: "left" }} onClick={() => pick(r.from)}>
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span style={{ display: "block", fontWeight: from === r.from ? 600 : 500 }}>{r.label}</span>
                  <span style={{ display: "block", fontSize: 12, color: "var(--muted)" }}>
                    {usd2(r.amount)} owed{paid > 0 ? ` · ${usd2(paid)} received` : ""}
                  </span>
                </span>
                <span className="chip" data-t={left < 0.005 ? "ok" : from === r.from ? "warn" : ""}>
                  {left < 0.005 ? "Settled" : from === r.from ? "Paying" : usd2(left)}
                </span>
              </button>
            );
          })}
        </div>

        <span className="lab">Amount</span>
        <input className="field" inputMode="decimal" value={amount}
          onChange={(e) => setAmount(e.target.value.replace(/[^\d.]/g, ""))} />

        <span className="lab">How</span>
        <div className="seg">
          {PAY_METHODS.map((m) => (
            <button key={m.id} data-on={method === m.id ? "1" : "0"} onClick={() => setMethod(m.id)}>{m.label}</button>
          ))}
        </div>

        <span className="lab">
          {method === "check" ? "Check number" : method === "eft" ? "Trace or reference number" : "Reference (optional)"}
        </span>
        <input className="field" placeholder={method === "check" ? "44812" : "Optional"} value={ref} onChange={(e) => setRef(e.target.value)} />

        <button className="btn" disabled={!(+amount > 0)}
          onClick={() => onSave({
            id: uid(), from, amount: +amount, method,
            ref: ref.trim(), when: new Date().toLocaleDateString("en-US", { month: "short", day: "numeric" }),
          })}>
          Record {usd2(+amount || 0)}
        </button>
        <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

function CameraSheet({ stageLabel, onDone, onClose }) {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const [facing, setFacing] = useState("environment");
  const [shots, setShots] = useState([]);
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const stopStream = () => {
    streamRef.current?.getTracks().forEach((t) => t.stop());
    streamRef.current = null;
  };

  useEffect(() => {
    let dead = false;
    (async () => {
      stopStream();
      if (!navigator.mediaDevices?.getUserMedia) {
        setErr("This browser can't open the camera. Use Choose from library instead.");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1440 } },
          audio: false,
        });
        if (dead) { stream.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = stream;
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          await videoRef.current.play().catch(() => {});
        }
        setErr("");
      } catch (e) {
        setErr(e.name === "NotAllowedError"
          ? "Camera access is blocked. Allow it for this site in your browser settings, or use Choose from library."
          : "No camera found. Use Choose from library instead.");
      }
    })();
    return () => { dead = true; stopStream(); };
  }, [facing]);

  useEffect(() => () => shots.forEach((s) => URL.revokeObjectURL(s.preview)), []);

  const snap = () => {
    const v = videoRef.current, c = canvasRef.current;
    if (!v || !v.videoWidth) return;
    const scale = Math.min(1, 1600 / Math.max(v.videoWidth, v.videoHeight));
    c.width = Math.round(v.videoWidth * scale);
    c.height = Math.round(v.videoHeight * scale);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    c.toBlob((blob) => {
      if (blob) setShots((s) => [...s, { id: uid(), blob, preview: URL.createObjectURL(blob) }]);
    }, "image/jpeg", 0.72);
    if (navigator.vibrate) navigator.vibrate(12);
  };

  const finish = async () => {
    if (!shots.length) { onClose(); return; }
    setBusy(true);
    stopStream();
    await onDone(shots.map((s) => s.blob));
    setBusy(false);
    onClose();
  };

  return (
    <div className="cam">
      <div className="camtop">
        <button onClick={() => { stopStream(); onClose(); }}>Cancel</button>
        <span>{stageLabel}</span>
        <button onClick={() => setFacing((f) => (f === "environment" ? "user" : "environment"))}>Flip</button>
      </div>

      {err
        ? <div style={{ flex: 1, display: "flex", alignItems: "center" }}><div className="camerr">{err}</div></div>
        : <video ref={videoRef} playsInline muted autoPlay />}

      {shots.length > 0 && (
        <div className="strip2">
          {shots.map((s) => <img key={s.id} src={s.preview} alt="" />)}
        </div>
      )}

      <canvas ref={canvasRef} style={{ display: "none" }} />

      <div className="camfoot">
        <span className="camside">{shots.length ? `${shots.length} taken` : ""}</span>
        <button className="shutter" onClick={snap} disabled={!!err} aria-label="Take a photo" />
        <button className="camside" onClick={finish} disabled={busy}>
          {busy ? "Saving…" : shots.length ? "Done" : "Close"}
        </button>
      </div>
    </div>
  );
}

function VinLookup({ vin, setVin, onDecoded }) {
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState(null);
  const run = async () => {
    const off = decodeOffline(vin);
    if (!off.ok) { setNote({ bad: true, text: off.why }); return; }
    setBusy(true); setNote(null);
    let result = { year: off.year, make: off.make, model: "", trim: "", body: "", engine: "", drive: "" };
    let full = false;
    try {
      const on = await decodeOnline(off.vin);
      result = { ...result, ...Object.fromEntries(Object.entries(on).filter(([, v]) => v)) };
      full = true;
    } catch {}
    setBusy(false); setVin(off.vin); onDecoded(result);
    const line = [result.year, result.make, result.model, result.trim].filter(Boolean).join(" ");
    setNote({
      bad: false, make: result.make,
      text: full
        ? `${line}${result.engine ? ` · ${result.engine}` : ""}${result.drive ? ` · ${result.drive}` : ""}`
        : `${line} — read from the VIN itself. Fill in the model by hand.`,
    });
  };
  return (
    <>
      <span className="lab">VIN</span>
      <div style={{ display: "flex", gap: 8 }}>
        <input className="field" style={{ letterSpacing: ".04em" }} autoCapitalize="characters" maxLength={17}
          placeholder="17 characters" value={vin}
          onChange={(e) => { setVin(e.target.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, "")); setNote(null); }} />
        <button className="btn" style={{ width: 96, padding: 11 }} disabled={vin.length !== 17 || busy} onClick={run}>{busy ? "…" : "Decode"}</button>
      </div>
      <p className="sub" style={{ margin: "-2px 0 10px", color: note?.bad ? "var(--flag)" : "var(--muted)" }}>
        {note ? note.text : "Decode fills year, make, model, trim, body style, and engine."}
      </p>
    </>
  );
}

/* ── Year, make and model.
      Lists come from the same NHTSA database as the VIN decoder.
      Every one of the three can be typed instead, because a
      one-ton flatbed conversion isn't in anybody's dropdown. ── */
const YEARS = (() => {
  const now = new Date().getFullYear() + 1;
  return Array.from({ length: now - 1959 }, (_, i) => String(now - i));
})();

const MAKES = ["Acura","Alfa Romeo","Audi","BMW","Buick","Cadillac","Chevrolet","Chrysler","Dodge",
  "Fiat","Ford","Freightliner","Genesis","GMC","Honda","Hummer","Hyundai","Infiniti","Isuzu","Jaguar",
  "Jeep","Kia","Land Rover","Lexus","Lincoln","Lucid","Maserati","Mazda","Mercedes-Benz","Mercury",
  "Mini","Mitsubishi","Nissan","Oldsmobile","Plymouth","Polestar","Pontiac","Porsche","Ram","Rivian",
  "Saab","Saturn","Scion","Subaru","Suzuki","Tesla","Toyota","Volkswagen","Volvo"];

/** Models for a make. Narrows by year when there is one, otherwise
 *  returns everything that make has ever built. */
function useModels(year, make) {
  const [models, setModels] = useState([]);
  const [state, setState] = useState("idle");   // idle | loading | ready | failed
  useEffect(() => {
    if (!make) { setModels([]); setState("idle"); return; }
    let dead = false;
    setState("loading");
    const base = "https://vpic.nhtsa.dot.gov/api/vehicles";
    const url = year
      ? `${base}/GetModelsForMakeYear/make/${encodeURIComponent(make)}/modelyear/${year}?format=json`
      : `${base}/GetModelsForMake/${encodeURIComponent(make)}?format=json`;
    fetch(url).then((r) => r.json()).then((j) => {
      if (dead) return;
      const list = [...new Set((j.Results || []).map((x) => x.Model_Name).filter(Boolean))]
        .sort((a, b) => a.localeCompare(b));
      setModels(list);
      setState(list.length ? "ready" : "failed");
    }).catch(() => { if (!dead) { setModels([]); setState("failed"); } });
    return () => { dead = true; };
  }, [year, make]);
  return { models, state };
}

function VehiclePicker({ year, make, model, onChange }) {
  const { models, state } = useModels(year, make);
  const [typeYear, setTypeYear] = useState(false);
  const [typeMake, setTypeMake] = useState(false);
  const [typeModel, setTypeModel] = useState(false);

  // a value the list doesn't contain means it was typed or decoded from a VIN
  useEffect(() => { if (year && !YEARS.includes(year)) setTypeYear(true); }, [year]);
  useEffect(() => { if (make && !MAKES.includes(make)) setTypeMake(true); }, [make]);
  useEffect(() => {
    if (state === "failed") setTypeModel(true);
    else if (state === "ready" && model && !models.includes(model)) setTypeModel(true);
  }, [state, models, model]);

  const OTHER = "__type";

  return (
    <>
      <div style={{ display: "flex", gap: 8 }}>
        <div style={{ flex: 1 }}>
          <span className="lab">Year</span>
          {typeYear ? (
            <input className="field" inputMode="numeric" maxLength={4} placeholder="Year"
              value={year || ""} onChange={(e) => onChange({ year: e.target.value.replace(/\D/g, "") })}
              onBlur={() => { if (!year) setTypeYear(false); }} />
          ) : (
            <select className="field" value={year || ""}
              onChange={(e) => e.target.value === OTHER
                ? (setTypeYear(true), onChange({ year: "" }))
                : onChange({ year: e.target.value, model: "" })}>
              <option value="">Year</option>
              {YEARS.map((y) => <option key={y} value={y}>{y}</option>)}
              <option value={OTHER}>Type it instead…</option>
            </select>
          )}
        </div>

        <div style={{ flex: 1.4 }}>
          <span className="lab">Make</span>
          {typeMake ? (
            <input className="field" placeholder="Make" value={make || ""}
              onChange={(e) => onChange({ make: e.target.value, model: "" })}
              onBlur={() => { if (!make) setTypeMake(false); }} />
          ) : (
            <select className="field" value={make || ""}
              onChange={(e) => e.target.value === OTHER
                ? (setTypeMake(true), onChange({ make: "", model: "" }))
                : onChange({ make: e.target.value, model: "" })}>
              <option value="">Make</option>
              {MAKES.map((m) => <option key={m} value={m}>{m}</option>)}
              <option value={OTHER}>Type it instead…</option>
            </select>
          )}
        </div>
      </div>

      <span className="lab">Model</span>
      {typeModel || !make || !models.length ? (
        <input className="field" value={model || ""}
          placeholder={!make ? "Pick a make first, or type the model"
                      : state === "loading" ? "Looking up models…" : "Model"}
          onChange={(e) => onChange({ model: e.target.value })} />
      ) : (
        <select className="field" value={models.includes(model) ? model : ""}
          onChange={(e) => e.target.value === OTHER
            ? (setTypeModel(true), onChange({ model: "" }))
            : onChange({ model: e.target.value })}>
          <option value="">{state === "loading" ? "Looking up models…" : `Choose a ${make} model`}</option>
          {models.map((m) => <option key={m} value={m}>{m}</option>)}
          <option value={OTHER}>Type it instead…</option>
        </select>
      )}
      {make && state === "ready" && !typeModel && (
        <p className="sub" style={{ marginTop: -2 }}>
          {models.length} {make} models{year ? ` from ${year}` : ""}. Not there? Choose "Type it instead".
        </p>
      )}
    </>
  );
}

    : (client?.rate || info.bodyRate);
  const split = payerSplit(job, client, info.tax);
  const owing = balanceOf(job, info.tax);

  const vlabel = `${job.v.year} ${job.v.make} ${job.v.model}`;

  const addFiles = async (files) => {
    if (!files.length) return;
    const label = stamp();
    setUploading(files.length);

    setUploading(0);
    if (!added.length) return;
    update({ ...job, photos: [...job.photos, ...added] },

    toast(`${added.length} photo${added.length > 1 ? "s" : ""} saved`);
  };

  const onPick = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    await addFiles(files);
  };

  const dropPhoto = async (p) => {
    await removePhoto(p);
    update({ ...job, photos: job.photos.filter((x) => x.id !== p.id) });
  };

  const saveLine = (l) => {
    const exists = job.est.lines.some((x) => x.id === l.id);
    update({ ...job, est: { ...job.est, lines: exists ? job.est.lines.map((x) => (x.id === l.id ? l : x)) : [...job.est.lines, l] } });
    setEditLine(undefined); toast(exists ? "Line saved" : "Line added");
  };

  const setPartState = (id, ps) => {
    const lines = job.est.lines.map((l) => (l.id === id ? { ...l, ps } : l));
    const part = lines.find((l) => l.id === id);
    const hold = lines.some((l) => l.t === "part" && l.ps === "backorder");
    update({ ...job, est: { ...job.est, lines }, hold },
      { kind: "parts", title: `${part.d} — ${PART_STATES.find((p) => p.id === ps).label.toLowerCase()}`,
        body: `${vlabel}${ps === "backorder" ? ". Job is now on hold." : ""}`, toClient: ps === "backorder" || ps === "received" });
  };

  const noteCount = job.notes.length + (job.clientNotes || []).length;
  const TABS = [["work", "Work"], ["photos", `Photos ${job.photos.length}`], ["parts", `Parts ${parts.length}`],
    ["notes", `Notes ${noteCount || ""}`.trim()], ["msgs", "Messages"], ["money", owner ? "Estimate" : "My pay"]];

  return (
    <>
      <div className="bar">
        <button onClick={back} style={{ fontSize: 14, color: "var(--muted)", marginBottom: 8 }}>‹ Shop Floor</button>
        <div style={{ display: "flex", gap: 11, alignItems: "center", minWidth: 0 }}>
          <span className="swatch" style={{ background: job.v.color, width: 34, height: 34 }} />
          <div style={{ minWidth: 0 }}>
            <h1 style={{ fontSize: 21 }}>{vlabel}</h1>
            <p className="sub">
              {job.ro}{job.stockNo ? ` · stock ${job.stockNo}` : ""} · {client?.name || "No client"}
            </p>
          </div>
        </div>
        <div className="seg" style={{ marginTop: 14, marginBottom: 0 }}>
          {TABS.map(([k, l]) => <button key={k} data-on={tab === k ? "1" : "0"} onClick={() => setTab(k)}>{l}</button>)}
        </div>
      </div>

      <div className="pad">
        {(() => {
          const n = nextStep(job, me, info, client);
          if (!n || n.tab === tab) return null;
          return (
            <div className="nudge">
              <div className="nt">{n.title}</div>
              <div className="nw">{n.why}</div>
              <button className="btn" data-v="tape" onClick={() => setTab(n.tab)}>{n.cta}</button>
            </div>
          );
        })()}

        {tab === "work" && (
          <>
            <div className="card">
              <div className="row" style={{ marginBottom: 4 }}>
                <span style={{ fontWeight: 600, fontSize: 17 }}>{stageNow(job).label}</span>
                <span className="chip">{typeOf(job).label}</span>
              </div>
              <div className="row" style={{ marginBottom: 10, fontSize: 13, color: "var(--muted)" }}>
                <span className="cond" style={{ fontSize: 14 }}>Step {sIdx(job) + 1} of {stagesOf(job).length}</span>
                <span>In since {job.dropped} · due {job.promised}</span>
              </div>
              <div className="stages">
                {stagesOf(job).map((s, i) => {
                  const cur = sIdx(job);
                  const st = i < cur ? "done" : i === cur ? (job.hold ? "hold" : "now") : "next";
                  return (
                    <button key={s.id} data-s={st} aria-current={i === cur ? "step" : undefined}

                      aria-label={s.label}>
                      <span className="bark">{st === "done" ? "✓" : st === "hold" ? "!" : st === "now" ? "●" : ""}</span>
                      <span className="cap cond">{s.label}</span>
                    </button>
                  );
                })}
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
                <button className="btn" data-v="tape" disabled={isLast(job)}
                  onClick={() => {
                    const next = stagesOf(job)[Math.min(sIdx(job) + 1, stagesOf(job).length - 1)];
                    update({ ...job, stage: next.id },
                      { kind: "stage", title: `${job.v.model} moved to ${next.label}`, body: `${vlabel} · ${job.ro}`, toClient: true });
                    toast("Everyone on the job was notified");
                  }}>
                  {isLast(job) ? "Ready for pickup" : `Move to ${stagesOf(job)[sIdx(job) + 1].label}`}
                </button>
                <button className="btn" data-v={job.hold ? "ghost" : "quiet"} style={{ width: 106 }}
                  onClick={() => update({ ...job, hold: !job.hold },
                    { kind: "alert", title: job.hold ? `${job.v.model} off hold` : `${job.v.model} put on hold`, body: `${vlabel} · ${job.ro}`, toClient: true })}>
                  {job.hold ? "Clear hold" : "Hold"}
                </button>
              </div>
            </div>

            {(job.requested?.length > 0 || owner) && (
              <>
                <div className="head">What it's in for</div>
                <div className="card">
                  {owner ? (
                    <>
                      <div className="chips" style={{ marginBottom: 4 }}>
                        {SERVICES[typeOf(job).id].map((name) => {
                          const on = (job.requested || []).includes(name);
                          return (
                            <button key={name} data-on={on ? "1" : "0"}
                              onClick={() => update({ ...job, requested: on
                                ? job.requested.filter((x) => x !== name)
                                : [...(job.requested || []), name] })}>
                              {name}
                            </button>
                          );
                        })}
                      </div>
                      <p className="sub" style={{ margin: 0 }}>
                        Tap to add or remove. Handy when the customer mentions something else at the counter.
                      </p>
                    </>
                  ) : (
                    <div style={{ fontSize: 14.5, lineHeight: 1.5 }}>
                      {(job.requested || []).join(" · ") || "Nothing listed. Check the notes."}
                    </div>
                  )}
                </div>
              </>

            {typeOf(job).id === "mechanical" && (
              <>

                      <textarea className="field" rows={2} value={job.ccc?.[k] || ""}

                  </p>
                </div>

                        claim: pp.id === "insurance" ? (job.claim || { insurer: "", no: "", adjuster: "", deductible: 0 }) : job.claim,
                        warranty: pp.id === "warranty" ? (job.warranty || { maker: job.v.make, campaign: "", claimNo: "", authNo: "", rate: info.warrantyRate }) : job.warranty,
                      })}>{pp.label}</button>

                </div>
              ) : (
                <div style={{ fontWeight: 600, marginBottom: 10 }}>{payerOf(job).label}</div>

              {job.payer === "insurance" && owner && (
                <>
                  <div style={{ display: "flex", gap: 8 }}>
                    <div style={{ flex: 1 }}><span className="lab">Carrier</span>
                      <input className="field" placeholder="State Farm" value={job.claim?.insurer || ""}

                    <div style={{ flex: 1 }}><span className="lab">Deductible</span>
                      <input className="field" inputMode="decimal" value={job.claim?.deductible ?? ""}
                        onChange={(e) => update({ ...job, claim: { ...job.claim, deductible: +e.target.value.replace(/[^\d.]/g, "") || 0 } })} /></div>
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <div style={{ flex: 1 }}><span className="lab">Claim number</span>
                      <input className="field" value={job.claim?.no || ""}
                        onChange={(e) => update({ ...job, claim: { ...job.claim, no: e.target.value } })} /></div>
                    <div style={{ flex: 1 }}><span className="lab">Adjuster</span>
                      <input className="field" value={job.claim?.adjuster || ""}
                        onChange={(e) => update({ ...job, claim: { ...job.claim, adjuster: e.target.value } })} /></div>
                  </div>
                  <p className="sub" style={{ margin: "-2px 0 0" }}>
                    The carrier is billed for everything above the deductible. The customer owes the deductible on delivery.
                  </p>
                </>
              )}

              {job.payer === "warranty" && owner && (
                <>
                  <div style={{ display: "flex", gap: 8 }}>
                    <div style={{ flex: 1 }}><span className="lab">Manufacturer</span>
                      <input className="field" value={job.warranty?.maker || ""}
                        onChange={(e) => update({ ...job, warranty: { ...job.warranty, maker: e.target.value } })} /></div>
                    <div style={{ flex: 1 }}><span className="lab">Warranty rate /hr</span>
                      <input className="field" inputMode="decimal" value={job.warranty?.rate ?? info.warrantyRate}
                        onChange={(e) => update({ ...job, warranty: { ...job.warranty, rate: +e.target.value.replace(/[^\d.]/g, "") || 0 } })} /></div>
                  </div>
                  <span className="lab">Recall or campaign number</span>
                  <input className="field" placeholder="23V-411 / Toyota 23TB05" value={job.warranty?.campaign || ""}
                    onChange={(e) => update({ ...job, warranty: { ...job.warranty, campaign: e.target.value } })} />
                  <div style={{ display: "flex", gap: 8 }}>
                    <div style={{ flex: 1 }}><span className="lab">Claim number</span>
                      <input className="field" value={job.warranty?.claimNo || ""}
                        onChange={(e) => update({ ...job, warranty: { ...job.warranty, claimNo: e.target.value } })} /></div>
                    <div style={{ flex: 1 }}><span className="lab">Authorization</span>
                      <input className="field" value={job.warranty?.authNo || ""}
                        onChange={(e) => update({ ...job, warranty: { ...job.warranty, authNo: e.target.value } })} /></div>
                  </div>
                  <p className="sub" style={{ margin: "-2px 0 0" }}>
                    Nothing is billed to the customer. Labor defaults to the warranty rate instead of your retail rate.
                  </p>
                </>
              )}

              {!owner && job.payer === "warranty" && job.warranty?.campaign && (
                <div className="line"><span style={{ color: "var(--muted)", width: 88 }}>Campaign</span>
                  <span style={{ fontWeight: 500 }}>{job.warranty.campaign}</span></div>
              )}
            </div>

            <div className="head">{client?.kind === "dealer" ? "Dealership" : "Customer"}</div>
            <div className="card">
              {[["Name", client?.name], ["Contact", client?.contact], ["Phone", client?.phone], ["Email", client?.email],
                client?.kind === "dealer" ? ["Terms", client?.terms] : null,
                client?.kind === "dealer" && client?.rate ? ["Labor rate", `${usd(client.rate)}/hr`] : null]
                .filter(Boolean).filter(([, v]) => v).map(([k, v]) => (
                <div key={k} className="line">
                  <span style={{ color: "var(--muted)", width: 88, flex: "none" }}>{k}</span>
                  <span style={{ fontWeight: 500, wordBreak: "break-word" }}>{v}</span>
                </div>
              ))}
            </div>
          </>
        )}

        {tab === "photos" && (
          <>
            {job.photos.length === 0 && <div className="card" style={{ textAlign: "center", padding: 30, color: "var(--muted)" }}>No photos yet. Shoot the damage before you touch anything.</div>}
            <div className="grid3" style={{ marginBottom: 14 }}>
              {job.photos.map((p) => {
                const src = p.url || photoUrls[p.id];
                return (
                  <div className="photo" key={p.id}>
                    {src
                      ? <img src={src} alt={p.label} onClick={() => setViewing({ src, label: p.label })} />
                      : p.css
                        ? <div style={{ width: "100%", height: "100%", background: p.css }} />
                        : <div className="spin">Loading…</div>}
                    <button className="x" onClick={() => setKilling(p)} aria-label="Delete photo">×</button>
                    <span className="tag">{p.label}</span>
                  </div>
                );
              })}
              {uploading > 0 && Array.from({ length: uploading }).map((_, i) => (
                <div className="photo" key={`up${i}`}><div className="spin">Saving…</div></div>
              ))}
            </div>

            <input ref={fileRef} type="file" accept="image/*" multiple onChange={onPick} style={{ display: "none" }} />
            <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
              <button className="btn" data-v="tape" onClick={() => setCamOpen(true)}>Take photos</button>
              <button className="btn" data-v="quiet" onClick={() => fileRef.current?.click()}>Choose from library</button>
            </div>
            <p className="sub" style={{ marginTop: 10 }}>
              The camera stays open so you can shoot the whole teardown in one go. Every shot is stamped
              with the stage it was taken in, which is what makes the record hold up with an insurer.
            </p>
          </>
        )}

        {tab === "parts" && (
          <>
            {parts.length === 0 ? (
              <div className="card" style={{ textAlign: "center", padding: 30, color: "var(--muted)" }}>No parts on this job. Add them from the estimate.</div>
            ) : parts.map((l) => {
              const st = PART_STATES.find((p) => p.id === (l.ps || "needed"));
              return (
                <div className="card" key={l.id}>
                  <div className="row" style={{ marginBottom: 10 }}>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontWeight: 600, fontSize: 15 }}>{l.d}</div>
                      <div style={{ fontSize: 12.5, color: "var(--muted)" }}>{l.q} × {usd2(l.r)}{l.eta ? ` · expected ${l.eta}` : ""}</div>
                    </div>
                    <span className="chip" data-t={st.t}>{st.label}</span>

                  <div className="seg" style={{ margin: 0 }}>
                    {PART_STATES.map((p) => <button key={p.id} data-on={(l.ps || "needed") === p.id ? "1" : "0"} onClick={() => setPartState(l.id, p.id)}>{p.label}</button>)}

              <div className="card" key={n.id}>

                  <span style={{ fontSize: 12, color: "var(--muted)" }}>{n.at}</span>

            <button className="btn" disabled={!note.trim()} onClick={() => {

          <>

                  {job.est.status === "approved" ? "Approved" : job.est.status === "sent" ? "Waiting on client" : "Draft"}
                </span>
              </div>
              {job.est.lines.length === 0 && <div style={{ color: "var(--muted)", fontSize: 14, padding: "8px 0" }}>Nothing on this estimate yet.</div>}
              {job.est.lines.map((l) => (
                <button key={l.id} className="line" style={{ width: "100%", textAlign: "left", alignItems: "flex-start" }} onClick={() => setEditLine(l)}>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 500 }}>{l.d}</div>
                    <div style={{ fontSize: 12, color: "var(--muted)" }}>
                      {l.q} {unit(l.t)} × {usd2(l.r)}{l.who ? ` · ${staff.find((s) => s.id === l.who)?.name.split(" ")[0]}` : ""}{l.supp ? " · supplement" : ""}
                    </div>
                  </div>
                  <span className="money">{usd2(l.q * l.r)}</span>
                </button>
              ))}
              <button className="btn sm" data-v="quiet" style={{ marginTop: 12 }} onClick={() => setEditLine(null)}>Add a line</button>
              <hr className="hr" />
              <div className="line" style={{ color: "var(--muted)" }}><span style={{ flex: 1 }}>Subtotal</span><span className="money">{usd2(subtotal(job.est))}</span></div>
              <div className="line" style={{ color: "var(--muted)" }}><span style={{ flex: 1 }}>Sales tax {info.tax}%</span><span className="money">{usd2(subtotal(job.est) * info.tax / 100)}</span></div>
              <div className="row" style={{ paddingTop: 12 }}>
                <span style={{ fontWeight: 600 }}>Total</span><span className="money" style={{ fontSize: 26 }}>{usd2(tot)}</span>
              </div>
              {job.est.approvedBy && <p className="sub" style={{ marginTop: 10 }}>Approved by {job.est.approvedBy} on {job.est.approvedAt}.</p>}
            </div>

            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <button className="btn sm" data-v="quiet" disabled={!job.est.lines.length} onClick={() => setDoc("estimate")}>Estimate document</button>
              <button className="btn sm" data-v="quiet" disabled={!job.est.lines.length} onClick={() => setDoc("invoice")}>Invoice document</button>
            </div>

            <div className="head">What the crew earns on this</div>
            <div className="card">
              {po.rows.length === 0 && <div style={{ color: "var(--muted)", fontSize: 14 }}>No crew pay booked yet.</div>}
              {po.rows.map((r) => (
                <div key={r.id} className="line">
                  <span className="avatar" style={{ width: 26, height: 26, fontSize: 10 }}>{r.s.init}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontWeight: 500 }}>{r.s.name}</div>
                    <div style={{ fontSize: 12, color: "var(--muted)" }}>{r.basis}</div>
                  </div>
                  <span className="money">{usd2(r.amt)}</span>
                </div>
              ))}
              <div className="line" style={{ color: "var(--muted)" }}><span style={{ flex: 1 }}>Processing fee</span><span className="money">−{usd2(po.fee)}</span></div>
              <div className="line"><span style={{ flex: 1, fontWeight: 600 }}>Shop keeps</span><span className="money" style={{ fontSize: 18 }}>{usd2(po.shop)}</span></div>
            </div>

            {job.est.status === "draft" && (
              <button className="btn" disabled={!job.est.lines.length} onClick={() => setDoc("estimate")}>
                Send to {(client?.contact || "client").split(" ")[0]} for approval
              </button>
            )}
            {job.est.status === "sent" && (
              <button className="btn" data-v="ghost" onClick={() => update(
                { ...job, est: { ...job.est, status: "approved", approvedBy: client?.contact, approvedAt: now() } },
                { kind: "money", title: `${job.v.model} estimate approved`, body: `${client?.contact} approved ${usd2(tot)}.`, toClient: false })}>
                Record approval
              </button>
            )}
            {job.est.status === "approved" && (
              <>
                <div className="head">Billing</div>
                <div className="card">
                  {split.map((r) => {
                    const paid = (job.receipts || []).filter((x) => x.from === r.from).reduce((a, x) => a + (+x.amount || 0), 0);
                    const left = Math.max(0, r.amount - paid);
                    return (
                      <div key={r.from} className="line">
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontWeight: 500 }}>{r.label}</div>
                          <div style={{ fontSize: 12, color: "var(--muted)" }}>
                            {usd2(r.amount)} billed{paid > 0 ? ` · ${usd2(paid)} received` : ""}
                          </div>
                        </div>
                        <span className="chip" data-t={left < 0.005 ? "ok" : "warn"}>
                          {left < 0.005 ? "Settled" : `${usd2(left)} due`}
                        </span>
                      </div>
                    );
                  })}
                  {(job.receipts || []).length > 0 && (
                    <>
                      <hr className="hr" />
                      {job.receipts.map((r) => (
                        <div key={r.id} className="line" style={{ fontSize: 13 }}>
                          <span style={{ flex: 1, color: "var(--muted)" }}>
                            {r.when} · {PAY_METHODS.find((m) => m.id === r.method)?.label || r.method}
                            {r.ref ? ` #${r.ref}` : ""}
                          </span>
                          <span className="money">{usd2(r.amount)}</span>
                        </div>
                      ))}
                    </>
                  )}
                  <div className="row" style={{ paddingTop: 12 }}>
                    <span style={{ fontWeight: 600 }}>{owing < 0.005 ? "Paid in full" : "Outstanding"}</span>
                    <span className="money" style={{ fontSize: 22, color: owing < 0.005 ? "var(--go)" : "var(--text)" }}>
                      {usd2(owing)}
                    </span>
                  </div>
                </div>
                {owing > 0.004 && <button className="btn" onClick={() => setPayOpen(true)}>Record a payment</button>}
              </>
            )}

            {owing < 0.005 && job.est.status === "approved" && (
              <div className="card">
                <div style={{ fontWeight: 600, marginBottom: 10 }}>Crew payouts</div>
                {po.rows.map((r) => (
                  <div key={r.id} className="line">
                    <span className="avatar" style={{ width: 24, height: 24, fontSize: 10 }}>{r.s.init}</span>
                    <span style={{ flex: 1 }}>{r.s.name} → {r.s.bank || "no account"}</span>
                    <span className="money">{usd2(r.amt)}</span>
                  </div>
                ))}
                <div className="line"><span style={{ flex: 1, fontWeight: 600 }}>Shop → {info.bank}</span><span className="money">{usd2(po.shop)}</span></div>
              </div>
            )}

            <div className="head">Wording on this invoice</div>
            <div className="card">
              <span className="lab">Extra note for this job only</span>
              <textarea className="field" rows={2} style={{ marginBottom: 6 }}
                placeholder="Customer supplied the mirror. Aftermarket parts used at their request."
                value={job.invoiceNote || ""} onChange={(e) => update({ ...job, invoiceNote: e.target.value })} />
              <p className="sub" style={{ margin: 0 }}>
                Your guarantee and payment terms print on every invoice automatically. Edit those in Settings.
              </p>
            </div>
          </>
        )}
      </div>

      {payOpen && (
        <PaymentSheet job={job} client={client} taxPct={info.tax} onClose={() => setPayOpen(false)}
          onSave={(receipt) => {
            const receipts = [...(job.receipts || []), receipt];
            const paidAll = totalOf(job.est, info.tax) - receipts.reduce((a, r) => a + (+r.amount || 0), 0) < 0.005;
            update({ ...job, receipts, inv: { status: paidAll ? "paid" : "partial", when: receipt.when, method: receipt.method } },
              { kind: "money", title: `${usd2(receipt.amount)} received on ${job.ro}`,
                body: `${split.find((x) => x.from === receipt.from)?.label || receipt.from}${paidAll ? " — paid in full." : ""}`,
                toClient: false });
            setPayOpen(false);
            toast(paidAll ? "Paid in full" : "Payment recorded");
          }} />
      )}
      {camOpen && (
        <CameraSheet stageLabel={stageNow(job).label} onClose={() => setCamOpen(false)}
          onDone={(blobs) => addFiles(blobs)} />
      )}
      {viewing && <Lightbox src={viewing.src} label={viewing.label} onClose={() => setViewing(null)} />}

      {killing && (
        <div className="sheet" onClick={() => setKilling(null)}>
          <div onClick={(e) => e.stopPropagation()}>
            <h1 style={{ fontSize: 21, margin: "0 0 8px" }}>Delete this photo?</h1>
            <p className="sub" style={{ marginBottom: 14 }}>
              {killing.label}. It goes for good, and the client sees it disappear too.
              Photos are what settle disputes later, so keep it unless it's a duplicate.
            </p>
            <button className="btn" data-v="danger"
              onClick={async () => { const t = killing; setKilling(null); await dropPhoto(t); toast("Photo deleted"); }}>
              Delete it
            </button>
            <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={() => setKilling(null)}>Keep it</button>
          </div>
        </div>
      )}

      {doc && (
        <DocSheet job={job} client={client} info={info} kind={doc} toast={toast} onClose={() => setDoc(null)}
          onSent={(how) => {
            if (doc === "estimate" && job.est.status === "draft") {
              update({ ...job, est: { ...job.est, status: "sent", sentAt: now() } },
                { kind: "money", title: `Estimate sent for the ${job.v.model}`, body: `${usd2(tot)} sent to ${client?.contact}.`, toClient: true });
            }
            toast(how === "email" ? "Opening your mail app" : how === "text" ? "Opening your messages app" : "Shared");
          }} />
      )}

      {editLine !== undefined && (
        <LineEditor line={editLine} staff={staff} defaultRate={laborRate} jobType={job.type} onSave={saveLine} onClose={() => setEditLine(undefined)}
          onDelete={() => { update({ ...job, est: { ...job.est, lines: job.est.lines.filter((x) => x.id !== editLine.id) } }); setEditLine(undefined); toast("Line removed"); }} />
      )}

      {crewOpen && (
        <div className="sheet" onClick={() => setCrewOpen(false)}>
          <div onClick={(e) => e.stopPropagation()}>
            <h1 style={{ fontSize: 22, margin: "0 0 16px" }}>Crew and pay</h1>
            {staff.filter((s) => s.role === "tech" && s.active !== false).map((s) => {
              const on = job.crew.includes(s.id);
              return (
                <div className="card" key={s.id}>
                  <button style={{ width: "100%" }} onClick={() => update(
                    { ...job, crew: on ? job.crew.filter((x) => x !== s.id) : [...job.crew, s.id] },
                    on ? null : { kind: "alert", title: `${s.name.split(" ")[0]} added to the ${job.v.model}`, body: `${vlabel} · due ${job.promised}`, toClient: false })}>
                    <div className="row">
                      <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                        <span className="avatar">{s.init}</span>
                        <div style={{ textAlign: "left" }}>
                          <div style={{ fontWeight: 600 }}>{s.name}</div>
                          <div style={{ fontSize: 12.5, color: "var(--muted)" }}>
                            {s.payType === "hourly" ? `${usd(s.hourlyRate)}/hr` : s.payType === "percent" ? `${s.percent}% of labor` : `${usd(s.flat)} flat`}
                          </div>
                        </div>
                      </div>
                      <span className="chip" data-t={on ? "ok" : ""}>{on ? "On" : "Off"}</span>
                    </div>
                  </button>
                  {on && s.payType === "flat" && (
                    <><hr className="hr" /><span className="lab">Flat amount for this job</span>
                    <input className="field" style={{ marginBottom: 0 }} inputMode="decimal" value={job.flatPay?.[s.id] ?? s.flat}
                      onChange={(e) => update({ ...job, flatPay: { ...(job.flatPay || {}), [s.id]: +e.target.value.replace(/[^\d.]/g, "") || 0 } })} /></>
                  )}
                </div>
              );
            })}
            <button className="btn" style={{ marginTop: 6 }} onClick={() => setCrewOpen(false)}>Done</button>
          </div>
        </div>
      )}
    </>
  );
}
