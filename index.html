                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontWeight: 500 }}>{r.label}</div>
                          <div style={{ fontSize: 12, color: "var(--muted)" }}>
                            {usd2(r.amount)} billed{paid > 0 ? ` · ${usd2(paid)} received` : ""}
                          </div>
                        </div>
                        <span className="chip" data-t={left < 0.005 ? "ok" : "warn"}>
                          {left < 0.005 ? "Settled" : `${usd2(left)} due`}
                        </span>
                      </div>
                    );
                  })}
                  {(job.receipts || []).length > 0 && (
                    <>
                      <hr className="hr" />
                      {job.receipts.map((r) => (
                        <div key={r.id} className="line" style={{ fontSize: 13 }}>
                          <span style={{ flex: 1, color: "var(--muted)" }}>
                            {r.when} · {PAY_METHODS.find((m) => m.id === r.method)?.label || r.method}
                            {r.ref ? ` #${r.ref}` : ""}
                          </span>
                          <span className="money">{usd2(r.amount)}</span>
                        </div>
                      ))}
                    </>
                  )}
                  <div className="row" style={{ paddingTop: 12 }}>
                    <span style={{ fontWeight: 600 }}>{owing < 0.005 ? "Paid in full" : "Outstanding"}</span>
                    <span className="money" style={{ fontSize: 22, color: owing < 0.005 ? "var(--go)" : "var(--text)" }}>
                      {usd2(owing)}
                    </span>
                  </div>
                </div>
                {owing > 0.004 && <button className="btn" onClick={() => setPayOpen(true)}>Record a payment</button>}
              </>
            )}

            {owing < 0.005 && job.est.status === "approved" && (
              <div className="card">
                <div style={{ fontWeight: 600, marginBottom: 10 }}>Crew payouts</div>
                {po.rows.map((r) => (
                  <div key={r.id} className="line">
                    <Avatar person={r.s} size={24} />
                    <span style={{ flex: 1 }}>{r.s.name} → {r.s.bank || "no account"}</span>
                    <span className="money">{usd2(r.amt)}</span>
                  </div>
                ))}
                <div className="line"><span style={{ flex: 1, fontWeight: 600 }}>Shop → {info.bank}</span><span className="money">{usd2(po.shop)}</span></div>
              </div>
            )}

            <div className="head">Wording on this invoice</div>
            <div className="card">
              <span className="lab">Extra note for this job only</span>
              <textarea className="field" rows={2} style={{ marginBottom: 6 }}
                placeholder="Customer supplied the mirror. Aftermarket parts used at their request."
                value={job.invoiceNote || ""} onChange={(e) => update({ ...job, invoiceNote: e.target.value })} />
              <p className="sub" style={{ margin: 0 }}>
                Your guarantee and payment terms print on every invoice automatically. Edit those in Settings.
              </p>
            </div>
          </>
        )}
      </div>

      {importOpen && (
        <ImportSheet job={job} info={info} integrations={integrations} toast={toast}
          onClose={() => setImportOpen(false)}
          onApply={(found, lines) => {
            const v = found.vehicle || {}, c = found.claim || {};
            update({
              ...job,
              v: { ...job.v,
                year: v.year || job.v.year, make: v.make || job.v.make, model: v.model || job.v.model,
                vin: v.vin || job.v.vin, plate: v.plate || job.v.plate, miles: v.miles || job.v.miles,
                paint: v.paint || job.v.paint },
              payer: c.insurer ? "insurance" : job.payer,
              claim: c.insurer ? { ...job.claim, insurer: c.insurer, no: c.no || "",
                                   adjuster: c.adjuster || "", deductible: c.deductible || 0 } : job.claim,
              est: { ...job.est, lines: [...job.est.lines, ...lines] },
            }, { kind: "money", title: `Estimate imported on the ${job.v.model}`,
                 body: `${lines.length} lines from ${found.source}.`, toClient: false });
            setImportOpen(false);
            toast(`${lines.length} lines added`);
          }} />
      )}
      {payOpen && (
        <PaymentSheet job={job} client={client} taxPct={info.tax} onClose={() => setPayOpen(false)}
          onSave={(receipt) => {
            const receipts = [...(job.receipts || []), receipt];
            const paidAll = totalOf(job.est, info.tax) - receipts.reduce((a, r) => a + (+r.amount || 0), 0) < 0.005;
            update({ ...job, receipts, inv: { status: paidAll ? "paid" : "partial", when: receipt.when, method: receipt.method } },
              { kind: "money", title: `${usd2(receipt.amount)} received on ${job.ro}`,
                body: `${split.find((x) => x.from === receipt.from)?.label || receipt.from}${paidAll ? " — paid in full." : ""}`,
                toClient: false });
            setPayOpen(false);
            toast(paidAll ? "Paid in full" : "Payment recorded");
          }} />
      )}
      {camOpen && (
        <CameraSheet stageLabel={stageNow(job).label} onClose={() => setCamOpen(false)}
          onDone={(blobs) => addFiles(blobs)} />
      )}
      {viewing && <Lightbox src={viewing.src} label={viewing.label} onClose={() => setViewing(null)} />}

      {killing && (
        <div className="sheet" onClick={() => setKilling(null)}>
          <div onClick={(e) => e.stopPropagation()}>
            <h1 style={{ fontSize: 21, margin: "0 0 8px" }}>Delete this photo?</h1>
            <p className="sub" style={{ marginBottom: 14 }}>
              {killing.label}. It goes for good, and the client sees it disappear too.
              Photos are what settle disputes later, so keep it unless it's a duplicate.
            </p>
            <button className="btn" data-v="danger"
              onClick={async () => { const t = killing; setKilling(null); await dropPhoto(t); toast("Photo deleted"); }}>
              Delete it
            </button>
            <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={() => setKilling(null)}>Keep it</button>
          </div>
        </div>
      )}

      {doc && (
        <DocSheet job={job} client={client} info={info} kind={doc} toast={toast} onClose={() => setDoc(null)}
          onSent={(how) => {
            if (doc === "estimate" && job.est.status === "draft") {
              update({ ...job, est: { ...job.est, status: "sent", sentAt: now() } },
                { kind: "money", title: `Estimate sent for the ${job.v.model}`, body: `${usd2(tot)} sent to ${client?.contact}.`, toClient: true });
            }
            toast(how === "email" ? "Opening your mail app" : how === "text" ? "Opening your messages app" : "Shared");
          }} />
      )}

      {editLine !== undefined && (
        <LineEditor line={editLine} staff={staff} defaultRate={laborRate} jobType={job.type}
          shop={shopAll} job={job} integrations={integrations} onSave={saveLine} onClose={() => setEditLine(undefined)}
          onDelete={() => { update({ ...job, est: { ...job.est, lines: job.est.lines.filter((x) => x.id !== editLine.id) } }); setEditLine(undefined); toast("Line removed"); }} />
      )}

      {crewOpen && (
        <div className="sheet" onClick={() => setCrewOpen(false)}>
          <div onClick={(e) => e.stopPropagation()}>
            <h1 style={{ fontSize: 22, margin: "0 0 16px" }}>Crew and pay</h1>
            {staff.filter((s) => s.role === "tech" && s.active !== false).map((s) => {
              const on = job.crew.includes(s.id);
              return (
                <div className="card" key={s.id}>
                  <button style={{ width: "100%" }} onClick={() => update(
                    { ...job, crew: on ? job.crew.filter((x) => x !== s.id) : [...job.crew, s.id] },
                    on ? null : { kind: "alert", title: `${s.name.split(" ")[0]} added to the ${job.v.model}`, body: `${vlabel} · due ${job.promised}`, toClient: false })}>
                    <div className="row">
                      <div style={{ display: "flex", gap: 10, alignItems: "center" }}>
                        <Avatar person={s} />
                        <div style={{ textAlign: "left" }}>
                          <div style={{ fontWeight: 600 }}>{s.name}</div>
                          <div style={{ fontSize: 12.5, color: "var(--muted)" }}>
                            {s.payType === "hourly" ? `${usd(s.hourlyRate)}/hr` : s.payType === "percent" ? `${s.percent}% of labor` : `${usd(s.flat)} flat`}
                          </div>
                        </div>
                      </div>
                      <span className="chip" data-t={on ? "ok" : ""}>{on ? "On" : "Off"}</span>
                    </div>
                  </button>
                  {on && s.payType === "flat" && (
                    <><hr className="hr" /><span className="lab">Flat amount for this job</span>
                    <input className="field" style={{ marginBottom: 0 }} inputMode="decimal" value={job.flatPay?.[s.id] ?? s.flat}
                      onChange={(e) => update({ ...job, flatPay: { ...(job.flatPay || {}), [s.id]: +e.target.value.replace(/[^\d.]/g, "") || 0 } })} /></>
                  )}
                </div>
              );
            })}
            <button className="btn" style={{ marginTop: 6 }} onClick={() => setCrewOpen(false)}>Done</button>
          </div>
        </div>
      )}
    </>
  );
}

/* ══════════════════  APP  ══════════════════ */

function ShopfloorPros() {
  const [phase, setPhase] = useState("loading");   // loading | auth | noshop | ready
  const [shop, setShop] = useState(null);          // this shop's whole record
  const [shopId, setShopId] = useState(null);
  const [account, setAccount] = useState(null);    // the Supabase user
  const [inviteLink, setInviteLink] = useState(null);
  const [invite, setInvite] = useState(null);
  const [payoutOpen, setPayoutOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  const [integrations, setIntegrations] = useState(null);
  const [intOpen, setIntOpen] = useState(false);
  const [reportRange, setReportRange] = useState("month");
  const [taxOpen, setTaxOpen] = useState(false);
  const [schedWeek, setSchedWeek] = useState(todayISO());
  const [schedDay, setSchedDay] = useState(todayISO());
  const [crewPay, setCrewPay] = useState(null);
  const [joinError, setJoinError] = useState("");
  const [draft, setDraft] = useState(null);   // unsaved Settings edits
  const [confirming, setConfirming] = useState(null);
  const [intake, setIntake] = useState(null);
  const [dealerLink, setDealerLink] = useState(null);
  const [view, setView] = useState("home");
  const [openId, setOpenId] = useState(null);
  const [filter, setFilter] = useState("all");
  const [sheet, setSheet] = useState(null);
  const [msg, setMsg] = useState("");
  const [editContact, setEditContact] = useState(null);
  const [editStaff, setEditStaff] = useState(null);
  const [contactFilter, setContactFilter] = useState("dealer");
  const [ticket, setTicket] = useState(null);
  const [portalOf, setPortalOf] = useState(null);
  const logoRef = useRef(null);

  const blankVehicle = { year: "", make: "", model: "", trim: "", vin: "", plate: "", miles: "", color: "#8C9196", body: "", engine: "", drive: "", paint: "" };
  /* type: collision | mechanical | maintenance */
  const [nv, setNv] = useState({ ...blankVehicle, type: "collision", payer: "customer", kind: "private", clientId: "", promised: "" });
  const [picked, setPicked] = useState([]);
  const [brief, setBrief] = useState("");

  /* ── boot: follow the Supabase session ── */
  useEffect(() => {
    if (!sb) { setPhase("config"); return; }
    let alive = true;
    const handle = (session) => { if (alive) resolve(session); };
    sb.auth.getSession().then(({ data }) => handle(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, session) => handle(session));
    return () => { alive = false; sub?.subscription?.unsubscribe(); };
  }, []);

  async function resolve(session) {
    const token = new URLSearchParams(window.location.search).get("join");

    // Someone arriving on an invite link has no account yet, so show them
    // who invited them instead of a bare sign-in box.
    if (token) {
      const real = session && session.user?.email && !session.user?.is_anonymous;
      if (!real) {
        const { data } = await sb.rpc("staff_invite_peek", { p_token: token });
        if (data?.ok) { setPhase("join"); setInvite({ ...data, token }); return; }
        setPhase("auth");
        setJoinError(data?.why === "used"
          ? "That invite has already been used. Ask the shop to send another."
          : "That invite link isn't valid. Ask the shop to send another.");
        window.history.replaceState({}, "", window.location.pathname);
        return;
      }
    }

    if (!session) { setPhase("auth"); setShop(null); setAccount(null); return; }
    setAccount(session.user);

    if (token) {
      try { await sb.rpc("accept_staff_invite", { invite: token }); } catch {}
      window.history.replaceState({}, "", window.location.pathname);
    }

    try {
      const id = await myShopId();
      if (!id) { setPhase("noshop"); return; }
      setShopId(id);

      let blob = await readBlob(id);
      if (!blob) {
        const { data: row } = await sb.from("shops").select("name,city").eq("id", id).maybeSingle();
        blob = blankShop(id, row?.name, row?.city, {
          id: session.user.id, name: session.user.email.split("@")[0], email: session.user.email,
        });
        await writeBlob(id, blob);
      }

      // make sure whoever just signed in exists in the staff list
      const email = session.user.email.toLowerCase();
      if (!blob.staff.some((x) => (x.email || "").toLowerCase() === email)) {
        const { data: srow } = await sb.from("staff").select("name,role,title").eq("id", session.user.id).maybeSingle();
        const name = srow?.name || email.split("@")[0];
        blob = { ...blob, staff: [...blob.staff, {
          id: session.user.id, name, email, role: srow?.role === "owner" ? "owner" : "tech",
          title: srow?.title || "Technician", init: initialsOf(name), bank: null, payout: "pending",
          payType: "hourly", hourlyRate: 34, percent: 45, flat: 150, mode: null,
        }] };
        await writeBlob(id, blob);
      }

      setShop(blob);
      setPhase("ready");
    } catch (e) {
      setPhase("noshop");
    }
  }

  const saveShop = async (next) => {
    setShop(next);
    try { await writeBlob(shopId, next); }
    catch (e) { setMsg("Couldn't save — " + e.message); setTimeout(() => setMsg(""), 4000); }
  };
  const toast = (t) => { setMsg(t); setTimeout(() => setMsg(""), 2400); };

  useEffect(() => {
    if (!shopId || integrations !== null) return;
    let dead = false;
    sb.rpc("my_integrations").then(({ data }) => { if (!dead) setIntegrations(data || {}); });
    return () => { dead = true; };
  }, [shopId, integrations]);

  // fetch payout status when the Team screen opens, not while rendering it
  useEffect(() => {
    if (view !== "team" || crewPay !== null) return;
    let dead = false;
    sb.rpc("crew_payout_status").then(({ data }) => { if (!dead) setCrewPay(data || []); });
    return () => { dead = true; };
  }, [view, crewPay]);

  const doSignIn = async (email, password) => {
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    if (error) throw new Error(friendly(error.message));
  };

  const doAcceptInvite = async (email, password, mode) => {
    await sb.auth.signOut();
    const { data, error } = mode === "up"
      ? await sb.auth.signUp({ email: email.trim(), password })
      : await sb.auth.signInWithPassword({ email: email.trim(), password });
    if (error) throw new Error(friendly(error.message));
    if (!data.session) throw new Error("Confirm your email, then open the link again.");
    const { error: e2 } = await sb.rpc("accept_staff_invite", { invite: invite.token });
    if (e2) throw new Error(e2.message);
    window.history.replaceState({}, "", window.location.pathname);
    await resolve((await sb.auth.getSession()).data.session);
  };

  const doSignUpShop = async (f) => {
    const { data, error } = await sb.auth.signUp({ email: f.email.trim(), password: f.pass });
    if (error) throw new Error(friendly(error.message));
    if (!data.session) throw new Error("Account made. Confirm your email, then sign in — or switch off email confirmation in Supabase.");
    const { data: newId, error: e2 } = await sb.rpc("create_shop_for_owner", {
      shop_name: f.shop.trim(), owner_name: f.name.trim(), shop_city: f.city?.trim() || null,
    });
    if (e2) throw new Error(e2.message);
    await writeBlob(newId, blankShop(newId, f.shop.trim(), f.city?.trim(), {
      id: data.user.id, name: f.name.trim(), email: f.email.trim().toLowerCase(),
    }));
    await resolve((await sb.auth.getSession()).data.session);
  };

  const doCreateShop = async (f) => {
    const { data: newId, error } = await sb.rpc("create_shop_for_owner", {
      shop_name: f.shop.trim(), owner_name: f.name.trim(), shop_city: f.city?.trim() || null,
    });
    if (error) throw new Error(error.message);
    await writeBlob(newId, blankShop(newId, f.shop.trim(), f.city?.trim(), {
      id: account.id, name: f.name.trim(), email: account.email.toLowerCase(),
    }));
    await resolve((await sb.auth.getSession()).data.session);
  };

  const doJoin = async (pasted) => {
    const m = pasted.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
    if (!m) throw new Error("That doesn't look like an invite link.");
    const { error } = await sb.rpc("accept_staff_invite", { invite: m[0] });
    if (error) throw new Error(error.message);
    await resolve((await sb.auth.getSession()).data.session);
  };

  const signOut = async () => { await sb.auth.signOut(); setOpenId(null); setView("home"); };

  const loadIntake = async () => {
    const { data, error } = await sb.rpc("my_intake");
    if (!error && data) setIntake(data);
  };
  const loadDealerLink = async () => {
    const { data, error } = await sb.rpc("my_dealer_link");
    if (!error && data) setDealerLink(data);
  };
  const portalBase = () =>
    `${window.location.origin}${window.location.pathname.replace(/[^/]*$/, "")}portal.html`;

  if (phase === "config") return <NeedsConfig />;
  if (phase === "loading") return <div className="bs plain" style={themeVars("gaz", "light")}><style>{CSS}</style><div className="pad" style={{ paddingTop: 60, color: "#657482" }}>Opening the shop…</div></div>;
  if (phase === "join") return <JoinShop invite={invite} onJoin={doAcceptInvite} />;
  if (phase === "auth") return <Auth onSignIn={doSignIn} onSignUpShop={doSignUpShop} notice={joinError}
    onReset={(email) => sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href })} />;
  if (phase === "noshop") return <NoShop email={account?.email} onCreate={doCreateShop} onJoin={doJoin} onSignOut={signOut} />;

  const me = shop.staff.find((x) => (x.email || "").toLowerCase() === (account?.email || "").toLowerCase()) || shop.staff[0];
  const owner = me.role === "owner";
  const info = shop.info;
  const mode = me.mode || info.mode || "light";
  const theme = THEMES[info.theme] || THEMES.gaz;
  const clientOf = (j) => shop.contacts.find((c) => c.id === j.clientId);

  const patch = (fields) => saveShop({ ...shop, ...fields });
  const setInfo = (k, v) => patch({ info: { ...info, [k]: v } });

  /* Typed settings go into a draft first, so nothing saves until you say so.
     Pickers like the theme and the logo still apply straight away. */
  const EDITABLE = ["name", "address", "city", "phone", "email", "bank",
                    "bodyRate", "paintRate", "mechRate", "detailRate", "warrantyRate", "tax", "guarantee", "lateTerms"];
  const field = (k) => (draft && k in draft ? draft[k] : info[k]);
  const setField = (k, v) => setDraft({ ...(draft || {}), [k]: v });
  const dirty = !!draft && EDITABLE.some((k) => k in draft && String(draft[k] ?? "") !== String(info[k] ?? ""));
  const saveSettings = () => {
    const nums = ["bodyRate", "paintRate", "mechRate", "detailRate", "warrantyRate", "tax"];
    const clean = { ...draft };
    nums.forEach((k) => { if (k in clean) clean[k] = +clean[k] || 0; });
    patch({ info: { ...info, ...clean } });
    setDraft(null);
    toast("Settings saved");
  };
  const discardSettings = () => { setDraft(null); toast("Changes discarded"); };
  const setMyMode = (m) => patch({ staff: shop.staff.map((s) => (s.id === me.id ? { ...s, mode: m } : s)) });

  /** Update a job and optionally raise a notification for everyone attached to it. */
  const update = (nextJob, notif) => {
    const jobs = shop.jobs.map((j) => (j.id === nextJob.id ? nextJob : j));
    const notifs = notif
      ? [buildNotif(shop, nextJob, { ...notif, actorId: me.id }), ...shop.notifs].slice(0, 60)
      : shop.notifs;
    patch({ jobs, notifs });
  };

  const myNotifs = shop.notifs.filter((n) => n.to.includes(me.id));
  const unreadCount = myNotifs.filter((n) => !n.read.includes(me.id)).length;
  const jobUnread = (jobId) => shop.notifs.some((n) => n.jobId === jobId && n.to.includes(me.id) && !n.read.includes(me.id));
  const markAllRead = () => patch({
    notifs: shop.notifs.map((n) => (n.to.includes(me.id) && !n.read.includes(me.id) ? { ...n, read: [...n.read, me.id] } : n)),
  });

  const visible = owner ? shop.jobs : shop.jobs.filter((j) => j.crew.includes(me.id));
  const job = visible.find((j) => j.id === openId);
  const shown = visible.filter((j) => {
    if (filter === "all") return true;
    if (filter === "hold") return j.hold;
    if (filter === "done") return isLast(j);
    if (JOB_TYPES.some((t) => t.id === filter)) return (j.type || "collision") === filter;
    return clientOf(j)?.kind === filter;
  });
  const unpaid = visible.reduce((a, j) => a + balanceOf(j, info.tax), 0);
  const activeCount = visible.filter((j) => !isLast(j)).length;
  const myRow = (j) => payouts(j, shop.staff, info).rows.find((r) => r.id === me.id);
  const myEarned = shop.jobs.reduce((a, j) => a + (myRow(j)?.amt || 0), 0);
  const myPaid = shop.jobs.filter((j) => j.inv.status === "paid").reduce((a, j) => a + (myRow(j)?.amt || 0), 0);
  const pickable = shop.contacts.filter((c) => c.kind === nv.kind && !c.archived);

  const createJob = () => {
    const id = uid();
    patch({
      jobs: [{
        id, ro: `RO-${2430 + shop.jobs.length}`, clientId: nv.clientId, type: nv.type,
        payer: nv.payer, receipts: [],
        createdAt: todayISO(),
        claim: nv.payer === "insurance" ? { insurer: "", no: "", adjuster: "", deductible: 0 } : null,
        warranty: nv.payer === "warranty" ? { maker: nv.make, campaign: "", claimNo: "", authNo: "", rate: info.warrantyRate } : null,
        v: { year: nv.year || "—", make: nv.make || "Vehicle", model: nv.model || "", trim: nv.trim, color: nv.color,
             paint: nv.paint || "Not recorded yet", vin: nv.vin || "Add at teardown", plate: nv.plate || "—",
             miles: nv.miles || "—", body: nv.body, engine: nv.engine, drive: nv.drive,
             colorName: nv.colorName || colorName(nv.color) },
        stage: "intake", hold: false, dropped: "Today", promised: nv.promised || "Not set",
        crew: [], flatPay: {}, photos: [], msgs: [],
        requested: picked,
        notes: (picked.length || brief.trim())
          ? [{ id: uid(), by: me.name, at: now(),
               body: [picked.join(" · "), brief.trim()].filter(Boolean).join("\n") }]
          : [],
        ccc: nv.type === "mechanical" ? { complaint: "", cause: "", correction: "" } : undefined,
        service: nv.type === "maintenance" ? { nextDue: "", items: newChecklist() } : undefined,
        est: { status: "draft", lines: [] }, inv: { status: "unpaid" },
      }, ...shop.jobs],
    });
    setNv({ ...blankVehicle, type: "collision", payer: "customer", kind: "private", clientId: "", promised: "" });
    setPicked([]); setBrief("");
    setSheet(null); setOpenId(id); setView("jobs"); toast("Job started");
  };

  const saveContact = (c, keepOpen) => {
    const exists = shop.contacts.some((x) => x.id === c.id);
    patch({ contacts: exists ? shop.contacts.map((x) => (x.id === c.id ? c : x)) : [...shop.contacts, c] });
    if (keepOpen) { setEditContact(c); return; }
    setEditContact(null);

    // came from the check-in sheet, so drop straight back with them chosen
    if (c.forJob && !exists) {
      setNv((prev) => ({ ...prev, kind: c.kind, clientId: c.id }));
      toast(`${c.name} added and selected`);
      return;
    }
    toast(exists ? "Saved" : `${c.kind === "dealer" ? "Dealership" : "Customer"} added`);
  };
  const removeStaff = (st) => {
    const hours = shop.jobs.flatMap((j) => j.est.lines).filter((l) => l.who === st.id).reduce((a, l) => a + (+l.q || 0), 0);
    const onJobs = shop.jobs.filter((j) => j.crew.includes(st.id)).length;
    const clean = hours === 0 && onJobs === 0;

    setConfirming({
      title: clean ? `Remove ${st.name}?` : `Remove ${st.name} from the shop?`,
      body: clean
        ? "They have no hours booked and aren't on any job, so nothing depends on them."
        : "Their login stops working straight away and they come off the crew lists. Their name stays on past estimates and payouts, because removing it would change what those jobs say happened.",
      losing: clean
        ? ["Their login and their pay setup"]
        : [`${hours} booked ${hours === 1 ? "hour" : "hours"} stays on the record`,
           `Comes off ${onJobs} ${onJobs === 1 ? "job" : "jobs"} they're on now`,
           "Their login stops working"],
      danger: true, cta: clean ? "Remove them" : "Remove them from the shop",
      onYes: async () => {
        try {
          const { error } = await sb.rpc("revoke_staff", { p_email: st.email });
          if (error) throw new Error(error.message);
        } catch (e) { toast(e.message); setConfirming(null); return; }

        if (clean) {
          patch({ staff: shop.staff.filter((x) => x.id !== st.id) });
        } else {
          patch({
            staff: shop.staff.map((x) => (x.id === st.id ? { ...x, active: false, payout: "disabled" } : x)),
            jobs: shop.jobs.map((j) => ({ ...j, crew: j.crew.filter((c) => c !== st.id) })),
          });
        }
        setEditStaff(null); setConfirming(null); toast(`${st.name.split(" ")[0]} removed`);
      },
    });
  };

  const saveStaff = async (st) => {
    const exists = shop.staff.some((x) => x.id === st.id);
    patch({ staff: exists ? shop.staff.map((x) => (x.id === st.id ? st : x)) : [...shop.staff, st] });
    setEditStaff(null);
    if (exists) { toast("Saved"); return; }
    try {
      const { data, error } = await sb.from("staff_invites").insert({
        shop_id: shopId, email: st.email.trim().toLowerCase(), name: st.name, title: st.title, role: "tech",
        pay_type: st.payType, hourly_rate: st.hourlyRate, percent: st.percent, flat_amount: st.flat,
      }).select().single();
      if (error) throw new Error(error.message);
      setInviteLink({
        name: st.name, email: st.email, phone: "",
        url: `${window.location.origin}${window.location.pathname}?join=${data.token}`,
      });
    } catch (e) { toast("Added, but the invite link failed: " + e.message); }
  };
  const submitTicket = (t) => {
    const ref = `CC-${1040 + shop.tickets.length}`;
    patch({ tickets: [{ ...t, id: uid(), ref, by: me.name, at: now(), status: "open" }, ...shop.tickets] });
    setTicket(null);
    toast(`Ticket ${ref} submitted`);
  };
  /* Photos go to Supabase Storage. The shop record only keeps the path. */
  const uploadPhotos = async (job, files, label) => {
    const added = [];
    for (const f of files) {
      try {
        const blob = f.type === "image/jpeg" && f.size < 400000 ? f : await shrinkToBlob(f, 1600, 0.72);
        const path = `${shopId}/${job.id}/${uid()}${Date.now()}.jpg`;
        const { error } = await sb.storage.from("job-photos")
          .upload(path, blob, { contentType: "image/jpeg", upsert: false });
        if (error) throw new Error(error.message);
        added.push({ id: uid(), path, label, at: now() });
      } catch (e) {
        toast("A photo didn't save: " + e.message);
      }
    }
    return added;
  };

  const removePhoto = async (p) => {
    if (!p.path) return;
    try { await sb.storage.from("job-photos").remove([p.path]); } catch {}
  };

  /* Creates real portal access and hands back the link to send. */
  const inviteClient = async (contact, person, singleJobId) => {
    const { data, error } = await sb.from("portal_access").insert({
      shop_id: shopId,
      kind: contact.kind === "dealer" ? "account" : "link",
      client_key: contact.id,
      job_key: singleJobId || null,
      name: person.name, email: person.email || null, phone: person.phone || null,
      perms: person.perms?.length ? person.perms : ["status", "message"],
    }).select().single();
    if (error) { toast(error.message); return null; }
    const base = window.location.href.replace(/[^/]*$/, "");
    return `${base}portal.html?t=${data.token}`;
  };

  const uploadLogo = async (e) => {
    const f = e.target.files?.[0]; e.target.value = "";
    if (!f) return;
    try { setInfo("logo", await shrink(f, 320, 0.85)); toast("Logo updated"); } catch { toast("Couldn't read that image"); }
  };

  const TABS = owner
    ? [["home", "⌂", "Home"], ["jobs", "◱", "Shop Floor"], ["money", "$", "Money"], ["clients", "☰", "Clients"], ["set", "⚙", "Settings"]]
    : [["home", "⌂", "Home"], ["jobs", "◱", "My jobs"], ["money", "$", "My pay"], ["set", "⚙", "Settings"]];

  const Bell = () => (
    <button className="bell" onClick={() => { setView("alerts"); setOpenId(null); }} aria-label="Alerts">
      ◔{unreadCount > 0 && <span className="badge">{unreadCount > 9 ? "9+" : unreadCount}</span>}
    </button>
  );

  const ShopBar = () => (
    <div className="shopbar">
      {info.logo
        ? <img src={info.logo} alt="" />
        : <span className="paint" style={{ background: theme.paint }} />}
      <span className="nm">{info.name}</span>
      <button onClick={() => setMenuOpen(true)} aria-label="Your account">
        <Avatar person={me} size={28} />
      </button>
    </div>
  );

  return (
    <div className="bs" style={themeVars(info.theme, mode)}>
      <style>{CSS}</style>
      <ShopBar />

      {view === "home" && (() => {
        const todos = visible
          .map((j) => ({ j, n: nextStep(j, me, info, clientOf(j)) }))
          .filter((x) => x.n)
          .sort((a, b) => (a.n.pri || 9) - (b.n.pri || 9));
        const groups = [];
        todos.forEach((t) => {
          const g = groups.find((x) => x.name === t.n.group);
          if (g) g.items.push(t); else groups.push({ name: t.n.group, pri: t.n.pri, items: [t] });
        });
        const hour = new Date().getHours();
        const greet = hour < 12 ? "Morning" : hour < 17 ? "Afternoon" : "Evening";

        return (
          <>
            <div className="hero">
              <div className="row">
                <div>
                  <h1>{greet}, {me.name.split(" ")[0]}</h1>
                  <p className="sub">
                    {todos.length === 0
                      ? "Nothing waiting on you."
                      : `${todos.length} ${todos.length === 1 ? "vehicle needs" : "vehicles need"} something from you.`}
                  </p>
                </div>
                <Bell />
              </div>
            </div>

            <div className="stats">
              <div className="stat">
                <div className="n">{activeCount}</div>
                <div className="l">{activeCount === 1 ? "vehicle" : "vehicles"} in the shop</div>
              </div>
              {owner ? (
                <>
                  <div className="stat">
                    <div className="n">{usd(unpaid)}</div>
                    <div className="l">still to collect</div>
                  </div>
                  <div className="stat">
                    <div className="n">{visible.filter((j) => isLast(j)).length}</div>
                    <div className="l">ready to go home</div>
                  </div>
                </>
              ) : (
                <>
                  <div className="stat">
                    <div className="n">{usd(myEarned - myPaid)}</div>
                    <div className="l">coming to you</div>
                  </div>
                  <div className="stat">
                    <div className="n">{usd(myPaid)}</div>
                    <div className="l">paid out so far</div>
                  </div>
                </>
              )}
            </div>

            <div className="pad">
              {(() => {
                const today = todayISO();
                const on = shiftsOn(shop, today);
                const mine = myShift(shop, me.id, today);
                const next = !mine && !owner
                  ? Array.from({ length: 14 }, (_, i) => addDays(today, i + 1)).find((d) => myShift(shop, me.id, d))
                  : null;
                if (!on.length && !next && !owner) return null;

                return (
                  <div className="card" style={{ marginBottom: 12 }}>
                    <div className="row" style={{ marginBottom: on.length ? 10 : 0 }}>
                      <span style={{ fontWeight: 600, fontSize: 15.5 }}>
                        {mine ? `You're in ${shiftLabel(mine)}` : on.length ? "In today" : "Nobody scheduled today"}
                      </span>
                      {owner && (
                        <button className="chip" onClick={() => { setSchedWeek(today); setSchedDay(today); setView("sched"); }}>
                          Schedule
                        </button>
                      )}
                    </div>
                    {on.map((sh) => {
                      const who = shop.staff.find((x) => x.id === sh.staffId);
                      if (!who) return null;
                      return (
                        <div className="line" key={sh.id}>
                          <Avatar person={who} size={26} />
                          <span style={{ flex: 1 }}>{who.id === me.id ? "You" : who.name}</span>
                          <span className="money" style={{ fontSize: 14 }}>{shiftLabel(sh)}</span>
                        </div>
                      );
                    })}
                    {next && (
                      <p className="sub" style={{ marginBottom: 0 }}>
                        You're next in on {dayName(next, true)}, {dayLabel(next)}.
                      </p>
                    )}
                    {!owner && !mine && !next && on.length > 0 && (
                      <p className="sub" style={{ marginBottom: 0 }}>You're not down for today.</p>
                    )}
                  </div>
                );
              })()}

              {owner && (
                <div className="quick">
                  <button className="btn" data-v="tape" onClick={() => setSheet("job")}>Check in a vehicle</button>
                  <button className="btn" data-v="quiet" style={{ width: 100 }}
                    onClick={() => { setView("jobs"); setFilter("all"); }}>Shop Floor</button>
                  <button className="btn" data-v="quiet" style={{ width: 92 }} onClick={() => setView("parts")}>Parts</button>
                </div>
              )}

            {owner && (() => {
                const steps = [
                  { done: !!(info.phone && info.address), label: "Add your address and phone",
                    why: "They print on every estimate and invoice.", go: () => setView("set") },
                  { done: shop.contacts.length > 0, label: "Add a client",
                    why: "A dealership or a private customer. Jobs hang off them.",
                    go: () => { setView("clients"); setContactFilter("private"); } },
                  { done: shop.jobs.length > 0, label: "Check a vehicle in",
                    why: "Decode the VIN and it fills most of the form for you.", go: () => setSheet("job") },
                  { done: shop.staff.length > 1, label: "Invite your crew",
                    why: "They pick their own password and only see their own jobs.", go: () => setView("team") },
                ];
                const left = steps.filter((x) => !x.done);
                if (left.length === 0) return null;
                return (
                  <div className="card setup" style={{ marginBottom: 14 }}>
                    <div style={{ fontWeight: 600, fontSize: 15.5, marginBottom: 2 }}>Getting set up</div>
                    <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 8 }}>
                      {steps.length - left.length} of {steps.length} done. Skip anything you don't need.
                    </div>
                    {steps.map((x) => (
                      <button className="line" key={x.label} style={{ width: "100%", textAlign: "left" }}
                        onClick={x.done ? undefined : x.go}>
                        <span className="tick" data-done={x.done ? "1" : "0"}>✓</span>
                        <span style={{ flex: 1, minWidth: 0 }}>
                          <span style={{ display: "block", fontWeight: 500, color: x.done ? "var(--muted)" : "var(--text)" }}>{x.label}</span>
                          {!x.done && <span style={{ display: "block", fontSize: 12, color: "var(--muted)" }}>{x.why}</span>}
                        </span>
                        {!x.done && <span className="chip" data-t="warn">Do it</span>}
                      </button>
                    ))}
                  </div>
                );
              })()}

              {todos.length === 0 ? (
                <div className="card" style={{ textAlign: "center", padding: 30, color: "var(--muted)" }}>
                  {shop.jobs.length === 0
                    ? "No jobs yet. Check a vehicle in and this fills up."
                    : "You're clear. Everything in the shop is where it should be."}
                </div>
              ) : (<>
                {(() => {
                  const clear = visible.filter((j) => !nextStep(j, me, info, clientOf(j)) && !isLast(j));
                  if (!clear.length) return null;
                  return (
                    <p className="sub" style={{ margin: "0 0 12px" }}>
                      {clear.length} other {clear.length === 1 ? "vehicle is" : "vehicles are"} moving along fine.
                    </p>
                  );
                })()}
                {groups.map((g) => (
                <div key={g.name}>
                  <div className="head">{g.name} · {g.items.length}</div>
                  <div className="card">
                    {g.items.map(({ j, n }) => (
                      <button className="todo" key={j.id} onClick={() => { setView("jobs"); setOpenId(j.id); }}>
                        <span className="pri" data-p={n.pri} />
                        <span style={{ flex: 1, minWidth: 0 }}>
                          <span style={{ display: "block", fontWeight: 600, fontSize: 15 }}>
                            {j.v.year} {j.v.make} {j.v.model}
                          </span>
                          <span style={{ display: "block", fontSize: 13, color: "var(--muted)", lineHeight: 1.35 }}>
                            {n.title}
                          </span>
                          <span style={{ display: "block", fontSize: 11.5, color: "var(--muted)", marginTop: 2 }}>
                            {j.ro}{j.stockNo ? ` · stock ${j.stockNo}` : ""} · due {j.promised}
                          </span>
                        </span>
                        <span className="chip" data-t={n.pri <= 2 ? "warn" : ""} style={{ flex: "none" }}>{n.cta}</span>
                      </button>
                    ))}
                  </div>
                </div>
                ))}
              </>)}
            </div>
          </>
        );
      })()}

      {view === "jobs" && job && (
        <JobDetail job={job} client={clientOf(job)} me={me} staff={shop.staff} info={info}
          integrations={integrations} shopAll={shop} back={() => setOpenId(null)} update={update} toast={toast}
          uploadPhotos={uploadPhotos} removePhoto={removePhoto} />
      )}

      {view === "jobs" && !job && (
        <>
          <div className="bar">
            <div className="row">
              <div style={{ display: "flex", gap: 11, alignItems: "center", minWidth: 0 }}>
                {info.logo && <img className="logo" src={info.logo} alt="" />}
                <div style={{ minWidth: 0 }}>
                  <h1>{owner ? "Shop Floor" : "My jobs"}</h1>
                  <p className="sub">
                    {activeCount} {activeCount === 1 ? "vehicle" : "vehicles"} in
                    {owner ? <> · <span className="money">{usd(unpaid)}</span> out</> : <> · <span className="money">{usd(myEarned - myPaid)}</span> coming</>}
                  </p>
                </div>
              </div>
              <Bell />
            </div>
          </div>
          <div className="pad wide">
            <div className="seg" data-wrap="1">
              {[["all", "All"], ["collision", "Body"], ["mechanical", "Mech"], ["maintenance", "Service"],
                ["private", "Private"], ["dealer", "Dealerships"], ["hold", "On hold"], ["done", "Ready"]].map(([k, l]) => (
                <button key={k} data-on={filter === k ? "1" : "0"} onClick={() => setFilter(k)}>{l}</button>
              ))}
            </div>
            {shown.length ? shown.map((j) => (
              <JobCard key={j.id} job={j} client={clientOf(j)} taxPct={info.tax} unread={jobUnread(j.id)}
                hint={nextStep(j, me, info, clientOf(j))?.title} onOpen={() => setOpenId(j.id)} />
            )) : <div className="card" style={{ textAlign: "center", padding: 32, color: "var(--muted)" }}>
                  {owner ? "Nothing here. Check in a vehicle to start a job." : "No jobs assigned to you right now."}
                </div>}
          </div>
          {owner && <button className="fab" onClick={() => setSheet("job")} aria-label="Check in a vehicle">+</button>}
        </>
      )}

      {/* ── ALERTS ── */}
      {view === "alerts" && (
        <>
          <div className="bar">
            <button onClick={() => setView("jobs")} style={{ fontSize: 14, color: "var(--muted)", marginBottom: 8 }}>‹ Back</button>
            <div className="row">
              <div><h1>Alerts</h1><p className="sub">{unreadCount ? `${unreadCount} new` : "All caught up"}</p></div>
              {unreadCount > 0 && <button className="chip" onClick={markAllRead}>Mark all read</button>}
            </div>
          </div>
          <div className="pad">
            {myNotifs.length === 0 && (
              <div className="card" style={{ textAlign: "center", padding: 32, color: "var(--muted)" }}>
                Nothing yet. Move a job forward or leave a note and everyone attached to it hears about it here.
              </div>
            )}
            {myNotifs.length > 0 && (
              <div className="card">
                {myNotifs.map((n) => {
                  const j = shop.jobs.find((x) => x.id === n.jobId);
                  const isNew = !n.read.includes(me.id);
                  return (
                    <button className="notif" key={n.id} data-new={isNew ? "1" : "0"} onClick={() => {
                      patch({ notifs: shop.notifs.map((x) => (x.id === n.id && !x.read.includes(me.id) ? { ...x, read: [...x.read, me.id] } : x)) });
                      if (j) { setView("jobs"); setOpenId(j.id); }
                    }}>
                      <span className="nkind">{NKIND[n.kind] || "•"}</span>
                      <span style={{ flex: 1, minWidth: 0 }}>
                        <span style={{ display: "block", fontWeight: isNew ? 600 : 500, fontSize: 14.5 }}>{n.title}</span>
                        <span style={{ display: "block", fontSize: 13, color: "var(--muted)", lineHeight: 1.35 }}>{n.body}</span>
                        <span style={{ display: "block", fontSize: 11.5, color: "var(--muted)", marginTop: 3 }}>
                          {n.at}{n.toClient ? " · client notified" : ""}
                        </span>
                      </span>
                    </button>
                  );
                })}
              </div>
            )}
            <p className="sub">
              Everyone assigned to a vehicle gets its alerts, and the owner gets all of them. Items marked
              "client notified" also went out to the customer or dealership by text and email.
            </p>
          </div>
        </>
      )}

      {/* ── MONEY ── */}
      {view === "parts" && owner && (() => {
        const need = [];
        shop.jobs.forEach((j) => {
          (j.est?.lines || []).forEach((l) => {
            if (l.t !== "part") return;
            const st = l.ps || "needed";
            if (st === "received") return;
            need.push({ job: j, line: l, st });
          });
        });
        const groups = {};
        need.forEach((x) => {
          const k = x.line.supplier?.trim() || "No supplier yet";
          (groups[k] = groups[k] || []).push(x);
        });
        const outstandingCost = need.reduce((a, x) => a + (+x.line.cost || 0) * (+x.line.q || 1), 0);

        const setStatus = (job, lineId, ps) => {
          const lines = job.est.lines.map((l) => (l.id === lineId ? { ...l, ps } : l));
          patch({ jobs: shop.jobs.map((j) => (j.id === job.id
            ? { ...j, est: { ...j.est, lines }, hold: lines.some((l) => l.t === "part" && l.ps === "backorder") }
            : j)) });
        };

        return (
          <>
            <div className="bar">
              <button onClick={() => setView("home")} style={{ fontSize: 14, color: "var(--muted)", marginBottom: 8 }}>‹ Home</button>
              <div className="row">
                <div><h1>Parts</h1>
                  <p className="sub">{need.length} outstanding{outstandingCost > 0 ? ` · ${usd(outstandingCost)} at cost` : ""}</p></div>
                <Bell />
              </div>
            </div>

            <div className="pad wide">
              {need.length === 0 && (
                <div className="card" style={{ textAlign: "center", padding: 32, color: "var(--muted)" }}>
                  Nothing waiting on parts. Every part on every job is in.
                </div>

              {Object.entries(groups).map(([supplier, items]) => (
                <div className="card" key={supplier}>
                  <div className="row" style={{ marginBottom: 10 }}>
                    <span style={{ fontWeight: 600, fontSize: 15.5 }}>{supplier}</span>
                    <span className="chip">{items.length}</span>
                  </div>

                  {items.map(({ job: j, line: l, st }) => {
                    const meta = PART_STATES.find((x) => x.id === st);
                    return (
                      <div className="line" key={l.id} style={{ alignItems: "flex-start" }}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontWeight: 500 }}>{l.q > 1 ? `${l.q} × ` : ""}{l.d}</div>
                          <div style={{ fontSize: 12, color: "var(--muted)" }}>
                            {j.v.year} {j.v.make} {j.v.model} · {j.ro}
                            {l.eta ? ` · due ${l.eta}` : ""}
                          </div>
                        </div>
                        <div style={{ display: "flex", gap: 6, flex: "none" }}>
                          <span className="chip" data-t={meta.t}>{meta.label}</span>
                          {st === "needed" && (
                            <button className="chip" data-t="blue" onClick={() => setStatus(j, l.id, "ordered")}>Ordered</button>
                          )}
                          {st !== "received" && (
                            <button className="chip" data-t="ok" onClick={() => setStatus(j, l.id, "received")}>In</button>
                          )}
                        </div>
                      </div>
                    );
                  })}

                  <button className="btn sm" data-v="quiet" style={{ marginTop: 12 }}
                    onClick={async () => {
                      const text = [`Parts order — ${info.name}`, ""].concat(
                        items.map(({ job: j, line: l }) =>
                          `${l.q > 1 ? l.q + " x " : ""}${l.d}  —  ${j.v.year} ${j.v.make} ${j.v.model}` +
                          (j.v.vin && j.v.vin.length === 17 ? `  VIN ${j.v.vin}` : "") + `  (${j.ro})`)
                      ).join("\n");
                      try { await navigator.clipboard.writeText(text); toast("Order list copied"); }
                      catch { toast("Couldn't copy — long-press to select"); }
                    }}>
                    Copy this list to send
                  </button>
                </div>
              ))}

              {need.length > 0 && (
                <p className="sub">
                  Ordering straight through PartsTech or Nexpart needs their API keys held on a server,
                  which isn't built yet. Until then this puts everything in one place with the VIN attached,
                  which is what a counter person asks for anyway.
                </p>
              )}
            </div>
          </>
        );
      })()}

      {view === "reports" && owner && (() => {
        const from = reportRange === "all" ? null
          : reportRange === "30" ? addDays(todayISO(), -30)
          : reportRange === "90" ? addDays(todayISO(), -90)
          : todayISO().slice(0, 8) + "01";
        const R = reportOn(shop, info, clientOf, from);
        const Bar = ({ label, amount, of }) => (
          <div style={{ marginBottom: 10 }}>
            <div className="row" style={{ fontSize: 13.5 }}>
              <span>{label}</span>

          const copied = [];

            });
          });
          if (!copied.length) { toast("Nothing to copy"); return; }

          toast(`${copied.length} shifts copied forward`);
