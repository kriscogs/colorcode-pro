function ShopfloorPro() {
  const [phase, setPhase] = useState("loading");   // loading | auth | noshop | ready
  const [shop, setShop] = useState(null);          // this shop's whole record
  const [shopId, setShopId] = useState(null);
  const [account, setAccount] = useState(null);    // the Supabase user
  const [inviteLink, setInviteLink] = useState(null);
  const [draft, setDraft] = useState(null);   // unsaved Settings edits
  const [confirming, setConfirming] = useState(null);
  const [intake, setIntake] = useState(null);
  const [view, setView] = useState("home");
  const [openId, setOpenId] = useState(null);
  const [filter, setFilter] = useState("all");
  const [sheet, setSheet] = useState(null);
  const [msg, setMsg] = useState("");
  const [editContact, setEditContact] = useState(null);
  const [editStaff, setEditStaff] = useState(null);
  const [contactFilter, setContactFilter] = useState("dealer");
  const [ticket, setTicket] = useState(null);
  const [portalOf, setPortalOf] = useState(null);
  const logoRef = useRef(null);

  const blankVehicle = { year: "", make: "", model: "", trim: "", vin: "", plate: "", miles: "", color: "#8C9196", body: "", engine: "", drive: "", paint: "" };
  /* type: collision | mechanical | maintenance */
  const [nv, setNv] = useState({ ...blankVehicle, type: "collision", payer: "customer", kind: "private", clientId: "", promised: "" });
  const [picked, setPicked] = useState([]);
  const [brief, setBrief] = useState("");

  /* ── boot: follow the Supabase session ── */
  useEffect(() => {
    if (!sb) { setPhase("config"); return; }
    let alive = true;
    const handle = (session) => { if (alive) resolve(session); };
    sb.auth.getSession().then(({ data }) => handle(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_e, session) => handle(session));
    return () => { alive = false; sub?.subscription?.unsubscribe(); };
  }, []);

  async function resolve(session) {
    if (!session) { setPhase("auth"); setShop(null); setAccount(null); return; }
    setAccount(session.user);

    // redeem an invite link if one brought us here
    const token = new URLSearchParams(window.location.search).get("join");
    if (token) {
      try { await sb.rpc("accept_staff_invite", { invite: token }); } catch {}
      window.history.replaceState({}, "", window.location.pathname);
    }

    try {
      const id = await myShopId();
      if (!id) { setPhase("noshop"); return; }
      setShopId(id);

      let blob = await readBlob(id);
      if (!blob) {
        const { data: row } = await sb.from("shops").select("name,city").eq("id", id).maybeSingle();
        blob = blankShop(id, row?.name, row?.city, {
          id: session.user.id, name: session.user.email.split("@")[0], email: session.user.email,
        });
        await writeBlob(id, blob);
      }

      // make sure whoever just signed in exists in the staff list
      const email = session.user.email.toLowerCase();
      if (!blob.staff.some((x) => (x.email || "").toLowerCase() === email)) {
        const { data: srow } = await sb.from("staff").select("name,role,title").eq("id", session.user.id).maybeSingle();
        const name = srow?.name || email.split("@")[0];
        blob = { ...blob, staff: [...blob.staff, {
          id: session.user.id, name, email, role: srow?.role === "owner" ? "owner" : "tech",
          title: srow?.title || "Technician", init: initialsOf(name), bank: null, payout: "pending",
          payType: "hourly", hourlyRate: 34, percent: 45, flat: 150, mode: null,
        }] };
        await writeBlob(id, blob);
      }

      setShop(blob);
      setPhase("ready");
    } catch (e) {
      setPhase("noshop");
    }
  }

  const saveShop = async (next) => {
    setShop(next);
    try { await writeBlob(shopId, next); }
    catch (e) { setMsg("Couldn't save — " + e.message); setTimeout(() => setMsg(""), 4000); }
  };
  const toast = (t) => { setMsg(t); setTimeout(() => setMsg(""), 2400); };

  const doSignIn = async (email, password) => {
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password });
    if (error) throw new Error(friendly(error.message));
  };

  const doSignUpShop = async (f) => {
    const { data, error } = await sb.auth.signUp({ email: f.email.trim(), password: f.pass });
    if (error) throw new Error(friendly(error.message));
    if (!data.session) throw new Error("Account made. Confirm your email, then sign in — or switch off email confirmation in Supabase.");
    const { data: newId, error: e2 } = await sb.rpc("create_shop_for_owner", {
      shop_name: f.shop.trim(), owner_name: f.name.trim(), shop_city: f.city?.trim() || null,
    });
    if (e2) throw new Error(e2.message);
    await writeBlob(newId, blankShop(newId, f.shop.trim(), f.city?.trim(), {
      id: data.user.id, name: f.name.trim(), email: f.email.trim().toLowerCase(),
    }));
    await resolve((await sb.auth.getSession()).data.session);
  };

  const doCreateShop = async (f) => {
    const { data: newId, error } = await sb.rpc("create_shop_for_owner", {
      shop_name: f.shop.trim(), owner_name: f.name.trim(), shop_city: f.city?.trim() || null,
    });
    if (error) throw new Error(error.message);
    await writeBlob(newId, blankShop(newId, f.shop.trim(), f.city?.trim(), {
      id: account.id, name: f.name.trim(), email: account.email.toLowerCase(),
    }));
    await resolve((await sb.auth.getSession()).data.session);
  };

  const doJoin = async (pasted) => {
    const m = pasted.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
    if (!m) throw new Error("That doesn't look like an invite link.");
    const { error } = await sb.rpc("accept_staff_invite", { invite: m[0] });
    if (error) throw new Error(error.message);
    await resolve((await sb.auth.getSession()).data.session);
  };

  const signOut = async () => { await sb.auth.signOut(); setOpenId(null); setView("home"); };

  const loadIntake = async () => {
    const { data, error } = await sb.rpc("my_intake");
    if (!error && data) setIntake(data);
  };

  if (phase === "config") return <NeedsConfig />;
  if (phase === "loading") return <div className="bs plain" style={themeVars("gaz", "light")}><style>{CSS}</style><div className="pad" style={{ paddingTop: 60, color: "#657482" }}>Opening the shop…</div></div>;
  if (phase === "auth") return <Auth onSignIn={doSignIn} onSignUpShop={doSignUpShop}
    onReset={(email) => sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href })} />;
  if (phase === "noshop") return <NoShop email={account?.email} onCreate={doCreateShop} onJoin={doJoin} onSignOut={signOut} />;

  const me = shop.staff.find((x) => (x.email || "").toLowerCase() === (account?.email || "").toLowerCase()) || shop.staff[0];
  const owner = me.role === "owner";
  const info = shop.info;
  const mode = me.mode || info.mode || "light";
  const theme = THEMES[info.theme] || THEMES.gaz;
  const clientOf = (j) => shop.contacts.find((c) => c.id === j.clientId);

  const patch = (fields) => saveShop({ ...shop, ...fields });
  const setInfo = (k, v) => patch({ info: { ...info, [k]: v } });

  /* Typed settings go into a draft first, so nothing saves until you say so.
     Pickers like the theme and the logo still apply straight away. */
  const EDITABLE = ["name", "address", "city", "phone", "email", "bank",
                    "bodyRate", "paintRate", "mechRate", "warrantyRate", "tax", "guarantee", "lateTerms"];
  const field = (k) => (draft && k in draft ? draft[k] : info[k]);
  const setField = (k, v) => setDraft({ ...(draft || {}), [k]: v });
  const dirty = !!draft && EDITABLE.some((k) => k in draft && String(draft[k] ?? "") !== String(info[k] ?? ""));
  const saveSettings = () => {
    const nums = ["bodyRate", "paintRate", "mechRate", "warrantyRate", "tax"];
    const clean = { ...draft };
    nums.forEach((k) => { if (k in clean) clean[k] = +clean[k] || 0; });
    patch({ info: { ...info, ...clean } });
    setDraft(null);
    toast("Settings saved");
  };
  const discardSettings = () => { setDraft(null); toast("Changes discarded"); };
  const setMyMode = (m) => patch({ staff: shop.staff.map((s) => (s.id === me.id ? { ...s, mode: m } : s)) });

  /** Update a job and optionally raise a notification for everyone attached to it. */
  const update = (nextJob, notif) => {
    const jobs = shop.jobs.map((j) => (j.id === nextJob.id ? nextJob : j));
    const notifs = notif
      ? [buildNotif(shop, nextJob, { ...notif, actorId: me.id }), ...shop.notifs].slice(0, 60)
      : shop.notifs;
    patch({ jobs, notifs });
  };

  const myNotifs = shop.notifs.filter((n) => n.to.includes(me.id));
  const unreadCount = myNotifs.filter((n) => !n.read.includes(me.id)).length;
  const jobUnread = (jobId) => shop.notifs.some((n) => n.jobId === jobId && n.to.includes(me.id) && !n.read.includes(me.id));
  const markAllRead = () => patch({
    notifs: shop.notifs.map((n) => (n.to.includes(me.id) && !n.read.includes(me.id) ? { ...n, read: [...n.read, me.id] } : n)),
  });

  const visible = owner ? shop.jobs : shop.jobs.filter((j) => j.crew.includes(me.id));
  const job = visible.find((j) => j.id === openId);
  const shown = visible.filter((j) => {
    if (filter === "all") return true;
    if (filter === "hold") return j.hold;
    if (filter === "done") return isLast(j);
    if (JOB_TYPES.some((t) => t.id === filter)) return (j.type || "collision") === filter;
    return clientOf(j)?.kind === filter;
  });
  const unpaid = visible.reduce((a, j) => a + balanceOf(j, info.tax), 0);
  const activeCount = visible.filter((j) => !isLast(j)).length;
  const myRow = (j) => payouts(j, shop.staff, info).rows.find((r) => r.id === me.id);
  const myEarned = shop.jobs.reduce((a, j) => a + (myRow(j)?.amt || 0), 0);
  const myPaid = shop.jobs.filter((j) => j.inv.status === "paid").reduce((a, j) => a + (myRow(j)?.amt || 0), 0);
  const pickable = shop.contacts.filter((c) => c.kind === nv.kind && !c.archived);

  const createJob = () => {
    const id = uid();
    patch({
      jobs: [{
        id, ro: `RO-${2430 + shop.jobs.length}`, clientId: nv.clientId, type: nv.type,
        payer: nv.payer, receipts: [],
        claim: nv.payer === "insurance" ? { insurer: "", no: "", adjuster: "", deductible: 0 } : null,
        warranty: nv.payer === "warranty" ? { maker: nv.make, campaign: "", claimNo: "", authNo: "", rate: info.warrantyRate } : null,
        v: { year: nv.year || "—", make: nv.make || "Vehicle", model: nv.model || "", trim: nv.trim, color: nv.color,
             paint: nv.paint || "Not recorded yet", vin: nv.vin || "Add at teardown", plate: nv.plate || "—",
             miles: nv.miles || "—", body: nv.body, engine: nv.engine, drive: nv.drive,
             colorName: nv.colorName || colorName(nv.color) },
        stage: "intake", hold: false, dropped: "Today", promised: nv.promised || "Not set",
        crew: [], flatPay: {}, photos: [], msgs: [],
        requested: picked,
        notes: (picked.length || brief.trim())
          ? [{ id: uid(), by: me.name, at: now(),
               body: [picked.join(" · "), brief.trim()].filter(Boolean).join("\n") }]
          : [],
        ccc: nv.type === "mechanical" ? { complaint: "", cause: "", correction: "" } : undefined,
        service: nv.type === "maintenance" ? { nextDue: "", items: newChecklist() } : undefined,
        est: { status: "draft", lines: [] }, inv: { status: "unpaid" },
      }, ...shop.jobs],
    });
    setNv({ ...blankVehicle, type: "collision", payer: "customer", kind: "private", clientId: "", promised: "" });
    setPicked([]); setBrief("");
    setSheet(null); setOpenId(id); setView("jobs"); toast("Job started");
  };

  const saveContact = (c, keepOpen) => {
    const exists = shop.contacts.some((x) => x.id === c.id);
    patch({ contacts: exists ? shop.contacts.map((x) => (x.id === c.id ? c : x)) : [...shop.contacts, c] });
    if (keepOpen) { setEditContact(c); return; }
    setEditContact(null);

    // came from the check-in sheet, so drop straight back with them chosen
    if (c.forJob && !exists) {
      setNv((prev) => ({ ...prev, kind: c.kind, clientId: c.id }));
      toast(`${c.name} added and selected`);
      return;
    }
    toast(exists ? "Saved" : `${c.kind === "dealer" ? "Dealership" : "Customer"} added`);
  };
  const removeStaff = (st) => {
    const hours = shop.jobs.flatMap((j) => j.est.lines).filter((l) => l.who === st.id).reduce((a, l) => a + (+l.q || 0), 0);
    const onJobs = shop.jobs.filter((j) => j.crew.includes(st.id)).length;
    const clean = hours === 0 && onJobs === 0;

    setConfirming({
      title: clean ? `Remove ${st.name}?` : `Remove ${st.name} from the shop?`,
      body: clean
        ? "They have no hours booked and aren't on any job, so nothing depends on them."
        : "Their login stops working straight away and they come off the crew lists. Their name stays on past estimates and payouts, because removing it would change what those jobs say happened.",
      losing: clean
        ? ["Their login and their pay setup"]
        : [`${hours} booked ${hours === 1 ? "hour" : "hours"} stays on the record`,
           `Comes off ${onJobs} ${onJobs === 1 ? "job" : "jobs"} they're on now`,
           "Their login stops working"],
      danger: true, cta: clean ? "Remove them" : "Remove them from the shop",
      onYes: async () => {
        try {
          const { error } = await sb.rpc("revoke_staff", { p_email: st.email });
          if (error) throw new Error(error.message);
        } catch (e) { toast(e.message); setConfirming(null); return; }

        if (clean) {
          patch({ staff: shop.staff.filter((x) => x.id !== st.id) });
        } else {
          patch({
            staff: shop.staff.map((x) => (x.id === st.id ? { ...x, active: false, payout: "disabled" } : x)),
            jobs: shop.jobs.map((j) => ({ ...j, crew: j.crew.filter((c) => c !== st.id) })),
          });
        }
        setEditStaff(null); setConfirming(null); toast(`${st.name.split(" ")[0]} removed`);
      },
    });
  };

  const saveStaff = async (st) => {
    const exists = shop.staff.some((x) => x.id === st.id);
    patch({ staff: exists ? shop.staff.map((x) => (x.id === st.id ? st : x)) : [...shop.staff, st] });
    setEditStaff(null);
    if (exists) { toast("Saved"); return; }
    try {
      const { data, error } = await sb.from("staff_invites").insert({
        shop_id: shopId, email: st.email.trim().toLowerCase(), name: st.name, title: st.title, role: "tech",
        pay_type: st.payType, hourly_rate: st.hourlyRate, percent: st.percent, flat_amount: st.flat,
      }).select().single();
      if (error) throw new Error(error.message);
      setInviteLink({
        name: st.name, email: st.email, phone: "",
        url: `${window.location.origin}${window.location.pathname}?join=${data.token}`,
      });
    } catch (e) { toast("Added, but the invite link failed: " + e.message); }
  };
  const submitTicket = (t) => {
    const ref = `CC-${1040 + shop.tickets.length}`;
    patch({ tickets: [{ ...t, id: uid(), ref, by: me.name, at: now(), status: "open" }, ...shop.tickets] });
    setTicket(null);
    toast(`Ticket ${ref} submitted`);
  };
  /* Photos go to Supabase Storage. The shop record only keeps the path. */
  const uploadPhotos = async (job, files, label) => {
    const added = [];
    for (const f of files) {
      try {
        const blob = f.type === "image/jpeg" && f.size < 400000 ? f : await shrinkToBlob(f, 1600, 0.72);
        const path = `${shopId}/${job.id}/${uid()}${Date.now()}.jpg`;
        const { error } = await sb.storage.from("job-photos")
          .upload(path, blob, { contentType: "image/jpeg", upsert: false });
        if (error) throw new Error(error.message);
        added.push({ id: uid(), path, label, at: now() });
      } catch (e) {
        toast("A photo didn't save: " + e.message);
      }
    }
    return added;
  };

  const removePhoto = async (p) => {
    if (!p.path) return;
    try { await sb.storage.from("job-photos").remove([p.path]); } catch {}
  };

  /* Creates real portal access and hands back the link to send. */
  const inviteClient = async (contact, person, singleJobId) => {
    const { data, error } = await sb.from("portal_access").insert({
      shop_id: shopId,
      kind: contact.kind === "dealer" ? "account" : "link",
      client_key: contact.id,
      job_key: singleJobId || null,
      name: person.name, email: person.email || null, phone: person.phone || null,
      perms: person.perms?.length ? person.perms : ["status", "message"],
    }).select().single();
    if (error) { toast(error.message); return null; }
    const base = window.location.href.replace(/[^/]*$/, "");
    return `${base}portal.html?t=${data.token}`;
  };

  const uploadLogo = async (e) => {
    const f = e.target.files?.[0]; e.target.value = "";
    if (!f) return;
    try { setInfo("logo", await shrink(f, 320, 0.85)); toast("Logo updated"); } catch { toast("Couldn't read that image"); }
  };

  const TABS = owner
    ? [["home", "⌂", "Home"], ["jobs", "◱", "Shop Floor"], ["money", "$", "Money"], ["clients", "☰", "Clients"], ["set", "⚙", "Settings"]]
    : [["home", "⌂", "Home"], ["jobs", "◱", "My jobs"], ["money", "$", "My pay"], ["set", "⚙", "Settings"]];

  const Bell = () => (
    <button className="bell" onClick={() => { setView("alerts"); setOpenId(null); }} aria-label="Alerts">
      ◔{unreadCount > 0 && <span className="badge">{unreadCount > 9 ? "9+" : unreadCount}</span>}
    </button>
  );

  return (
    <div className="bs" style={themeVars(info.theme, mode)}>
      <style>{CSS}</style>

      {view === "home" && (() => {
        const todos = visible
          .map((j) => ({ j, n: nextStep(j, me, info, clientOf(j)) }))
          .filter((x) => x.n)
          .sort((a, b) => (a.n.pri || 9) - (b.n.pri || 9));
        const groups = [];
        todos.forEach((t) => {
          const g = groups.find((x) => x.name === t.n.group);
          if (g) g.items.push(t); else groups.push({ name: t.n.group, pri: t.n.pri, items: [t] });
        });
        const hour = new Date().getHours();
        const greet = hour < 12 ? "Morning" : hour < 17 ? "Afternoon" : "Evening";

        return (
          <>
            <div className="hero">
              <div className="row">
                <div>
                  <h1>{greet}, {me.name.split(" ")[0]}</h1>
                  <p className="sub">
                    {todos.length === 0 ? "Nothing waiting on you." :
                     `${todos.length} thing${todos.length === 1 ? "" : "s"} waiting on you.`}
                  </p>
                </div>
                <Bell />
              </div>
            </div>

            <div className="stats">
              <div className="stat">
                <div className="n">{activeCount}</div>
                <div className="l">{activeCount === 1 ? "vehicle" : "vehicles"} in the shop</div>
              </div>
              {owner ? (
                <>
                  <div className="stat">
                    <div className="n">{usd(unpaid)}</div>
                    <div className="l">still to collect</div>
                  </div>
                  <div className="stat">
                    <div className="n">{visible.filter((j) => isLast(j)).length}</div>
                    <div className="l">ready to go home</div>
                  </div>
                </>
              ) : (
                <>
                  <div className="stat">
                    <div className="n">{usd(myEarned - myPaid)}</div>
                    <div className="l">coming to you</div>
                  </div>
                  <div className="stat">
                    <div className="n">{usd(myPaid)}</div>
                    <div className="l">paid out so far</div>
                  </div>
                </>
              )}
            </div>

            <div className="pad">
              {owner && (
                <div className="quick">
                  <button className="btn" data-v="tape" onClick={() => setSheet("job")}>Check in a vehicle</button>
                  <button className="btn" data-v="quiet" style={{ width: 108 }}
                    onClick={() => { setView("jobs"); setFilter("all"); }}>Shop Floor</button>
                </div>
              )}

            {owner && (() => {

                  { done: shop.contacts.length > 0, label: "Add a client",
                    why: "A dealership or a private customer. Jobs hang off them.",
                    go: () => { setView("clients"); setContactFilter("private"); } },
                  { done: shop.jobs.length > 0, label: "Check a vehicle in",
                    why: "Decode the VIN and it fills most of the form for you.", go: () => setSheet("job") },
                  { done: shop.staff.length > 1, label: "Invite your crew",
                    why: "They pick their own password and only see their own jobs.", go: () => setView("team") },
                ];
                const left = steps.filter((x) => !x.done);
                if (left.length === 0) return null;
                return (
                  <div className="card setup" style={{ marginBottom: 14 }}>
                    <div style={{ fontWeight: 600, fontSize: 15.5, marginBottom: 2 }}>Getting set up</div>
                    <div style={{ fontSize: 13, color: "var(--muted)", marginBottom: 8 }}>
                      {steps.length - left.length} of {steps.length} done. Skip anything you don't need.
                    </div>
                    {steps.map((x) => (
                      <button className="line" key={x.label} style={{ width: "100%", textAlign: "left" }}
                        onClick={x.done ? undefined : x.go}>
                        <span className="tick" data-done={x.done ? "1" : "0"}>✓</span>
                        <span style={{ flex: 1, minWidth: 0 }}>
                          <span style={{ display: "block", fontWeight: 500, color: x.done ? "var(--muted)" : "var(--text)" }}>{x.label}</span>
                          {!x.done && <span style={{ display: "block", fontSize: 12, color: "var(--muted)" }}>{x.why}</span>}
                        </span>
                        {!x.done && <span className="chip" data-t="warn">Do it</span>}
                      </button>
                    ))}
                  </div>
                );
              })()}

              {todos.length === 0 ? (
                <div className="card" style={{ textAlign: "center", padding: 30, color: "var(--muted)" }}>
                  {shop.jobs.length === 0
                    ? "No jobs yet. Check a vehicle in and this fills up."

                </div>
              ) : groups.map((g) => (
                <div key={g.name}>
                  <div className="head">{g.name} · {g.items.length}</div>
                  <div className="card">
                    {g.items.map(({ j, n }) => (
                      <button className="todo" key={j.id} onClick={() => { setView("jobs"); setOpenId(j.id); }}>
                        <span className="pri" data-p={n.pri} />
                        <span style={{ flex: 1, minWidth: 0 }}>
                          <span style={{ display: "block", fontWeight: 600, fontSize: 15 }}>
                            {j.v.year} {j.v.make} {j.v.model}
                          </span>
                          <span style={{ display: "block", fontSize: 13, color: "var(--muted)", lineHeight: 1.35 }}>
                            {n.title}
                          </span>
                          <span style={{ display: "block", fontSize: 11.5, color: "var(--muted)", marginTop: 2 }}>
                            {j.ro}{j.stockNo ? ` · stock ${j.stockNo}` : ""} · due {j.promised}
                          </span>
                        </span>
                        <span className="chip" data-t={n.pri <= 2 ? "warn" : ""} style={{ flex: "none" }}>{n.cta}</span>
                      </button>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </>
        );
      })()}

      {view === "jobs" && job && (
        <JobDetail job={job} client={clientOf(job)} me={me} staff={shop.staff} info={info}
          back={() => setOpenId(null)} update={update} toast={toast}
          uploadPhotos={uploadPhotos} removePhoto={removePhoto} />
      )}

      {view === "jobs" && !job && (
        <>
          <div className="bar">
            <div className="row">
              <div style={{ display: "flex", gap: 11, alignItems: "center", minWidth: 0 }}>
                {info.logo && <img className="logo" src={info.logo} alt="" />}
                <div style={{ minWidth: 0 }}>
                  <h1>{owner ? "Shop Floor" : "My jobs"}</h1>
                  <p className="sub">
                    {info.name} · {activeCount} {activeCount === 1 ? "vehicle" : "vehicles"} in
                    {owner ? <> · <span className="money">{usd(unpaid)}</span> out</> : <> · <span className="money">{usd(myEarned - myPaid)}</span> coming</>}
                  </p>
                </div>
              </div>
              <Bell />
            </div>
          </div>
          <div className="pad">
            <div className="seg" data-wrap="1">
              {[["all", "All"], ["collision", "Body"], ["mechanical", "Mech"], ["maintenance", "Service"],
                ["private", "Private"], ["dealer", "Dealerships"], ["hold", "On hold"], ["done", "Ready"]].map(([k, l]) => (
                <button key={k} data-on={filter === k ? "1" : "0"} onClick={() => setFilter(k)}>{l}</button>
              ))}
            </div>
            {shown.length ? shown.map((j) => (
              <JobCard key={j.id} job={j} client={clientOf(j)} taxPct={info.tax} unread={jobUnread(j.id)}
                hint={nextStep(j, me, info, clientOf(j))?.title} onOpen={() => setOpenId(j.id)} />
            )) : <div className="card" style={{ textAlign: "center", padding: 32, color: "var(--muted)" }}>
                  {owner ? "Nothing here. Check in a vehicle to start a job." : "No jobs assigned to you right now."}
                </div>}
          </div>
          {owner && <button className="fab" onClick={() => setSheet("job")} aria-label="Check in a vehicle">+</button>}
        </>
      )}

      {/* ── ALERTS ── */}
      {view === "alerts" && (
        <>
          <div className="bar">
            <button onClick={() => setView("jobs")} style={{ fontSize: 14, color: "var(--muted)", marginBottom: 8 }}>‹ Back</button>
            <div className="row">
              <div><h1>Alerts</h1><p className="sub">{unreadCount ? `${unreadCount} new` : "All caught up"}</p></div>
              {unreadCount > 0 && <button className="chip" onClick={markAllRead}>Mark all read</button>}
            </div>
          </div>
          <div className="pad">
            {myNotifs.length === 0 && (
              <div className="card" style={{ textAlign: "center", padding: 32, color: "var(--muted)" }}>
                Nothing yet. Move a job forward or leave a note and everyone attached to it hears about it here.
              </div>
            )}
            {myNotifs.length > 0 && (
              <div className="card">
                {myNotifs.map((n) => {
                  const j = shop.jobs.find((x) => x.id === n.jobId);
                  const isNew = !n.read.includes(me.id);
                  return (
                    <button className="notif" key={n.id} data-new={isNew ? "1" : "0"} onClick={() => {
                      patch({ notifs: shop.notifs.map((x) => (x.id === n.id && !x.read.includes(me.id) ? { ...x, read: [...x.read, me.id] } : x)) });
                      if (j) { setView("jobs"); setOpenId(j.id); }
                    }}>
                      <span className="nkind">{NKIND[n.kind] || "•"}</span>
                      <span style={{ flex: 1, minWidth: 0 }}>
                        <span style={{ display: "block", fontWeight: isNew ? 600 : 500, fontSize: 14.5 }}>{n.title}</span>
                        <span style={{ display: "block", fontSize: 13, color: "var(--muted)", lineHeight: 1.35 }}>{n.body}</span>
                        <span style={{ display: "block", fontSize: 11.5, color: "var(--muted)", marginTop: 3 }}>
                          {n.at}{n.toClient ? " · client notified" : ""}
                        </span>
                      </span>
                    </button>
                  );
                })}
              </div>
            )}
            <p className="sub">
              Everyone assigned to a vehicle gets its alerts, and the owner gets all of them. Items marked
              "client notified" also went out to the customer or dealership by text and email.
            </p>
          </div>
        </>
      )}

      {/* ── MONEY ── */}
      {view === "money" && (
        <>
          <div className="bar"><div className="row">
            <div><h1>{owner ? "Money" : "My pay"}</h1><p className="sub">Deposits land the next business day</p></div><Bell />
          </div></div>
          <div className="pad">
            {owner ? (
              <>
                <div className="card">
                  <div className="row">
                    <div><div style={{ fontSize: 13, color: "var(--muted)" }}>Waiting on payment</div>
                      <div className="money" style={{ fontSize: 30 }}>{usd(unpaid)}</div></div>
                    <div style={{ textAlign: "right" }}><div style={{ fontSize: 13, color: "var(--muted)" }}>Collected</div>
                      <div className="money" style={{ fontSize: 30 }}>{usd(shop.jobs.filter((j) => j.inv.status === "paid").reduce((a, j) => a + totalOf(j.est, info.tax), 0))}</div></div>
                  </div>
                </div>
                <div className="head">Invoices</div>
                {shop.jobs.length === 0 && <div className="card" style={{ color: "var(--muted)", fontSize: 14 }}>No invoices yet.</div>}
                {shop.jobs.map((j) => (
                  <button className="card" key={j.id} onClick={() => { setView("jobs"); setOpenId(j.id); }}>
                    <div className="row">
                      <div style={{ minWidth: 0 }}>
                        <div style={{ fontWeight: 600, fontSize: 15 }}>{j.ro} · {j.v.make} {j.v.model}</div>
                        <div style={{ fontSize: 13, color: "var(--muted)" }}>{clientOf(j)?.name}</div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <div className="money" style={{ fontSize: 18 }}>{usd2(totalOf(j.est, info.tax))}</div>
                        <span className="chip" data-t={j.inv.status === "paid" ? "ok" : j.est.status === "approved" ? "warn" : ""} style={{ marginTop: 4 }}>
                          {j.inv.status === "paid" ? "Paid" : j.est.status === "approved" ? "Ready to bill" : j.est.status === "sent" ? "Estimate out" : "Draft"}
                        </span>
                      </div>
                    </div>
                  </button>
                ))}
                <div className="head">Crew payouts on paid jobs</div>
                <div className="card">
                  {shop.staff.filter((s) => s.role === "tech").map((s) => {
                    const earned = shop.jobs.filter((j) => j.inv.status === "paid")
                      .reduce((a, j) => a + (payouts(j, shop.staff, info).rows.find((r) => r.id === s.id)?.amt || 0), 0);
                    return (
                      <div key={s.id} className="line">
                        <span className="avatar" style={{ width: 26, height: 26, fontSize: 10 }}>{s.init}</span>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontWeight: 500 }}>{s.name}</div>
                          <div style={{ fontSize: 12, color: "var(--muted)" }}>
                            {s.payType === "hourly" ? `${usd(s.hourlyRate)}/hr` : s.payType === "percent" ? `${s.percent}% of labor` : `${usd(s.flat)} per job`}
                          </div>
                        </div>
                        <span className="money">{usd2(earned)}</span>
                      </div>
                    );
                  })}
                  {shop.staff.filter((s) => s.role === "tech").length === 0 && <div style={{ color: "var(--muted)", fontSize: 14 }}>No technicians yet.</div>}
                </div>
              </>
            ) : (
              <>
                <div className="card">
                  <div className="row">
                    <div><div style={{ fontSize: 13, color: "var(--muted)" }}>Paid out</div><div className="money" style={{ fontSize: 30 }}>{usd(myPaid)}</div></div>
                    <div style={{ textAlign: "right" }}><div style={{ fontSize: 13, color: "var(--muted)" }}>Still coming</div><div className="money" style={{ fontSize: 30 }}>{usd(myEarned - myPaid)}</div></div>
                  </div>
                  <hr className="hr" />
                  <div style={{ fontSize: 13.5, color: "var(--muted)" }}>
                    {me.payType === "hourly" ? `Paid ${usd(me.hourlyRate)} an hour` : me.payType === "percent" ? `Paid ${me.percent}% of the labor you book` : `Paid ${usd(me.flat)} a job`}
                    {me.bank ? ` · deposits to ${me.bank}` : " · no bank account yet"}
                  </div>
                </div>
                <div className="head">Your jobs</div>
                {visible.map((j) => {
                  const r = myRow(j);
                  if (!r) return null;
                  return (
                    <button className="card" key={j.id} onClick={() => { setView("jobs"); setOpenId(j.id); }}>
                      <div className="row">
                        <div><div style={{ fontWeight: 600, fontSize: 15 }}>{j.v.make} {j.v.model}</div>
                          <div style={{ fontSize: 13, color: "var(--muted)" }}>{r.basis} · {j.inv.status === "paid" ? `paid ${j.inv.when}` : "not yet paid"}</div></div>
                        <span className="money" style={{ fontSize: 18 }}>{usd2(r.amt)}</span>
                      </div>
                    </button>
                  );
                })}
              </>
            )}
          </div>
        </>
      )}

      {/* ── CLIENTS ── */}
      {view === "clients" && owner && (
        <>
          <div className="bar"><div className="row">
            <div><h1>Clients</h1>
              <p className="sub">{shop.contacts.filter((c) => c.kind === "dealer").length} dealerships · {shop.contacts.filter((c) => c.kind === "private").length} customers</p></div>
            <Bell />
          </div></div>
          <div className="pad">
            <div className="seg" data-wrap="1">
              {[["dealer", "Dealerships"], ["private", "Customers"], ["archived", "Archived"]].map(([k, l]) => (
                <button key={k} data-on={contactFilter === k ? "1" : "0"} onClick={() => setContactFilter(k)}>{l}</button>
              ))}
            </div>
            {contactFilter === "archived" && shop.contacts.filter((c) => c.archived).length === 0 && (
              <div className="card" style={{ textAlign: "center", padding: 30, color: "var(--muted)" }}>
                Nobody archived. They'd show here with their jobs still intact.
              </div>
            )}
            {shop.contacts.filter((c) => contactFilter === "archived" ? c.archived : (c.kind === contactFilter && !c.archived)).map((c) => {
              const count = shop.jobs.filter((j) => j.clientId === c.id).length;
              return (
                <button className="card" key={c.id} onClick={() => setEditContact(c)}>
                  <div className="row">
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontWeight: 600, fontSize: 15.5 }}>{c.name}</div>
                      <div style={{ fontSize: 13, color: "var(--muted)" }}>{c.kind === "dealer" ? `${c.contact} · ${c.terms || "no terms set"}` : c.phone}</div>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      {c.archived ? (
                        <span className="chip" data-t="bad" onClick={async (e) => {
                          e.stopPropagation();
                          try { await sb.rpc("restore_client", { p_client_key: c.id }); } catch {}
                          patch({ contacts: shop.contacts.map((x) => (x.id === c.id ? { ...x, archived: false } : x)) });
                          toast("Restored");

            const jobs = shop.jobs.filter((j) => j.clientId === c.id);
            const logins = (c.people || []).length;
            if (jobs.length === 0) {
              setConfirming({
                title: `Delete ${c.name}?`,
                body: "They have no jobs, so nothing else depends on them.",
                losing: [logins ? `${logins} portal ${logins === 1 ? "login" : "logins"}` : "Their details and notes"],
                danger: true, cta: "Delete them",
                onYes: async () => {
                  try { await sb.rpc("revoke_client", { p_client_key: c.id }); } catch {}
                  patch({ contacts: shop.contacts.filter((x) => x.id !== c.id) });
                  setEditContact(null); setConfirming(null); toast("Deleted");
                },
              });
            } else {
              setConfirming({
                title: `Archive ${c.name}?`,
                body: `They have ${jobs.length} ${jobs.length === 1 ? "job" : "jobs"} on record, so deleting them outright would orphan the history. Archiving hides them from your lists and cuts off their logins, but every job, estimate and invoice stays intact.`,
                losing: [logins ? `${logins} portal ${logins === 1 ? "login" : "logins"} stop working` : "Nothing — you can restore them any time"],
                cta: "Archive them",
                onYes: async () => {
                  try { await sb.rpc("revoke_client", { p_client_key: c.id }); } catch {}
                  patch({ contacts: shop.contacts.map((x) => (x.id === c.id ? { ...x, archived: true } : x)) });
                  setEditContact(null); setConfirming(null); toast("Archived");
                },
              });
            }
          }} />
      )}
      {portalOf && (
        <PortalPreview c={portalOf} info={info} taxPct={info.tax}
          jobs={shop.jobs.filter((j) => j.clientId === portalOf.id)} onClose={() => setPortalOf(null)} />
      )}
      {editStaff && (
        <StaffSheet s={editStaff} onSave={saveStaff} onClose={() => setEditStaff(null)}
          onRemove={(!editStaff.isNew && editStaff.id !== me.id && editStaff.role !== "owner")
            ? () => removeStaff(editStaff) : null}
          onRestore={editStaff.active === false
            ? () => {
                patch({ staff: shop.staff.map((x) => (x.id === editStaff.id ? { ...x, active: true, payout: "pending" } : x)) });
                setEditStaff(null); toast("Back on the team — send a fresh invite so they can sign in");
              } : null} />
      )}
      {inviteLink && <InviteSheet i={inviteLink} shopName={info.name} toast={toast} onClose={() => setInviteLink(null)} />}
      {ticket && (
        <TicketSheet t={ticket} jobs={shop.jobs} me={me} shop={shop} theme={theme} mode={mode}
          onSubmit={submitTicket} onClose={() => setTicket(null)} />
      )}
      {dirty && view === "set" && (
        <div className="savebar">
          <span className="note">You have changes that haven't been saved.</span>
          <button className="btn" data-v="quiet" onClick={discardSettings}>Discard</button>
          <button className="btn" data-v="tape" onClick={saveSettings}>Save</button>
        </div>
      )}
      {confirming && <ConfirmSheet {...confirming} onClose={() => setConfirming(null)} />}
      {msg && <div className="toast">{msg}</div>}

      <div className="tabbar">
        {TABS.map(([k, g, l]) => (
          <button key={k} data-on={view === k ? "1" : "0"} onClick={() => { setView(k); setOpenId(null); }}>
            <span className="glyph">{g}</span>{l}
            {k === "set" && dirty && <span className="tdot" />}
          </button>
        ))}
      </div>
    </div>
  );
}

/* ══════════════════  SHEETS  ══════════════════ */

/** Asks before something irreversible. Pass `word` to make them type it out. */
function ConfirmSheet({ title, body, losing, word, cta, danger, onYes, onClose }) {
  const [typed, setTyped] = useState("");
  const ready = !word || typed.trim().toUpperCase() === word.toUpperCase();
  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 8px" }}>{title}</h1>
        <p className="sub" style={{ marginBottom: 14 }}>{body}</p>

        {losing?.length > 0 && (
          <div className="card">
            <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 6 }}>This goes for good</div>
            {losing.map((l) => (
              <div className="line" key={l}><span style={{ flex: 1 }}>{l}</span></div>
            ))}
          </div>
        )}

        {word && (
          <>
            <span className="lab">Type <strong>{word}</strong> to confirm</span>
            <input className="field" autoCapitalize="characters" value={typed}
              onChange={(e) => setTyped(e.target.value)} placeholder={word} />
          </>
        )}

        <button className="btn" data-v={danger ? "danger" : undefined} disabled={!ready} onClick={onYes}>
          {cta}
        </button>
        <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={onClose}>
          Keep everything, take me back
        </button>
      </div>
    </div>
  );
}

function ContactSheet({ c, info, jobs, toast, onSave, onClose, onDelete, onPreview, onInviteClient }) {
  const [f, setF] = useState({ people: [], ...c });
  const [person, setPerson] = useState(null);
  const set = (k, v) => setF({ ...f, [k]: v });
  const dealer = f.kind === "dealer";
  const people = f.people || [];

  /* People changes commit straight away so an invite is never lost in a draft. */
  const commit = (nextPeople) => {
    const merged = { ...f, people: nextPeople, isNew: undefined, contact: dealer ? f.contact || f.name : f.name, rate: +f.rate || 0 };
    setF({ ...merged, isNew: f.isNew });
    onSave(merged, true);
  };

  const invite = async (pp, how) => {
    const link = await onInviteClient(f, pp, null);
    if (!link) return;
    const dealer = f.kind === "dealer";
    const body = dealer
      ? `${pp.name.split(" ")[0]}, you can now follow your vehicles at ${info.name} — status, photos, estimates and invoices. Open this and set a password: ${link}`
      : `${pp.name.split(" ")[0]}, follow your repair at ${info.name} here — photos, updates and your estimate. No app or password needed: ${link}`;
    if (how === "text") window.location.href = `sms:${(pp.phone || "").replace(/\D/g, "")}${/iPhone|iPad|Mac/.test(navigator.userAgent) ? "&" : "?"}body=${encodeURIComponent(body)}`;
    else if (how === "email") window.location.href = `mailto:${pp.email || ""}?subject=${encodeURIComponent(`Your ${info.name} vehicle`)}&body=${encodeURIComponent(body)}`;
    else { try { await navigator.clipboard.writeText(link); toast("Link copied"); } catch { toast(link); } }
    commit(people.map((x) => (x.id === pp.id ? { ...x, portal: "invited", invitedAt: now() } : x)));
  };

  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 16px" }}>{f.isNew ? `New ${dealer ? "dealership" : "customer"}` : f.name}</h1>
        <span className="lab">{dealer ? "Dealership name" : "Full name"}</span>
        <input className="field" value={f.name} onChange={(e) => set("name", e.target.value)} />
        {dealer && (<><span className="lab">Who you deal with</span>
          <input className="field" value={f.contact} onChange={(e) => set("contact", e.target.value)} /></>)}
        <span className="lab">Phone</span>
        <input className="field" inputMode="tel" value={f.phone} onChange={(e) => set("phone", e.target.value)} />
        <span className="lab">Email</span>
        <input className="field" type="email" autoCapitalize="none" value={f.email} onChange={(e) => set("email", e.target.value)} />
        <span className="lab">Address</span>
        <input className="field" value={f.address} onChange={(e) => set("address", e.target.value)} />
        {dealer ? (
          <div style={{ display: "flex", gap: 8 }}>
            <div style={{ flex: 1 }}><span className="lab">Payment terms</span>
              <input className="field" placeholder="Net 30" value={f.terms} onChange={(e) => set("terms", e.target.value)} /></div>
            <div style={{ flex: 1 }}><span className="lab">Their labor rate /hr</span>
              <input className="field" inputMode="decimal" placeholder="62" value={f.rate} onChange={(e) => set("rate", e.target.value.replace(/[^\d.]/g, ""))} /></div>
          </div>
        ) : (
          <div style={{ display: "flex", gap: 8 }}>
            <div style={{ flex: 1 }}><span className="lab">Insurer</span>
              <input className="field" value={f.insurer || ""} onChange={(e) => set("insurer", e.target.value)} /></div>
            <div style={{ flex: 1 }}><span className="lab">Policy number</span>
              <input className="field" value={f.policy || ""} onChange={(e) => set("policy", e.target.value)} /></div>
          </div>
        )}
        <span className="lab">Notes</span>
        <textarea className="field" rows={2} value={f.notes || ""} onChange={(e) => set("notes", e.target.value)} />

        {!f.isNew && (
          <>
            <div className="head">Portal access</div>
            <div className="card">
              {people.length === 0 && (
                <div style={{ color: "var(--muted)", fontSize: 14, paddingBottom: 10 }}>
                  Nobody here can see their vehicles yet.
                </div>
              )}
              {people.map((pp) => (
                <button className="line" key={pp.id} style={{ width: "100%", textAlign: "left" }} onClick={() => setPerson(pp)}>
                  <span className="avatar" style={{ width: 28, height: 28, fontSize: 10 }}>
                    {pp.name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase()}
                  </span>
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <span style={{ display: "block", fontWeight: 500 }}>{pp.name}</span>
                    <span style={{ display: "block", fontSize: 12, color: "var(--muted)" }}>
                      {pp.title || "No title"} · {(pp.perms || []).length} of {PORTAL_PERMS.length} permissions
                    </span>
                  </span>
                  <span className="chip" data-t={pp.portal === "active" ? "ok" : pp.portal === "invited" ? "warn" : ""}>
                    {pp.portal === "active" ? "Active" : pp.portal === "invited" ? "Invited" : "No access"}
                  </span>
                </button>
              ))}
              <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                <button className="btn sm" data-v="quiet" onClick={() => setPerson({
                  id: uid(), name: "", title: dealer ? "Service manager" : "Owner", email: "", phone: f.phone || "",
                  perms: ["status", "message"], portal: "none", isNew: true,
                })}>
                  {dealer ? "Invite someone here" : "Invite the customer"}
                </button>
                {people.some((x) => x.portal === "active") && (
                  <button className="btn sm" data-v="quiet" style={{ width: 118 }} onClick={() => onPreview(f)}>What they see</button>
                )}
              </div>
            </div>
            <p className="sub" style={{ marginBottom: 14 }}>
              {dealer
                ? "Give each person at the dealership their own login. A service manager who can approve and pay, a used car manager who only watches status — their choice of light or dark, your shop's paint color."
                : "One login per person. Handy when a spouse or an adjuster needs to follow the repair too."}
            </p>
          </>
        )}

        <button className="btn" disabled={!f.name.trim()}
          onClick={() => onSave({ ...f, isNew: undefined, forJob: f.forJob || undefined,
            contact: dealer ? f.contact || f.name : f.name, rate: +f.rate || 0 })}>
          {f.isNew ? (f.forJob ? "Add and use them" : "Add") : "Save"}
        </button>
        {f.isNew && <p className="sub" style={{ marginTop: 8 }}>Add them first, then you can send portal invites.</p>}
        {onDelete && !f.isNew && <button className="btn" data-v="danger" style={{ marginTop: 8 }} onClick={onDelete}>Delete</button>}
        <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={onClose}>Cancel</button>
      </div>

      {person && (
        <PersonSheet p={person} dealer={dealer} onClose={() => setPerson(null)}
          onSave={(pp) => {
            const exists = people.some((x) => x.id === pp.id);
            commit(exists ? people.map((x) => (x.id === pp.id ? pp : x)) : [...people, pp]);
            setPerson(null);
          }}
          onInvite={(pp, how) => {
            const exists = people.some((x) => x.id === pp.id);
            if (!exists) commit([...people, pp]);
            invite(pp, how);
            setPerson(null);
          }}
          onRemove={() => { commit(people.filter((x) => x.id !== person.id)); setPerson(null); }} />
      )}
    </div>
  );
}

function PersonSheet({ p, dealer, onSave, onInvite, onRemove, onClose }) {
  const [f, setF] = useState(p);
  const [revoking, setRevoking] = useState(false);
  const set = (k, v) => setF({ ...f, [k]: v });
  const toggle = (id) => set("perms", (f.perms || []).includes(id) ? f.perms.filter((x) => x !== id) : [...(f.perms || []), id]);
  const ready = f.name.trim() && (f.email.trim() || f.phone.trim());
  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 16px" }}>{f.isNew ? "Invite to the portal" : f.name}</h1>
        <span className="lab">Name</span>
        <input className="field" value={f.name} onChange={(e) => set("name", e.target.value)} />
        <span className="lab">{dealer ? "Their job at the dealership" : "Relationship"}</span>
        <input className="field" placeholder={dealer ? "Service manager" : "Owner"} value={f.title} onChange={(e) => set("title", e.target.value)} />
        <span className="lab">Email</span>
        <input className="field" type="email" autoCapitalize="none" value={f.email} onChange={(e) => set("email", e.target.value)} />
        <span className="lab">Mobile</span>
        <input className="field" inputMode="tel" value={f.phone} onChange={(e) => set("phone", e.target.value)} />

        <span className="lab">What they can do</span>
        <div className="card">
          {PORTAL_PERMS.map((perm) => {
            const on = (f.perms || []).includes(perm.id);
            return (
              <button className="line" key={perm.id} style={{ width: "100%", textAlign: "left" }} onClick={() => toggle(perm.id)}>
                <span style={{ flex: 1 }}>{perm.label}</span>
                <span className="chip" data-t={on ? "ok" : ""}>{on ? "Yes" : "No"}</span>
              </button>
            );
          })}
        </div>

        {f.portal !== "none" && (
          <p className="sub" style={{ marginBottom: 12 }}>
            {f.portal === "active" ? `Signed in. Last seen ${f.lastSeen || "recently"}.` : `Invited ${f.invitedAt || "recently"}, hasn't set a password yet.`}
          </p>
        )}

        <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <button className="btn sm" disabled={!ready || !f.phone.trim()} onClick={() => onInvite({ ...f, isNew: undefined }, "text")}>
            {f.portal === "none" ? "Text it" : "Text again"}
          </button>
          <button className="btn sm" disabled={!ready || !f.email.trim()} onClick={() => onInvite({ ...f, isNew: undefined }, "email")}>
            {f.portal === "none" ? "Email it" : "Email again"}
          </button>
          <button className="btn sm" data-v="quiet" style={{ width: 92 }} disabled={!ready}
            onClick={() => onInvite({ ...f, isNew: undefined }, "copy")}>Copy</button>
        </div>
        <p className="sub" style={{ margin: "-2px 0 12px" }}>
          {dealer
            ? "They set a password once, then get in from any device."
            : "The link works straight away with no password. Anyone holding it can see this vehicle, so send it to them directly."}
        </p>
        <button className="btn" data-v="quiet" disabled={!ready} onClick={() => onSave({ ...f, isNew: undefined })}>Save without inviting</button>
        {!f.isNew && (
          revoking ? (
            <div className="card" style={{ borderColor: "var(--flag)" }}>
              <div style={{ fontWeight: 600, marginBottom: 4 }}>Cut off {f.name.split(" ")[0]}?</div>
              <p className="sub" style={{ marginTop: 0, marginBottom: 10 }}>
                Their link stops working straight away and they lose sight of every vehicle.
              </p>
              <div style={{ display: "flex", gap: 8 }}>
                <button className="btn sm" data-v="danger" onClick={onRemove}>Yes, remove them</button>
                <button className="btn sm" data-v="quiet" onClick={() => setRevoking(false)}>Cancel</button>
              </div>
            </div>
          ) : (
            <button className="btn" data-v="danger" style={{ marginTop: 8 }} onClick={() => setRevoking(true)}>
              Remove their access
            </button>
          )
        )}
        <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

function TicketSheet({ t, jobs, me, shop, theme, mode, onSubmit, onClose }) {
  const [f, setF] = useState(t);
  const set = (k, v) => setF({ ...f, [k]: v });
  const j = jobs.find((x) => x.id === f.jobId);
  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 6px" }}>Contact support</h1>
        <p className="sub" style={{ marginBottom: 16 }}>No phone queue. You'll get an email reply, usually within one business day.</p>

        <span className="lab">What's going on</span>
        <select className="field" value={f.cat} onChange={(e) => set("cat", e.target.value)}>
          {TICKET_CATS.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>

        <span className="lab">One-line summary</span>
        <input className="field" placeholder="Estimate total is off by the tax amount" value={f.subject} onChange={(e) => set("subject", e.target.value)} />

        <span className="lab">What happened, and what you expected</span>
        <textarea className="field" rows={5} placeholder="Walk us through it step by step. The more detail the fewer round trips."
          value={f.body} onChange={(e) => set("body", e.target.value)} />

        <span className="lab">Attach a vehicle (optional)</span>
        <select className="field" value={f.jobId} onChange={(e) => set("jobId", e.target.value)}>
          <option value="">Not about a specific vehicle</option>
          {jobs.map((x) => <option key={x.id} value={x.id}>{x.ro} · {x.v.year} {x.v.make} {x.v.model}</option>)}
        </select>

        <div className="card">
          <div style={{ fontSize: 12.5, color: "var(--muted)", marginBottom: 8 }}>Sent with your ticket</div>
          {[
            ["Shop", `${shop.info.name}${shop.info.city ? ` · ${shop.info.city}` : ""}`],
            ["Account", `${me.name} · ${me.email} · ${me.role}`],
            ["Plan", `${shop.sub.status === "intro" ? "Intro" : "Standard"} · month ${shop.sub.used}`],
            ["Theme", `${theme.code} ${theme.name} · ${mode}`],
            ["Vehicle", j ? `${j.ro} · ${j.v.year} ${j.v.make} ${j.v.model} · VIN ${j.v.vin}` : "None"],
            ["Data", `${shop.jobs.length} jobs · ${shop.contacts.length} clients · ${shop.staff.length} on the team`],
          ].map(([k, v]) => (
            <div key={k} className="line" style={{ padding: "6px 0", fontSize: 13 }}>
              <span style={{ color: "var(--muted)", width: 62, flex: "none" }}>{k}</span>
              <span style={{ wordBreak: "break-word" }}>{v}</span>
            </div>
          ))}
        </div>

        <button className="btn" disabled={!f.subject.trim() || !f.body.trim()} onClick={() => onSubmit(f)}>Send to support</button>
        <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={onClose}>Cancel</button>
      </div>
    </div>
  );
}

function InviteSheet({ i, shopName, toast, onClose }) {
  const body = `${i.name.split(" ")[0]}, you're set up on ${shopName}'s job system. Open this to pick a password: ${i.url}`;
  const copy = async () => {
    try { await navigator.clipboard.writeText(i.url); toast("Link copied"); }
    catch { toast("Couldn't copy — select the link and copy it by hand"); }
  };
  return (
    <div className="sheet" onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()}>
        <h1 style={{ fontSize: 22, margin: "0 0 6px" }}>Send {i.name.split(" ")[0]} their link</h1>
        <p className="sub" style={{ marginBottom: 16 }}>
          One use, tied to {i.email}. They open it, pick a password, and land straight in your shop.
        </p>
        <div className="card" style={{ fontFamily: "ui-monospace, monospace", fontSize: 11.5, wordBreak: "break-all", lineHeight: 1.6 }}>
          {i.url}
        </div>
        <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
          <button className="btn sm" onClick={() => { window.location.href = `sms:?body=${encodeURIComponent(body)}`; }}>Text it</button>
          <button className="btn sm" onClick={() => { window.location.href = `mailto:${i.email}?subject=${encodeURIComponent(`Your ${shopName} login`)}&body=${encodeURIComponent(body)}`; }}>Email it</button>
        </div>
        <button className="btn" data-v="quiet" onClick={copy}>Copy the link</button>
        <button className="btn" data-v="quiet" style={{ marginTop: 8 }} onClick={onClose}>Done</button>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<ShopfloorPro />);
</script>
</body>
</html>
